    /* ========================================================================
       6. HỆ THỐNG TRÍ TUỆ NHÂN TẠO Y KHOA (RAG/CAG) & ĐÁNH GIÁ THỰC PHẨM
       ======================================================================== */
    async function generateClinicalResponse(promptText) {
      const scopeCheck = evaluateAiQueryScope(promptText);
      if (scopeCheck.status !== 'in_scope' && scopeCheck.safeResponse) {
        logActivity('security', scopeCheck.status === 'emergency' ? 'danger' : 'warn',
          scopeCheck.status === 'emergency' ? 'Trợ lý AI kích hoạt cảnh báo Cấp cứu 115' : 'Trợ lý AI từ chối vượt phạm vi y tế',
          scopeCheck.reason || 'Bảo vệ giới hạn an toàn lâm sàng.');
        return scopeCheck.safeResponse;
      }

      const q = promptText.toLowerCase();
      const dSummary = summarizeDailyLogs(state.dailyLogs);
      const dailyLogSummary = dSummary.count > 0
        ? `TB Tâm trạng ${dSummary.avgMood}/5, Năng lượng ${dSummary.avgEnergy}/5, Mức đau ${dSummary.avgPain}/10 (${dSummary.count} ngày gần đây${dSummary.latestEntry && dSummary.latestEntry.symptoms && dSummary.latestEntry.symptoms.length ? ', triệu chứng: ' + dSummary.latestEntry.symptoms.join(', ') : ''}).`
        : '';

      // Thử gọi backend API nếu đang chạy trên server Express; nếu mở file:// sẽ tự động fallback sang RAG nội tuyến
      if (window.location.protocol.startsWith('http')) {
        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: promptText,
              history: state.chatHistory.slice(-6).map(m => ({ role: m.role, content: m.content })),
              userContext: state.currentUser ? `${state.currentUser.fullName} (${state.currentUser.role})` : 'Khách',
              dailyLogSummary
            })
          });
          if (res.ok) {
            const data = await res.json();
            if (data && data.reply && !data.reply.includes('fallback')) {
              return data.reply;
            }
          }
        } catch {
          // Bỏ qua khi offline/file:// và sử dụng kho tri thức RAG/CAG bên dưới
        }
      }

      // Truy xuất bài báo liên quan trong kho RAG
      const matchedPapers = state.papers.filter(p =>
        (q.includes('huyết áp') && p.category === 'Tim mạch') ||
        (q.includes('đường') && p.category === 'Tiểu đường') ||
        (q.includes('thuốc') && p.category === 'Dược lý') ||
        (q.includes('đột quỵ') && p.category === 'Đột quỵ') ||
        ((q.includes('muối') || q.includes('dash')) && p.category === 'Dinh dưỡng')
      );

      let baseReply = '';
      if (q.includes('huyết áp') || q.includes('tăng huyết áp') || q.includes('mmhg')) {
        baseReply = `[PHÁC ĐỒ LÂM SÀNG BỘ Y TẾ & THE LANCET STEP-ELDERLY]
1. Huyết áp mục tiêu ở người trên 65 tuổi:
- Mức tối ưu khuyến nghị: Tâm thu 120–130 mmHg và Tâm trương 70–80 mmHg (nếu dung nạp tốt, không bị choáng váng khi đứng dậy).
- Với người ≥ 80 tuổi hoặc suy yếu: Khởi đầu mục tiêu thận trọng < 140/90 mmHg để tránh thiếu máu não.

2. Nguyên tắc đo chính xác tại nhà:
- Nghỉ ngơi yên tĩnh ít nhất 5 phút trước khi đo, ngồi tựa lưng, vòng bít ngang tim.
- Đo 2 lần cách nhau 2 phút vào buổi sáng (trước uống thuốc) và buổi tối.

3. Cảnh báo đỏ cần xử trí ngay:
- Nếu huyết áp ≥ 180/120 mmHg kèm đau ngực, khó thở, yếu liệt tay chân hoặc nói ngọng: GỌI 115 NGAY!`;
      } else if (q.includes('hạ đường huyết') || q.includes('tiểu đường') || q.includes('đường huyết') || q.includes('sglt2')) {
        baseReply = `[XỬ TRÍ HẠ ĐƯỜNG HUYẾT & PHÁC ĐỒ NEJM SGLT2i]
1. Dấu hiệu nhận biết hạ đường huyết (< 3.9 mmol/L hoặc < 70 mg/dL):
- Run tay chân, vã mồ hôi lạnh, tim đập nhanh, hoa mắt, đói cồn cào, lú lẫn hoặc lơ mơ.

2. Quy tắc 15–15 cấp cứu tại nhà (khi người bệnh còn tỉnh):
- Bước 1: Uống ngay 15g đường hấp thu nhanh (3–4 viên kẹo đường, hoặc 150ml nước ngọt có đường / 1 thìa canh mật ong pha nước ấm).
- Bước 2: Chờ 15 phút và đo lại đường huyết mao mạch. Nếu vẫn < 70 mg/dL, lặp lại 15g đường.
- Bước 3: Khi ổn định, ăn nhẹ một bữa có tinh bột phức hợp (cháo loãng, bánh mì).
- Lưu ý: Nếu người bệnh hôn mê/co giật, TUYỆT ĐỐI KHÔNG đổ nước vào miệng mà gọi 115 ngay!`;
      } else if (q.includes('tương tác thuốc') || q.includes('uống cùng lúc') || q.includes('mỡ máu') || q.includes('beers')) {
        baseReply = `[DƯỢC LÝ LÃO KHOA & TIÊU CHUẨN AGS BEERS CRITERIA®]
1. Thuốc hạ mỡ máu (Statin) và thuốc huyết áp có uống cùng lúc được không?
- Thuốc huyết áp (như Amlodipine, Losartan, Perindopril) thường uống buổi sáng để kiểm soát đỉnh huyết áp ban ngày.
- Thuốc mỡ máu Statin thế hệ cũ (Simvastatin, Lovastatin) hiệu quả cao nhất vào buổi tối trước khi ngủ; riêng Atorvastatin / Rosuvastatin có thời gian bán thải dài nên có thể uống bất kỳ lúc nào (tốt nhất cố định buổi tối).
- Khuyến cáo: Nên tách cữ Sáng (Huyết áp) và Tối (Mỡ máu) để giảm gánh nặng chuyển hóa gan và tránh quên liều; riêng Amlodipine + Simvastatin liều cao cần theo dõi men cơ (CK).

2. Cảnh báo an toàn đa thuốc ở người cao tuổi:
- Tránh tự ý dùng chung thuốc giảm đau NSAID (Ibuprofen, Meloxicam) với thuốc huyết áp/chống đông vì gây hại thận và xuất huyết dạ dày.`;
      } else if (q.includes('đột quỵ') || q.includes('fast') || q.includes('tai biến')) {
        baseReply = `[NHẬN BIẾT SỚM ĐỘT QUỴ NÃO THEO QUY TẮC F.A.S.T - BỘ Y TẾ]
- F (Face - Khuôn mặt): Yêu cầu người bệnh cười hoặc nhe răng -> Một bên mặt bị xệ, nhân trung lệch.
- A (Arms - Tay/Chân): Yêu cầu giơ cả 2 tay lên cao trong 10 giây -> Một bên tay rơi xuống hoặc yếu tê bì.
- S (Speech - Giọng nói): Yêu cầu lặp lại một câu đơn giản -> Nói ngọng, dính chữ, không hiểu lời nói.
- T (Time - Thời gian vàng): GỌI 115 NGAY LẬP TỨC! Thời gian vàng tiêu sợi huyết là 3–4.5 giờ đầu.

* Tuyệt đối KHÔNG cạo gió, KHÔNG chích máu đầu ngón tay, KHÔNG tự ý cho uống thuốc hạ áp hay ăn uống khi người bệnh có dấu hiệu nuốt sặc.`;
      } else if (q.includes('dash') || q.includes('muối') || q.includes('ăn uống') || q.includes('dinh dưỡng')) {
        baseReply = `[CHẾ ĐỘ ĂN GIẢM MUỐI DASH CHO NGƯỜI CAO TUỔI TIM MẠCH]
1. Nguyên tắc vàng (The Lancet SSaSS & Viện Dinh Dưỡng QG):
- Giới hạn lượng muối Natri dưới 5g muối ăn/ngày (tương đương 1 thìa cà phê gạt ngang cho cả ngày, tính cả nước mắm/hạt nêm).
- Tăng cường rau xanh (300–400g/ngày), trái cây ít ngọt, cá biển giàu Omega-3 (2–3 bữa/tuần), ngũ cốc nguyên hạt.
- Bổ sung đủ đạm chất lượng cao (1.0–1.2g/kg/ngày) từ cá, đậu hũ, trứng, sữa tách béo để ngừa teo cơ lão khoa.
- Hạn chế tối đa nội tạng động vật, đồ muối chua, thức ăn chế biến sẵn (giò chả công nghiệp, mì gói).`;
      } else {
        const paperCite = matchedPapers[0] || state.papers[0];
        baseReply = `[BÁC SĨ SMART HEALTHCARE • TƯ VẤN LÂM SÀNG RAG/CAG]
Dựa trên câu hỏi: "${promptText}"

1. Định hướng chuyên khoa:
- Các triệu chứng và vấn đề ở người cao tuổi cần được theo dõi kết hợp giữa sinh hiệu (nhịp tim, SpO2, huyết áp, thân nhiệt), tiền sử bệnh nền và danh mục thuốc đang dùng hàng ngày.
- Hãy ưu tiên ghi lại cảm nhận hằng ngày trong "Nhật ký sức khỏe hằng ngày" và rà soát 4 cữ thuốc trong "Lịch Thuốc".

2. Tài liệu khoa học liên quan từ kho RAG:
- Nguồn: ${paperCite.journal} (${paperCite.year}) — "${paperCite.titleVi}"
- Khuyến nghị: ${paperCite.takeaway}

3. Dấu hiệu cần đi khám ngay:
- Đau thắt ngực, khó thở khi nghỉ ngơi, chóng mặt dữ dội, sốt > 38.5°C kéo dài hoặc lú lẫn đột ngột.`;
      }

      if (dSummary.count > 0) {
        baseReply += `\n\n[LIÊN HỆ NHẬT KÝ SỨC KHỎE HẰNG NGÀY CỦA BẠN]\n• ${dailyLogSummary}${dSummary.needsAttention ? '\n• Lưu ý: ' + dSummary.attentionReason : ''}`;
      }
      return baseReply;
    }

    function addVoiceDialogue(who, text) {
      const time = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });

    function renderWatchdogBanner() {
      const el = document.getElementById('watchdog-alert-banner');
      if (!el) return;
      const health = evaluateDeviceHealth(state.esp32, Date.now());
      if (health.status !== 'disconnected' && health.status !== 'fault') {
        el.innerHTML = '';
        return;
      }
      const isFault = health.status === 'fault';
      el.innerHTML = `

    let geoWatchId = null;
    function initAlwaysOnGeolocation(manualRequest = false) {
      if (!navigator.geolocation) {
        state.liveLocation.status = 'unsupported';
        state.liveLocation.error = 'Trình duyệt không hỗ trợ định vị GPS.';
        saveJSON('smart_health_live_location', state.liveLocation);
        return;
      }
      const onPos = (pos) => {
        const lat = pos.coords.latitude.toFixed(6);
        const lng = pos.coords.longitude.toFixed(6);
        const mapsUrl = `https://maps.google.com/?q=${lat},${lng}`;
        state.liveLocation = {
          lat,
          lng,
          accuracy: Math.round(pos.coords.accuracy || 0),
          mapsUrl,
          updatedAt: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
          status: 'active',
          error: ''
        };
        state.sosGpsUrl = mapsUrl;
        state.sosGpsLoading = false;
        state.sosGpsError = '';
        saveJSON('smart_health_live_location', state.liveLocation);
        if (state.activeModal === 'sosActive' || state.activeModal === 'sosSetup') renderModal();
        else if (state.activeTab === 'dashboard' && !document.activeElement?.matches('input, select, textarea')) renderMain();
      };
      const onErr = (err) => {
        state.sosGpsLoading = false;
        state.liveLocation.status = 'denied';
        state.liveLocation.error = err && err.code === 1
          ? 'Chưa cấp quyền vị trí trên trình duyệt (vui lòng nhấn Cho phép Vị trí).'
          : 'Đang chờ tín hiệu GPS ổn định; hệ thống vẫn giữ sẵn địa chỉ nhà đã thiết lập.';
        state.sosGpsError = state.liveLocation.error;
        saveJSON('smart_health_live_location', state.liveLocation);
        if (manualRequest && (state.activeModal === 'sosActive' || state.activeModal === 'sosSetup')) renderModal();
      };
      try {
        if (manualRequest) {
          state.sosGpsLoading = true;
          navigator.geolocation.getCurrentPosition(onPos, onErr, { enableHighAccuracy: true, timeout: 9000, maximumAge: 15000 });
        }
        if (geoWatchId === null) {
          geoWatchId = navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy: true, maximumAge: 15000, timeout: 10000 });
        }
      } catch {}
    }

    function getEmergencyAddressPayload() {
      const patient = state.members.find(x => x.id === state.profileMemberId) || state.members[0] || null;
      const profileAddr = (patient && patient.record && patient.record.permanentAddress) ? patient.record.permanentAddress.trim() : '';
      const setupAddr = (state.emergencyLocation && state.emergencyLocation.address) ? state.emergencyLocation.address.trim() : '';
      const savedAddress = profileAddr || setupAddr;
      const gpsUrl = state.liveLocation.mapsUrl || state.sosGpsUrl || '';
      const coords = (state.liveLocation.lat && state.liveLocation.lng) ? `${state.liveLocation.lat}, ${state.liveLocation.lng}` : '';
      return { savedAddress, gpsUrl, coords };
    }

    function getSosReadiness() {
      const loc = getEmergencyAddressPayload();
      const hasGps = Boolean(loc.gpsUrl);
      const hasAddress = Boolean(loc.savedAddress);
      const hasLocation = hasGps || hasAddress;
      const sorted = [...state.familyContacts].sort((a, b) => (a.priority || 1) - (b.priority || 1));
      const priorityContacts = sorted.filter(c => isValidEmergencyPhone(c.phone) && c.autoSos !== false);
      const fallbackContacts = priorityContacts.length > 0
        ? priorityContacts
        : sorted.filter(c => isValidEmergencyPhone(c.phone));
      const hasPriorityContact = fallbackContacts.length > 0;
      return {
        hasGps,
        hasAddress,
        hasLocation,
        hasPriorityContact,
        priorityContacts: fallbackContacts,
        ready: hasLocation && hasPriorityContact
      };
    }

    function buildSmsDispatchDetails(conditionText) {
      const patient = state.members.find(x => x.id === state.profileMemberId) || state.members[0] || null;
      const patientName = patient ? patient.name : (state.currentUser ? state.currentUser.fullName : 'Người cần hỗ trợ');
      const loc = getEmergencyAddressPayload();
      const locParts = [
        loc.savedAddress ? `Dia chi: ${loc.savedAddress}` : '',
        loc.gpsUrl ? `GPS: ${loc.gpsUrl}` : ''
      ].filter(Boolean).join(' | ');
      const smsBody = `KHAN CAP SOS [${state.familyRoomCode}] - ${patientName}: ${conditionText}.${locParts ? ' ' + locParts : ''}`;
      const readiness = getSosReadiness();
      const recipients = readiness.priorityContacts.map(c => ({
        name: c.name,
        relation: c.relation || 'Người thân',
        phone: c.phone,
        cleanPhone: (c.phone || '').replace(/\D/g, ''),
        priority: c.priority || 1
      }));
      const phoneList = recipients.map(r => r.cleanPhone).filter(Boolean).join(',');
      const smsUri = phoneList ? `sms:${phoneList}?body=${encodeURIComponent(smsBody)}` : '';
      return { patientName, loc, smsBody, recipients, smsUri };
    }

    async function autoDispatchEmergencySos(conditionText, triggerNativeSms = false) {
      const details = buildSmsDispatchDetails(conditionText);
      const nowTime = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
      const nowFull = `${nowTime} ${new Date().toLocaleDateString('vi-VN')}`;

      const alertObj = {
        id: 'sos-' + Date.now(),
        time: nowFull,
        patientName: details.patientName,
        condition: conditionText,
        address: details.loc.savedAddress || '',
        gpsUrl: details.loc.gpsUrl || '',
        smsRecipients: details.recipients.map(r => ({
          name: r.name,
          relation: r.relation,
          phone: r.phone,
          priority: r.priority
        })),
        smsBody: details.smsBody
      };

      state.sosWebAlerts.unshift(alertObj);
      if (state.sosWebAlerts.length > 20) state.sosWebAlerts.length = 20;
      saveJSON('smart_health_sos_web_alerts', state.sosWebAlerts);

      if (details.recipients.length > 0) {
        details.recipients.forEach(r => {
          state.smsDispatchLogs.unshift({
            id: 'sms-' + Date.now() + '-' + r.cleanPhone,
            time: nowFull,
            priority: r.priority,
            name: r.name,
            relation: r.relation,
            phone: r.phone,
            body: details.smsBody,
            status: 'Đã tự động kích hoạt gửi SMS khẩn cấp'
          });
        });
        if (state.smsDispatchLogs.length > 30) state.smsDispatchLogs.length = 30;
        saveJSON('smart_health_sms_logs', state.smsDispatchLogs);
      }

      await broadcastRealSosAlert(alertObj);

      if (triggerNativeSms && details.smsUri && /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)) {
        try {
          const a = document.createElement('a');
          a.href = details.smsUri;
          a.style.display = 'none';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        } catch {}
      }

      const prioTargets = details.recipients
        .map(r => `#${r.priority} ${r.name} (${state.sensitiveUnlocked ? r.phone : maskText(r.phone, 3)})`)
        .join(', ');
      state.sosSentMessage = details.recipients.length > 0
        ? `Đã tự động phát SOS ("${conditionText}") kèm vị trí & kích hoạt gửi SMS tới SĐT ưu tiên: ${prioTargets}.`
        : `Đã phát SOS ("${conditionText}") kèm vị trí lên Web (chưa có SĐT ưu tiên để gửi SMS).`;

      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification('CẢNH BÁO SOS - Smart Healthcare', {
          body: `${details.patientName}: ${conditionText} ${details.loc.savedAddress || ''}`
        });
      }
      return details;
    }

    async function triggerObstacleDisappearance(tray, slot, pouchPresentNow) {
      const dose = tray.schedule[slot.key] || {};
      const timingText = dose.timing || slot.timing;
      const timeStr = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
      dose.pouchPresent = pouchPresentNow;
      saveJSON('smart_health_trays', state.trays);

      const ev = {
        id: 'obs-' + Date.now(),
        trayId: tray.id,
        trayNumber: tray.trayNumber,
        slotKey: slot.key,
        slotLabel: `${slot.dayPart} (${timingText})`,
        memberName: tray.assignedMemberName,
        pouchPresent: pouchPresentNow,
        time: timeStr,
        timestamp: Date.now(),
        message: pouchPresentNow
          ? `Đã nạp lại túm thuốc mới vào cảm biến vật cản Khay #${tray.trayNumber} — ${slot.dayPart} (${timingText}).`
          : `Túm thuốc ${slot.dayPart} (${timingText}) tại Khay #${tray.trayNumber} ĐÃ ĐƯỢC LẤY RA KHỎI KHAY lúc ${timeStr}. Chờ người bệnh xác nhận ĐÃ UỐNG THUỐC!`
      };

      if (!pouchPresentNow) {
        state.obstacleAlerts.unshift(ev);
        if (state.obstacleAlerts.length > 30) state.obstacleAlerts.length = 30;
        saveJSON('smart_health_obstacle_alerts', state.obstacleAlerts);
        state.activeObstacleBanner = ev;
        renderObstacleAlertBanner();

        // CHỈ ghi nhận BƯỚC 1 (Đã lấy khỏi khay), KHÔNG tự động coi là đã uống thuốc!
        const tKey = todayKey();
        const alreadyOut = state.takenOutLogs.some(l => l.dateKey === tKey && l.trayId === tray.id && l.slotKey === slot.key);
        if (!alreadyOut) {
          state.takenOutLogs.unshift({
            id: 'tout-' + Date.now(),
            dateKey: tKey,
            trayId: tray.id,
            trayNumber: tray.trayNumber,
            slotKey: slot.key,
            slotLabel: slot.shortLabel,
            time: timeStr,
            source: state.esp32.connectionMode !== 'none' ? state.esp32.connectionMode : 'manual_sensor',
            timestamp: Date.now()
          });
          saveJSON('smart_health_taken_out_logs', state.takenOutLogs);
        }

        logActivity('medication', 'warn', `Lấy thuốc khỏi khay (${slot.shortLabel})`, ev.message);
        await sendFamilyRoomMessage(`CẢM BIẾN KHAY THUỐC: Túm thuốc ${slot.dayPart} (${timingText}) vừa ĐƯỢC LẤY RA KHỎI KHAY #${tray.trayNumber} lúc ${timeStr} (đang chờ xác nhận đã uống).`, 'sensor');
        playChime();
        speakVi(`Phát hiện túm thuốc ${slot.dayPart} đã được lấy ra khỏi khay. Xin nhắc người bệnh uống ngay với nước ấm và bấm Xác nhận Đã Uống.`);
        if ('Notification' in window && Notification.permission === 'granted') {
          new Notification('Cảm Biến Khay Thuốc - Chờ Xác Nhận Uống', { body: ev.message });
        }
      } else {
        logActivity('medication', 'info', `Nạp túm thuốc vào khay (${slot.shortLabel})`, ev.message);
      }

      if (window.location.protocol.startsWith('http')) {
        try {
          await fetch('/api/family-sync/' + encodeURIComponent(state.familyRoomCode) + '/sensor-obstacle', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({

              slotKey: slot.key,
              slotLabel: ev.slotLabel,
              memberName: tray.assignedMemberName,
              pouchPresent: pouchPresentNow,
              message: ev.message,
              time: timeStr
            })
          });
        } catch {}
      }
    }

                </span>
              </div>

              <div style="padding:11px 13px;border-radius:12px;background:${loc.gpsUrl ? 'var(--surface-emerald)' : 'var(--surface-amber)'};border:1px solid ${loc.gpsUrl ? 'var(--border-emerald)' : 'var(--border-amber)'};font-size:14.5px;color:var(--text-primary);">

                  : `<strong>Trạng thái GPS:</strong> ${esc(state.liveLocation.error || 'Chưa nhận được GPS tự động. Bạn có thể nhấn Bật GPS hoặc nhập địa chỉ nhà bên dưới.')}`}

              <button type="button" id="sos-step-gps" class="pill-btn" style="background:var(--surface-blue);color:var(--accent-navy);border-color:var(--border-blue);justify-content:center;" ${state.sosGpsLoading ? 'disabled' : ''}>
                ${svgIcon('refresh', 15)} ${state.sosGpsLoading ? 'Đang lấy tọa độ GPS...' : (loc.gpsUrl ? 'Cập Nhật Lại Tọa Độ GPS' : 'Bật Định Vị GPS Ngay')}

              <div>

              <button type="button" id="sos-step-save-addr" class="pill-btn" style="background:var(--surface-emerald);color:var(--emerald-brand);border-color:var(--border-emerald);justify-content:center;">

            <div class="glass-panel" style="border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;border-color:${readiness.hasPriorityContact ? 'var(--border-emerald)' : 'var(--rose-border)'};">
              <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">

                  <div>
                    <label class="field-label" for="step-fc-name">Họ tên người nhà *</label>

                      <option value="Cháu / Người chăm sóc">Cháu / Người chăm sóc</option>
                      <option value="Bác sĩ gia đình">Bác sĩ gia đình</option>
                    </select>
                  </div>
                  <div>
                    <label class="field-label" for="step-fc-prio">Thứ tự gọi &amp; SMS</label>

                      <option value="2">Ưu tiên 2 (Dự phòng)</option>
                      <option value="3">Ưu tiên 3 (Hỗ trợ gần nhà)</option>

              <div style="display:flex;flex-direction:column;gap:8px;max-height:220px;overflow-y:auto;">

                    <div style="font-size:14.5px;color:var(--text-primary);">
                      <div style="font-weight:800;">

            </div>
          ` : ''}

          ${state.familySyncNotice ? `

      document.getElementById('sos-step-gps').onclick = () => {
        state.sosSetupError = '';

      };

      document.getElementById('sos-step-save-addr').onclick = () => {
        const addrVal = document.getElementById('sos-step-addr').value.trim();
        if (!addrVal) {
          state.sosSetupError = 'Vui lòng nhập địa chỉ nơi ở hiện tại trước khi lưu.';
          renderMain();
          return;
        }
        state.emergencyLocation = {
          address: addrVal,
          updatedAt: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })
        };
        saveJSON('smart_health_emergency_location', state.emergencyLocation);
        const patient = state.members.find(x => x.id === state.profileMemberId) || state.members[0];
        if (patient) {
          patient.record = patient.record || {};
          patient.record.permanentAddress = addrVal;
          saveJSON('smart_health_members', state.members);
        }
        state.sosSetupError = '';
        state.familySyncNotice = 'Đã lưu địa chỉ khẩn cấp thành công!';
        renderMain();
      };

      document.getElementById('sos-step-contact-form').onsubmit = async (e) => {
        e.preventDefault();
        const addrDraft = document.getElementById('sos-step-addr').value.trim();
        if (addrDraft) {
          state.emergencyLocation = {
            address: addrDraft,
            updatedAt: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })
          };
          saveJSON('smart_health_emergency_location', state.emergencyLocation);
        }
        const name = document.getElementById('step-fc-name').value.trim();
        const rawPhone = document.getElementById('step-fc-phone').value.trim();
        const digits = rawPhone.replace(/\D/g, '');
        if (!name || digits.length < 9) {
          state.sosSetupError = 'Vui lòng nhập đầy đủ Họ tên và Số điện thoại hợp lệ (ít nhất 9 chữ số).';
          renderMain();
          return;
        }
        const relation = document.getElementById('step-fc-rel').value;
        const priority = Number(document.getElementById('step-fc-prio').value) || 1;
        const autoSos = document.getElementById('step-fc-autosms').checked;

        state.familyContacts.push({
          id: 'fc-' + Date.now(),
          name,
          relation,
          phone: rawPhone,
          email: '',
          priority,
          autoSos,
          channels: ['Gọi điện', 'SMS', 'Zalo'],
          note: 'Thiết lập tại Bước 2 SOS'
        });
        state.sosSetupError = '';
        state.familySyncNotice = `Đã liên kết SĐT ${name} (Ưu tiên ${priority}).`;
        await pushContactsToFamilyRoom();
        renderMain();
      };

      container.querySelectorAll('.del-step-fc-btn').forEach(btn => {
        btn.onclick = async () => {
          state.familyContacts = state.familyContacts.filter(x => x.id !== btn.dataset.id);
          await pushContactsToFamilyRoom();
          renderMain();
        };
      });

      document.getElementById('btn-step-trigger-sos').onclick = async () => {
        state.sosMuted = false;
        state.sosSentMessage = '';
        state.activeModal = 'sosActive';
        initAlwaysOnGeolocation(true);
        startSiren();
        await autoDispatchEmergencySos(state.sosCondition, true);
        renderModal();
      };

      document.getElementById('btn-step-complete-sos').onclick = () => {
        const addrVal = document.getElementById('sos-step-addr').value.trim();
        if (addrVal && addrVal !== (state.emergencyLocation && state.emergencyLocation.address)) {
          state.emergencyLocation = {
            address: addrVal,
            updatedAt: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })
          };
          saveJSON('smart_health_emergency_location', state.emergencyLocation);
        }
        const check = getSosReadiness();
        if (!check.hasLocation) {
          state.sosSetupError = 'Bạn cần Bật định vị GPS hoặc nhập Địa chỉ nơi ở để hoàn tất Bước 2 SOS.';
          renderMain();
          return;
        }
        if (!check.hasPriorityContact) {
          state.sosSetupError = 'Bạn cần thêm tối thiểu 1 Số điện thoại người thân trước khi vào các phần còn lại.';
          renderMain();
          return;
        }
        state.sosSetupError = '';
        state.sosFlowCompleted = true;
        sessionStorage.setItem('smart_health_sos_step_done', '1');
        state.activeTab = 'dashboard';
        renderAll();
      };
    }

       ======================================================================== */
    let ppgRafId = null;

    function stopPPGAnimation() {
      if (ppgRafId) {
        cancelAnimationFrame(ppgRafId);
        ppgRafId = null;
      }
    }

    function startPPGAnimation(bpm = 74) {
      stopPPGAnimation();
      const canvas = document.getElementById('ppg-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let phase = 0;

      const draw = () => {
        if (!document.getElementById('ppg-canvas')) {
          stopPPGAnimation();
          return;
        }
        const w = canvas.width;
        const h = canvas.height;
        ctx.clearRect(0, 0, w, h);

        // Lưới nền sáng chuẩn giấy điện tâm đồ y khoa
        ctx.strokeStyle = 'rgba(5, 150, 105, 0.14)';
        ctx.lineWidth = 1;
        for (let x = 0; x < w; x += 28) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
        }
        for (let y = 0; y < h; y += 22) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
        }

        // Đường sóng PPG/ECG thực tế theo BPM (thích ứng Sáng/Tối)
        ctx.strokeStyle = state.theme === 'dark' ? '#34D399' : '#047857';
        ctx.lineWidth = 2.4;
        ctx.shadowColor = state.theme === 'dark' ? 'rgba(52, 211, 153, 0.25)' : 'rgba(4, 120, 87, 0.25)';
        ctx.shadowBlur = 4;
        ctx.beginPath();

        const speed = (bpm / 60) * 0.065;
        for (let x = 0; x < w; x++) {
          const t = (phase + x * 0.045) % (Math.PI * 2);
          let yNorm = 0;
          if (t > 1.2 && t < 1.6) yNorm = -0.18 * Math.sin((t - 1.2) / 0.4 * Math.PI);
          else if (t >= 2.0 && t < 2.25) yNorm = 0.92 * Math.sin((t - 2.0) / 0.25 * Math.PI);
          else if (t >= 2.25 && t < 2.45) yNorm = -0.32 * Math.sin((t - 2.25) / 0.2 * Math.PI);
          else if (t > 3.1 && t < 3.9) yNorm = 0.25 * Math.sin((t - 3.1) / 0.8 * Math.PI);
          const y = h * 0.58 - yNorm * (h * 0.38);
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.shadowBlur = 0;

        phase += speed;
        ppgRafId = requestAnimationFrame(draw);
      };
      draw();
    }

              </div>

              <div id="dash-sensor-updated" style="padding:9px 12px;border-radius:12px;background:var(--surface-blue);border:1px solid var(--border-subtle);font-size:12.5px;color:var(--text-secondary);">
                <div><strong>Nguồn đo:</strong> ${esc(state.airSensorSourceLabel)}</div>
                <div><strong>Cập nhật lúc:</strong> ${esc(state.airSensorUpdatedAt || 'Chưa nhận gói cảm biến ESP32')}</div>
              </div>

              <div style="padding:10px 12px;border-radius:12px;background:var(--card-bg);border:1px solid var(--border-subtle);font-size:13px;color:var(--text-secondary);line-height:1.5;">
                <strong style="color:var(--accent-navy);">Khuyến nghị:</strong> ${esc(airEval.recommendation)} ${esc(envAdvice)}
              </div>
            </div>

            <!-- Cột phải: Sinh hiệu người đeo -->
            <div class="glass-panel lg-span-8" style="border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;">
              <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;">
                <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                  <h3 style="font-size:16.5px;font-weight:800;color:var(--text-primary);display:flex;align-items:center;gap:8px;">
                    <span class="text-rose">${svgIcon('activity', 18)}</span> Theo Dõi Sinh Hiệu Thời Gian Thực
                  </h3>
                  ${state.members.length > 0 ? `
                    <select id="dash-wearer-select" class="glass-input" style="padding:7px 12px;border-radius:10px;font-size:14.5px;font-weight:700;">
                      ${state.members.map(m => `<option value="${m.id}" ${activeWearer && m.id === activeWearer.id ? 'selected' : ''}>${esc(m.name)} (${m.age} tuổi)</option>`).join('')}
                    </select>
                  ` : ''}
                </div>
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                  ${perms.canEditHealthProfile ? `
                    <button id="btn-add-wearer" class="pill-btn gemini-gradient-bg text-white" style="border:none;">
                      ${svgIcon('plus', 15)} Thêm người theo dõi
                    </button>
                  ` : ''}
                  ${activeWearer && perms.canEditHealthProfile ? `
                    <button id="btn-sim-abnormal" class="pill-btn" style="background:var(--rose-soft);color:var(--rose-deep);border-color:var(--rose-border);">
                      ${svgIcon('alert', 14)} Kiểm thử cảnh báo sinh hiệu
                    </button>
                  ` : ''}
                </div>
              </div>

              ${activeWearer ? `
                <div class="grid sm-grid-3" style="gap:10px;">
                  <div class="glass-card" style="border-radius:16px;padding:13px;background:var(--rose-soft);border-color:var(--rose-border);">
                    <div style="font-size:12px;color:var(--rose-deep);font-weight:700;">NHỊP TIM (PPG)</div>
                    <div class="font-mono" style="font-size:26px;font-weight:800;color:var(--accent-rose);margin-top:2px;">${activeWearer.restBPM} <span style="font-size:13px;">BPM</span></div>
                    <div style="font-size:12.5px;color:var(--text-muted);">Ngưỡng an toàn: 60–100 BPM</div>
                  </div>
                  <div class="glass-card" style="border-radius:16px;padding:13px;background:var(--surface-cyan);border-color:var(--border-subtle);">
                    <div style="font-size:12px;color:var(--accent-cyan);font-weight:700;">NỒNG ĐỘ OXY (SpO2)</div>
                    <div class="font-mono" style="font-size:26px;font-weight:800;color:var(--accent-cyan);margin-top:2px;">${activeWearer.avgSpO2}%</div>
                    <div style="font-size:12.5px;color:var(--text-muted);">Ngưỡng bình thường: ≥ 95%</div>
                  </div>
                  <div class="glass-card" style="border-radius:16px;padding:13px;background:var(--surface-amber);border-color:var(--border-subtle);">
                    <div style="font-size:12px;color:#B45309;font-weight:700;">THÂN NHIỆT VÒNG TAY</div>
                    <div class="font-mono" style="font-size:26px;font-weight:800;color:#B45309;margin-top:2px;">${activeWearer.bodyTemp.toFixed(1)}°C</div>
                    <div style="font-size:12.5px;color:var(--text-muted);">Bình thường: 36.1°C – 37.2°C</div>
                  </div>
                </div>
                <div style="background:var(--surface-emerald);border:1px solid var(--border-subtle);border-radius:16px;padding:10px;">
                  <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--emerald-brand);margin-bottom:6px;font-weight:700;">
                    <span>SÓNG MẠCH QUANG HỌC PPG/ECG REAL-TIME</span>
                    <span class="font-mono">ID: ${esc(activeWearer.wristbandId || state.esp32.deviceId)}</span>
                  </div>
                  <canvas id="ppg-canvas" width="760" height="84" style="width:100%;height:84px;display:block;"></canvas>
                </div>
              ` : `
                <div class="glass-card" style="border-radius:18px;padding:24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;">
                  <div style="padding:14px;border-radius:50%;background:var(--surface-blue);color:var(--accent-navy);border:1px solid var(--border-subtle);">
                    ${svgIcon('bluetooth', 28)}
                  </div>
                  <h4 style="font-size:17px;font-weight:800;color:var(--text-primary);">Chưa có người theo dõi được ghép nối</h4>
                  <p style="font-size:14.5px;color:var(--text-secondary);max-width:500px;">
                    Hệ thống giữ nguyên trạng thái sạch khi chưa có thiết bị đo thật. Khi ESP32 gửi gói dữ liệu hoặc bạn nhấn <strong>"+ Thêm người theo dõi"</strong>, sinh hiệu thật sẽ hiển thị tại đây.
                  </p>
                </div>
              `}
            </div>
          </div>

          <!-- HÀNG 1B: NHẬT KÝ SỨC KHỎE HẰNG NGÀY (HEALTH DAILY LOG) & BIỂU ĐỒ XU HƯỚNG -->
          <div class="glass-panel" id="health-daily-log-section" style="border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;border-top:3px solid var(--blue);">
            <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--border-subtle);">
              <div>
                <h3 style="font-size:18px;font-weight:800;color:var(--accent-navy);display:flex;align-items:center;gap:8px;">
                  ${svgIcon('clipboard', 19)} Nhật Ký Sức Khỏe Hằng Ngày &amp; Biểu Đồ Cảm Nhận
                </h3>
                <p style="font-size:14.5px;color:var(--text-secondary);margin-top:2px;">
                  Ghi nhận nhanh <strong>Tâm trạng</strong>, <strong>Mức năng lượng</strong>, <strong>Mức độ đau</strong> và triệu chứng mỗi ngày để theo dõi diễn biến trên biểu đồ.
                </p>
              </div>
              <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
                <button type="button" id="btn-dlog-7d" class="pill-btn" style="padding:7px 14px;${state.dailyLogChartDays === 7 ? 'background:#1E3A5F;color:#FFFFFF;border-color:#1E3A5F;' : ''}">7 ngày</button>
                <button type="button" id="btn-dlog-14d" class="pill-btn" style="padding:7px 14px;${state.dailyLogChartDays === 14 ? 'background:#1E3A5F;color:#FFFFFF;border-color:#1E3A5F;' : ''}">14 ngày</button>
              </div>
            </div>

            <div class="grid grid-1 lg-grid-12" style="gap:16px;align-items:start;">
              <!-- Form Nhập Nhật Ký (Trái 5/12) -->
              <form id="daily-log-form" class="lg-span-5" style="background:var(--card-bg);border:1px solid var(--border-subtle);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;">
                <div class="grid sm-grid-2" style="gap:8px;">
                  <div>
                    <label class="field-label" for="dlog-date">Ngày ghi nhận</label>
                    <input id="dlog-date" type="date" class="glass-input field-input" value="${esc(draft.dateKey)}" />
                  </div>
                  <div>
                    <label class="field-label" for="dlog-period">Thời điểm trong ngày</label>
                    <select id="dlog-period" class="glass-input field-input">
                      ${['Sáng', 'Trưa', 'Chiều', 'Tối'].map(p => `<option value="${p}" ${draft.timeOfDay === p ? 'selected' : ''}>Buổi ${p}</option>`).join('')}
                    </select>
                  </div>
                </div>

                <!-- Tâm trạng (1..5) -->
                <div>
                  <label class="field-label">1. Tâm trạng hôm nay (${draft.mood}/5 — ${MOOD_LEVELS.find(x => x.score === draft.mood)?.label || ''})</label>
                  <div class="score-btn-grid">
                    ${MOOD_LEVELS.map(m => `
                      <button type="button" class="score-btn dlog-mood-btn ${draft.mood === m.score ? 'active-mood' : ''}" data-val="${m.score}">
                        <span style="font-size:18px;line-height:1;">${m.icon}</span>
                        <span>${m.score}. ${m.label}</span>
                      </button>
                    `).join('')}
                  </div>
                </div>

                <!-- Mức năng lượng (1..5) -->
                <div>
                  <label class="field-label">2. Mức năng lượng (${draft.energy}/5 — ${ENERGY_LEVELS.find(x => x.score === draft.energy)?.label || ''})</label>
                  <div class="score-btn-grid">
                    ${ENERGY_LEVELS.map(en => `
                      <button type="button" class="score-btn dlog-energy-btn ${draft.energy === en.score ? 'active-energy' : ''}" data-val="${en.score}">
                        <span style="font-size:18px;line-height:1;">${en.icon}</span>
                        <span>${en.score}. ${en.label}</span>
                      </button>
                    `).join('')}
                  </div>
                </div>

                <!-- Mức độ đau (0..10) -->
                <div>
                  <label class="field-label">3. Mức độ đau nhức (0 = Không đau · 10 = Rất đau): <strong style="color:#8C2D38;">${draft.pain}/10</strong></label>
                  <div class="pain-btn-grid">
                    ${Array.from({ length: 11 }, (_, i) => {
                      const activeCls = draft.pain === i ? (i <= 3 ? 'active-low' : i <= 6 ? 'active-mid' : 'active-high') : '';
                      return `<button type="button" class="pain-btn dlog-pain-btn ${activeCls}" data-val="${i}">${i}</button>`;
                    }).join('')}
                  </div>
                </div>

                <!-- Triệu chứng kèm theo -->
                <div>
                  <label class="field-label">4. Triệu chứng kèm theo (chọn nếu có)</label>
                  <div style="display:flex;flex-wrap:wrap;gap:6px;">
                    ${DAILY_SYMPTOM_OPTIONS.map(sym => {
                      const active = draft.symptoms.includes(sym);
                      return `<button type="button" class="symptom-chip-btn dlog-sym-btn ${active ? 'active' : ''}" data-sym="${esc(sym)}">${active ? '✓ ' : ''}${esc(sym)}</button>`;
                    }).join('')}
                  </div>
                </div>

                <div>
                  <label class="field-label" for="dlog-note">Ghi chú thêm cho con cháu / bác sĩ</label>
                  <textarea id="dlog-note" rows="2" class="glass-input field-input" placeholder="Ví dụ: Đêm qua ngủ ngon hơn, sáng hơi mỏi khớp gối trái...">${esc(draft.note)}</textarea>
                </div>

                ${state.dailyLogError ? `
                  <div style="padding:9px 12px;border-radius:10px;background:var(--rose-soft);border:1px solid var(--rose-border);color:var(--rose-deep);font-size:14px;font-weight:700;">
                    ⚠ ${esc(state.dailyLogError)}
                  </div>
                ` : ''}

                ${state.dailyLogNotice ? `
                  <div style="padding:9px 12px;border-radius:10px;background:var(--surface-emerald);border:1px solid var(--border-emerald);color:var(--emerald-brand);font-size:14px;font-weight:700;">
                    ✓ ${esc(state.dailyLogNotice)}
                  </div>
                ` : ''}

                <button type="submit" id="btn-save-daily-log" class="gemini-gradient-bg text-white" style="min-height:48px;padding:12px 18px;border-radius:12px;font-size:16px;font-weight:800;">
                  ${svgIcon('save', 16)} Lưu Nhật Ký Hôm Nay
                </button>
              </form>

              <!-- Biểu đồ & Lịch sử Nhật ký (Phải 7/12) -->
              <div class="lg-span-7" style="display:flex;flex-direction:column;gap:12px;">
                <div class="grid sm-grid-2 lg-grid-4" style="gap:8px;">
                  <div class="glass-card" style="padding:10px 12px;border-radius:12px;">
                    <div style="font-size:12px;color:var(--text-muted);font-weight:700;">SỐ LẦN GHI NHẬN</div>
                    <div id="dlog-kpi-count" class="font-mono" style="font-size:23px;font-weight:800;color:var(--text-primary);">${dSummary.count}</div>
                  </div>
                  <div class="glass-card" style="padding:10px 12px;border-radius:12px;background:var(--surface-blue);border-color:var(--border-blue);">
                    <div style="font-size:12px;color:var(--accent-navy);font-weight:700;">TB TÂM TRẠNG</div>
                    <div id="dlog-kpi-mood" class="font-mono" style="font-size:23px;font-weight:800;color:var(--accent-navy);">${dSummary.count > 0 ? dSummary.avgMood + '/5' : '—'}</div>
                  </div>
                  <div class="glass-card" style="padding:10px 12px;border-radius:12px;background:var(--surface-emerald);border-color:var(--border-emerald);">
                    <div style="font-size:12px;color:var(--emerald-brand);font-weight:700;">TB NĂNG LƯỢNG</div>
                    <div id="dlog-kpi-energy" class="font-mono" style="font-size:23px;font-weight:800;color:var(--emerald-brand);">${dSummary.count > 0 ? dSummary.avgEnergy + '/5' : '—'}</div>
                  </div>
                  <div class="glass-card" style="padding:10px 12px;border-radius:12px;background:var(--rose-soft);border-color:var(--rose-border);">
                    <div style="font-size:12px;color:var(--rose-deep);font-weight:700;">TB MỨC ĐỘ ĐAU</div>
                    <div id="dlog-kpi-pain" class="font-mono" style="font-size:23px;font-weight:800;color:var(--accent-rose);">${dSummary.count > 0 ? dSummary.avgPain + '/10' : '—'}</div>
                  </div>
                </div>

                ${dSummary.needsAttention ? `
                  <div style="padding:10px 13px;border-radius:12px;background:var(--rose-soft);border:1.5px solid var(--rose-border);color:var(--rose-deep);font-size:14.5px;font-weight:700;">
                    ⚠ Lưu ý theo dõi: ${esc(dSummary.attentionReason)}
                  </div>
                ` : ''}

                ${state.dailyLogs.length === 0 ? `
                  <div class="glass-card" style="padding:20px;border-radius:14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;">
                    <div style="font-size:16px;font-weight:800;color:var(--accent-navy);">Chưa có dữ liệu nhật ký để vẽ biểu đồ</div>
                    <p style="font-size:14.5px;color:var(--text-muted);max-width:460px;">
                      Hãy chọn Tâm trạng, Năng lượng, Mức đau ở bên trái và nhấn <strong>"Lưu Nhật Ký Hôm Nay"</strong>, hoặc xem thử biểu đồ bằng dữ liệu mẫu 5 ngày.
                    </p>
                    <button type="button" id="btn-seed-sample-dlog" class="pill-btn" style="background:var(--surface-blue);color:var(--accent-navy);border-color:var(--border-blue);">
                      ${svgIcon('sparkles', 14)} Nạp Dữ Liệu Mẫu 5 Ngày Để Xem Biểu Đồ
                    </button>
                  </div>
                ` : `
                  <div style="display:flex;flex-direction:column;gap:8px;">
                    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;font-weight:700;">
                      <div style="display:flex;flex-wrap:wrap;gap:14px;">
                        <span style="color:var(--accent-navy);">● Tâm trạng (1–5)</span>
                        <span style="color:var(--emerald-brand);">■ Năng lượng (1–5)</span>
                        <span style="color:var(--accent-rose);">◆ Mức đau (0–10)</span>
                      </div>
                      <span style="font-size:12.5px;color:var(--text-muted);">Nhấn ngày bên dưới để xem chi tiết</span>
                    </div>

                    <div id="dlog-svg-container">${buildDailyLogSvgChart(dSeries, state.dailyLogSelectedDate)}</div>

                    <div style="display:flex;flex-wrap:wrap;gap:5px;">
                      ${dSeries.filter(pt => pt.entryCount > 0).map(pt => `
                        <button type="button" class="pill-btn dlog-day-select-btn" data-date="${pt.dateKey}" style="min-height:36px;padding:4px 10px;font-size:13px;${state.dailyLogSelectedDate === pt.dateKey ? 'background:#1E3A5F;color:#FFFFFF;border-color:#1E3A5F;' : ''}">
                          ${esc(pt.shortLabel)}: T${pt.mood} · NL${pt.energy} · Đ${pt.pain}
                        </button>
                      `).join('')}
                    </div>

                    ${selectedDayLogs.length > 0 ? `
                      <div style="padding:10px 12px;border-radius:12px;background:var(--surface-blue);border:1px solid var(--border-blue);font-size:14px;color:var(--text-primary);">
                        <strong>Chi tiết ngày ${esc(state.dailyLogSelectedDate)}:</strong>
                        ${selectedDayLogs.map(x => `
                          <div style="margin-top:4px;">
                            • <strong>Buổi ${esc(x.timeOfDay)}</strong>: Tâm trạng ${x.mood}/5, Năng lượng ${x.energy}/5, Đau ${x.pain}/10
                            ${x.symptoms && x.symptoms.length ? ` — Triệu chứng: ${esc(x.symptoms.join(', '))}` : ''}
                            ${x.note ? ` — "${esc(x.note)}"` : ''}
                          </div>
                        `).join('')}
                      </div>
                    ` : ''}
                  </div>
                `}

                ${sortedLogs.length > 0 ? `
                  <div style="display:flex;flex-direction:column;gap:6px;max-height:210px;overflow-y:auto;">
                    <div style="font-size:13px;font-weight:800;color:var(--accent-navy);">LỊCH SỬ NHẬT KÝ GẦN ĐÂY (${sortedLogs.length}):</div>
                    ${sortedLogs.slice(0, 12).map(log => `
                      <div class="glass-card" style="padding:9px 12px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-left:4px solid ${log.pain >= 7 ? '#8C2D38' : log.pain >= 4 ? '#925711' : '#0F6B52'};">
                        <div style="font-size:14px;color:var(--text-primary);">
                          <div style="font-weight:800;">
                            ${esc(log.dateKey)} · Buổi ${esc(log.timeOfDay || 'Sáng')} —
                            <span style="color:var(--accent-navy);">Tâm trạng ${log.mood}/5</span> ·
                            <span style="color:var(--emerald-brand);">Năng lượng ${log.energy}/5</span> ·
                            <span style="color:var(--accent-rose);">Đau ${log.pain}/10</span>
                          </div>
                          ${log.symptoms && log.symptoms.length > 0 ? `<div style="font-size:13px;color:var(--rose-deep);margin-top:2px;">Triệu chứng: ${esc(log.symptoms.join(', '))}</div>` : ''}
                          ${log.note ? `<div style="font-size:13.5px;color:var(--text-secondary);margin-top:2px;">${esc(log.note)}</div>` : ''}
                        </div>
                        <button type="button" class="pill-btn del-dlog-btn" data-id="${log.id}" style="min-height:38px;padding:5px 10px;background:var(--rose-soft);color:var(--rose-deep);border-color:var(--rose-border);" title="Xóa nhật ký này">
                          ${svgIcon('trash', 13)} Xóa
                        </button>
                      </div>
                    `).join('')}
                  </div>
                ` : ''}
              </div>
            </div>
          </div>

          <!-- HÀNG 2: ÂM THANH NHẮC UỐNG THUỐC CỦA NGƯỜI CON & TƯƠNG TÁC AI -->
          <div class="glass-panel" style="border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;">
            <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;">
              <div>
                <h3 style="font-size:17px;font-weight:800;color:var(--text-primary);display:flex;align-items:center;gap:8px;">
                  <span class="text-blue">${svgIcon('volume', 18)}</span> Âm Thanh Nhắc Nhở Uống Thuốc &amp; Tương Tác Trực Tiếp
                </h3>
                <p style="font-size:14px;color:var(--text-muted);">Giọng đọc tiếng Việt rõ ràng, chọn tốc độ đọc chậm dễ nghe kèm nút xác nhận cỡ lớn</p>
              </div>
              <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
                <select id="voice-preset-select" class="glass-input" style="padding:8px 12px;border-radius:10px;font-size:14px;">
                  <option value="0" ${state.voicePresetIndex === 0 ? 'selected' : ''}>Giọng con gái nhắc Bố</option>
                  <option value="1" ${state.voicePresetIndex === 1 ? 'selected' : ''}>Giọng con trai nhắc Mẹ</option>
                  <option value="2" ${state.voicePresetIndex === 2 ? 'selected' : ''}>Giọng điều dưỡng thân thiện</option>
                </select>
                <button type="button" id="btn-voice-slow" class="pill-btn" style="padding:6px 11px;${state.voiceSlowMode ? 'background:#1E3A5F;color:#FFFFFF;border-color:#1E3A5F;' : ''}">
                  Đọc chậm 0.8x
                </button>
                <button type="button" id="btn-voice-norm" class="pill-btn" style="padding:6px 11px;${!state.voiceSlowMode ? 'background:#1E3A5F;color:#FFFFFF;border-color:#1E3A5F;' : ''}">
                  Tốc độ vừa 0.94x
                </button>
                <button id="btn-speak-reminder" class="pill-btn" style="background:var(--surface-emerald);color:var(--emerald-brand);border-color:var(--border-emerald);">
                  ${svgIcon('volume', 15)} ${state.isSpeaking ? 'Đang phát giọng nói...' : 'Phát Giọng Nói Nhắc Nhở'}
