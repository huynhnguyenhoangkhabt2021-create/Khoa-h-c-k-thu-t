                            ` : ''}
                            <a href="tel:${esc(cleanTel)}" class="pill-btn" style="min-height:38px;padding:5px 10px;font-size:13px;background:var(--surface-emerald);color:var(--emerald-brand);border-color:var(--border-strong);text-decoration:none;">
                              ${svgIcon('phone', 13)} Gọi
                            </a>
                            <a href="sms:${esc(cleanTel)}?body=${smsText}" class="pill-btn" style="min-height:38px;padding:5px 10px;font-size:13px;background:var(--surface-blue);color:var(--accent-navy);border-color:var(--border-strong);text-decoration:none;">
                              SMS
                            </a>
                            <a href="https://zalo.me/${esc(cleanTel)}" target="_blank" rel="noopener noreferrer" class="pill-btn" style="min-height:38px;padding:5px 10px;font-size:13px;background:var(--surface-cyan);color:var(--accent-cyan);border-color:var(--border-strong);text-decoration:none;">
                              Zalo
                            </a>
                            ${perms.canEditHealthProfile || perms.canManagePermissions ? `
                              <button class="pill-btn del-fc-btn" data-id="${fc.id}" style="min-height:38px;padding:5px 10px;font-size:13px;background:var(--rose-soft);color:var(--rose-deep);border-color:var(--rose-border);" title="Xóa liên hệ">
                                ${svgIcon('trash', 13)} Xóa
                              </button>
                            ` : ''}
                          </div>
                        </div>
                      `;
                    }).join('')}
                  </div>
                `}
              </div>

              <!-- Bảng tin kết nối trực tuyến gia đình (Phải 5/12) -->
              <div class="lg-span-5" style="display:flex;flex-direction:column;gap:8px;">
                <div style="display:flex;flex-wrap:wrap;gap:6px;">
                  <button class="pill-btn family-quick-btn" data-msg="Con ơi, hôm nay bố/mẹ khỏe!" style="padding:6px 10px;font-size:13px;background:var(--surface-emerald);color:var(--emerald-brand);border-color:var(--border-strong);">
                    💚 Bố/mẹ khỏe
                  </button>
                  <button class="pill-btn family-quick-btn" data-msg="Bố/mẹ đã uống thuốc đúng giờ rồi nhé." style="padding:6px 10px;font-size:13px;background:var(--surface-blue);color:var(--accent-navy);border-color:var(--border-strong);">
                    💊 Đã uống thuốc
                  </button>
                  <button class="pill-btn family-quick-btn" data-msg="Bố/mẹ hơi mệt, rảnh con gọi lại cho bố/mẹ nhé!" style="padding:6px 10px;font-size:13px;background:var(--surface-amber);color:#B45309;border-color:var(--border-strong);">
                    📞 Con gọi lại nhé
                  </button>
                </div>

                <div style="background:var(--card-bg);border:1px solid var(--border-subtle);border-radius:12px;padding:9px;height:165px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;">
                  ${state.familyMessages.length === 0 ? `
                    <div style="font-size:13.5px;color:var(--text-muted);text-align:center;margin:auto;">
                      Chưa có tin nhắn trong phòng <strong>${esc(state.familyRoomCode)}</strong>. Hãy gửi lời nhắn nhanh cho con cháu!
                    </div>
                  ` : state.familyMessages.map(fm => `
                    <div style="padding:7px 10px;border-radius:9px;font-size:13.5px;background:${fm.type === 'sos' ? 'var(--rose-soft)' : fm.type === 'sensor' ? 'var(--surface-emerald)' : 'var(--panel-bg)'};border:1px solid var(--border-subtle);">
                      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);">
                        <strong style="color:${fm.type === 'sos' ? 'var(--rose-deep)' : fm.type === 'sensor' ? 'var(--emerald-brand)' : 'var(--accent-navy)'};">${esc(fm.sender)}</strong>
                        <span>${esc(fm.time)}</span>
                      </div>
                      <div style="color:var(--text-primary);margin-top:2px;">${esc(fm.text)}</div>
                    </div>
                  `).join('')}
                </div>

                <form id="family-msg-form" style="display:flex;gap:6px;">
                  <input id="family-msg-input" type="text" class="glass-input" placeholder="Nhắn tin cho gia đình..." style="flex:1;min-height:44px;padding:7px 10px;border-radius:9px;font-size:14.5px;" />
                  <button type="submit" class="pill-btn gemini-gradient-bg text-white" style="border:none;padding:7px 14px;font-size:14px;">
                    ${svgIcon('send', 14)} Gửi
                  </button>
                </form>
              </div>
            </div>
          </div>

          <!-- HÀNG 4: LỊCH SỬ HOẠT ĐỘNG HỆ THỐNG & CẢNH BÁO THIẾT BỊ -->
          <div class="glass-panel" id="activity-history-panel" style="border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;">
            <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;">
              <div>
                <h4 style="font-size:16px;font-weight:800;color:var(--text-primary);display:flex;align-items:center;gap:8px;">
                  ${svgIcon('history', 18)} Lịch Sử Hoạt Động Hệ Thống &amp; Cảnh Báo Thiết Bị (${filteredActivities.length})
                </h4>
                <p style="font-size:13px;color:var(--text-secondary);">Ghi nhận đầy đủ sự kiện kết nối ESP32, lỗi cảm biến, lấy/uống thuốc, điều chỉnh máy lọc khí, SOS và bảo mật.</p>
              </div>
              <div style="display:flex;flex-wrap:wrap;gap:6px;">
                ${[
                  { id: 'all', label: 'Tất cả' },
                  { id: 'device', label: 'Thiết bị / Lỗi' },
                  { id: 'medication', label: 'Thuốc' },
                  { id: 'air', label: 'Không khí' },
                  { id: 'sos', label: 'SOS / Bảo mật' }
                ].map(f => `
                  <button type="button" class="pill-btn act-filter-btn" data-filter="${f.id}" style="padding:5px 11px;min-height:36px;font-size:12.5px;${state.activityFilter === f.id ? 'background:#1E3A5F;color:#FFFFFF;border-color:#1E3A5F;' : ''}">
                    ${f.label}
                  </button>
                `).join('')}
              </div>
            </div>

            <div style="max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:7px;">
              ${filteredActivities.length === 0 ? `
                <p style="font-size:14px;color:var(--text-muted);padding:10px 0;">Chưa có nhật ký hoạt động nào trong nhóm này.</p>
              ` : filteredActivities.slice(0, 30).map(act => {
                const isDanger = act.level === 'danger' || act.level === 'critical';
                const isWarn = act.level === 'warn' || act.level === 'warning';
                const actBg = isDanger ? 'var(--rose-soft)' : isWarn ? 'var(--surface-amber)' : 'var(--card-bg)';
                const actColor = isDanger ? 'var(--rose-deep)' : isWarn ? '#B45309' : 'var(--emerald-brand)';
                return `
                  <div class="glass-card" style="padding:9px 12px;border-radius:12px;background:${actBg};border-left:4px solid ${actColor};display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
                    <div style="font-size:13.5px;color:var(--text-primary);">
                      <div style="font-weight:800;color:${actColor};">${esc(act.title)}</div>
                      <div style="font-size:13px;color:var(--text-secondary);margin-top:2px;">${esc(act.detail)}</div>
                    </div>
                    <div style="text-align:right;font-size:12px;color:var(--text-muted);flex-shrink:0;">
                      <div class="font-mono">${esc(act.time)}</div>
                      <div>${esc(act.actor || 'Hệ thống')}</div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <!-- HÀNG 5: LỊCH SỬ BẤT THƯỜNG & LỊCH SỬ LỌC Ô NHIỄM (50 / 50) -->
          <div class="grid lg-grid-2" style="gap:12px;">
            <div class="glass-panel" style="border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;">
              <div style="display:flex;align-items:center;justify-content:space-between;">
                <h4 style="font-size:15px;font-weight:800;color:var(--rose-deep);">LỊCH SỬ SỨC KHỎE BẤT THƯỜNG (${state.abnormalLogs.length})</h4>
                ${state.abnormalLogs.length > 0 && perms.canEditHealthProfile ? `<button id="btn-clear-abn" class="pill-btn" style="padding:5px 11px;font-size:13px;color:var(--rose-deep);background:var(--rose-soft);border-color:var(--rose-border);">Xóa tất cả</button>` : ''}
              </div>
              <div style="max-height:170px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;">
                ${state.abnormalLogs.length === 0 ? `<p style="font-size:14px;color:var(--text-muted);">Chưa ghi nhận chỉ số sinh hiệu bất thường nào.</p>` : state.abnormalLogs.map(log => `
                  <div class="glass-card" style="padding:9px 11px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--rose-soft);border-color:var(--rose-border);">
                    <div style="font-size:14px;">
                      <strong class="text-rose">${esc(log.type)}</strong> — <span style="color:var(--text-primary);font-weight:700;">${esc(log.memberName)}</span>
                      <div style="font-size:13px;color:var(--text-secondary);">Giá trị: ${esc(log.value)} • Lúc ${esc(log.timestamp)}</div>
                    </div>
                    ${perms.canEditHealthProfile ? `<button class="del-abn-btn" data-id="${log.id}" style="background:transparent;color:var(--text-secondary);padding:6px;">${svgIcon('trash', 15)}</button>` : ''}
                  </div>
                `).join('')}
              </div>
            </div>

            <div class="glass-panel" style="border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;">
              <div style="display:flex;align-items:center;justify-content:space-between;">
                <h4 style="font-size:15px;font-weight:800;color:var(--accent-cyan);">LỊCH SỬ LỌC KHÔNG KHÍ Ô NHIỄM (${state.airLogs.length})</h4>
                ${state.airLogs.length > 0 && perms.canControlPurifier ? `<button id="btn-clear-air" class="pill-btn" style="padding:5px 11px;font-size:13px;color:var(--accent-cyan);background:var(--surface-cyan);border-color:var(--border-strong);">Xóa tất cả</button>` : ''}
              </div>
              <div style="max-height:170px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;">
                ${state.airLogs.length === 0 ? `<p style="font-size:14px;color:var(--text-muted);">Không khí phòng ở đang trong ngưỡng ổn định.</p>` : state.airLogs.map(log => `
                  <div class="glass-card" style="padding:9px 11px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface-cyan);border-color:var(--border-subtle);">
                    <div style="font-size:14px;">
                      <strong class="text-cyan">AQI ${log.aqi} • PM2.5 ${log.pm25} µg/m³</strong> (${esc(log.timestamp)})
                      <div style="font-size:13px;color:var(--text-secondary);">${esc(log.description)} -> ${esc(log.actionTaken)}</div>
                    </div>
                    ${perms.canControlPurifier ? `<button class="del-air-btn" data-id="${log.id}" style="background:transparent;color:var(--text-secondary);padding:6px;">${svgIcon('trash', 15)}</button>` : ''}
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        </div>
      `;

      if (activeWearer) startPPGAnimation(activeWearer.restBPM || 74);
      else stopPPGAnimation();

      // Health Daily Log Event Handlers
      document.getElementById('dlog-date').onchange = (e) => { state.dailyLogDraft.dateKey = e.target.value; };
      document.getElementById('dlog-period').onchange = (e) => { state.dailyLogDraft.timeOfDay = e.target.value; };
      document.getElementById('dlog-note').oninput = (e) => { state.dailyLogDraft.note = e.target.value; };

      container.querySelectorAll('.dlog-mood-btn').forEach(btn => {
        btn.onclick = () => {
          state.dailyLogDraft.mood = Number(btn.dataset.val);
          state.dailyLogError = '';
          renderMain();
        };
      });
      container.querySelectorAll('.dlog-energy-btn').forEach(btn => {
        btn.onclick = () => {
          state.dailyLogDraft.energy = Number(btn.dataset.val);
          state.dailyLogError = '';
          renderMain();
        };
      });
      container.querySelectorAll('.dlog-pain-btn').forEach(btn => {
        btn.onclick = () => {
          state.dailyLogDraft.pain = Number(btn.dataset.val);
          state.dailyLogError = '';
          renderMain();
        };
      });
      container.querySelectorAll('.dlog-sym-btn').forEach(btn => {
        btn.onclick = () => {
          const sym = btn.dataset.sym;
          if (state.dailyLogDraft.symptoms.includes(sym)) {
            state.dailyLogDraft.symptoms = state.dailyLogDraft.symptoms.filter(x => x !== sym);
          } else {
            state.dailyLogDraft.symptoms.push(sym);
          }
          renderMain();
        };
      });

      document.getElementById('btn-dlog-7d').onclick = () => { state.dailyLogChartDays = 7; renderMain(); };
      document.getElementById('btn-dlog-14d').onclick = () => { state.dailyLogChartDays = 14; renderMain(); };

      const seedSampleBtn = document.getElementById('btn-seed-sample-dlog');
      if (seedSampleBtn) {
        seedSampleBtn.onclick = async () => {
          const samples = buildSampleDailyLogs();
          state.dailyLogs = samples;
          state.dailyLogNotice = 'Đã nạp 5 ngày nhật ký mẫu để bạn xem trước biểu đồ trực quan!';
          saveJSON('smart_health_daily_logs', state.dailyLogs);
          for (const s of samples) { await pushDailyLogToServer(s); }
          renderMain();
        };
      }

      container.querySelectorAll('.dlog-day-select-btn').forEach(btn => {
        btn.onclick = () => {
          state.dailyLogSelectedDate = state.dailyLogSelectedDate === btn.dataset.date ? '' : btn.dataset.date;
          renderMain();
        };
      });

      document.getElementById('daily-log-form').onsubmit = async (e) => {
        e.preventDefault();
        state.dailyLogDraft.dateKey = document.getElementById('dlog-date').value || todayKey();
        state.dailyLogDraft.timeOfDay = document.getElementById('dlog-period').value || 'Sáng';
        state.dailyLogDraft.note = document.getElementById('dlog-note').value;
        const check = validateDailyLogInput(state.dailyLogDraft);
        if (!check.valid) {
          state.dailyLogError = check.error;
          state.dailyLogNotice = '';
          renderMain();
          return;
        }
        state.dailyLogs.unshift(check.entry);
        if (state.dailyLogs.length > 90) state.dailyLogs.length = 90;
        state.dailyLogError = '';
        state.dailyLogNotice = `Đã lưu nhật ký ngày ${check.entry.dateKey} (Buổi ${check.entry.timeOfDay}) và cập nhật biểu đồ!`;
        state.dailyLogSelectedDate = check.entry.dateKey;
        state.dailyLogDraft.note = '';
        state.dailyLogDraft.symptoms = [];
        await pushDailyLogToServer(check.entry);
        playChime();
        renderMain();
      };

      container.querySelectorAll('.del-dlog-btn').forEach(btn => {
        btn.onclick = async () => {
          const id = btn.dataset.id;
          state.dailyLogs = state.dailyLogs.filter(x => x.id !== id);
          state.dailyLogNotice = 'Đã xóa bản ghi nhật ký.';
          await deleteDailyLogOnServer(id);
          renderMain();
        };
      });

      // Dashboard Event Handlers
      const wearerSel = document.getElementById('dash-wearer-select');
      if (wearerSel) {
        wearerSel.onchange = (e) => {
          state.selectedMemberId = e.target.value;
          renderMain();
        };
      }
      // ESP32 Bindings & Simulation Toggle
      const btnSerial = document.getElementById('btn-esp32-serial');
      if (btnSerial) btnSerial.onclick = () => connectEsp32Serial();
      const btnBle = document.getElementById('btn-esp32-ble');
      if (btnBle) btnBle.onclick = () => connectEsp32Ble();
      const btnSim = document.getElementById('btn-esp32-toggle-sim');
      if (btnSim) btnSim.onclick = () => toggleEsp32Simulation();
      const btnCopyHttp = document.getElementById('btn-esp32-copy-http');
      if (btnCopyHttp) {
        btnCopyHttp.onclick = () => {
          const url = `${window.location.origin}/api/esp32/telemetry`;
          const sample = `POST ${url}\n{"deviceId":"ESP32-NODE-01","roomCode":"${state.familyRoomCode}","bpm":76,"spo2":98,"bodyTemp":36.6,"pm25":18.4,"roomTemp":26.2,"roomHumid":58,"traySensors":{"morningBefore":true}}`;
          if (navigator.clipboard) navigator.clipboard.writeText(sample).catch(() => {});
          state.esp32.endpointCopied = true;
          logActivity('device', 'info', 'Sao chép Endpoint ESP32 HTTP POST', url);
          renderMain();
          setTimeout(() => { state.esp32.endpointCopied = false; if (state.activeTab === 'dashboard') renderMain(); }, 2200);
        };
      }

      // Activity Filter Bindings
      container.querySelectorAll('.act-filter-btn').forEach(btn => {
        btn.onclick = () => {
          state.activityFilter = btn.dataset.filter || 'all';
          renderMain();
        };
      });

      const addWearerBtn = document.getElementById('btn-add-wearer');
      if (addWearerBtn) addWearerBtn.onclick = () => { state.activeModal = 'addWearer'; renderModal(); };

      const abnBtn = document.getElementById('btn-sim-abnormal');
      if (abnBtn && activeWearer) {
        abnBtn.onclick = () => {
          const item = {
            id: 'abn-' + Date.now(),
            timestamp: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }),
            memberName: activeWearer.name,
            type: 'Nhịp Tim Nhanh',
            value: (activeWearer.restBPM + 34) + ' BPM / SpO2 93%',
            severity: 'warning'
          };
          state.abnormalLogs.unshift(item);
          saveJSON('smart_health_abnormal_logs', state.abnormalLogs);
          logActivity('device', 'danger', 'Cảnh báo sinh hiệu bất thường', `${activeWearer.name}: ${item.value}`);
          playChime();
          renderMain();
        };
      }

      document.getElementById('voice-preset-select').onchange = (e) => {
        state.voicePresetIndex = Number(e.target.value);
        renderMain();
      };
      document.getElementById('btn-voice-slow').onclick = () => { state.voiceSlowMode = true; renderMain(); };
      document.getElementById('btn-voice-norm').onclick = () => { state.voiceSlowMode = false; renderMain(); };
      document.getElementById('btn-speak-reminder').onclick = () => {
        playChime();
        setTimeout(() => speakVi(voiceScripts[state.voicePresetIndex] || voiceScripts[0]), 450);
      };
      document.getElementById('btn-stop-speak').onclick = () => {
        stopSpeak();
        renderMain();
      };

      document.getElementById('btn-elder-taken').onclick = () => {
        const tray0 = state.trays[0];
        const tKey = todayKey();
        const curMin = nowMinutes();
        let nextSlot = MEDICATION_TIMING_SLOTS.find(s => !state.takeLogs.some(l => l.dateKey === tKey && l.trayId === (tray0 ? tray0.id : 'tray-1') && l.slotKey === s.key)) || MEDICATION_TIMING_SLOTS[0];
        if (tray0 && nextSlot) {
          confirmSlotConsumed(tray0.id, nextSlot.key);
        }
        const msg = 'Con đã ghi nhận Bố/Mẹ xác nhận ĐÃ UỐNG THUỐC xong rồi ạ! Chúc Bố/Mẹ thật nhiều sức khỏe.';
        addVoiceDialogue('ai', msg);
        state.voiceStatusNote = 'Đã xác nhận uống thuốc cữ ' + nextSlot.shortLabel;
        sendFamilyRoomMessage(`Đã xác nhận ĐÃ UỐNG THUỐC (${nextSlot.shortLabel}) lúc ${new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })}.`, 'med');
        speakVi(msg);
      };

      document.getElementById('btn-elder-snooze').onclick = () => {
        const msg = 'Dạ vâng, hệ thống sẽ nhắc lại sau 5 phút nữa ạ.';
        addVoiceDialogue('ai', msg);
        state.voiceStatusNote = 'Đã hẹn nhắc lại sau 5 phút';
        speakVi(msg);
        renderMain();
      };

      document.getElementById('btn-elder-ask-guide').onclick = () => {
        const msg = 'Bố/Mẹ uống thuốc với 150ml nước lọc ấm, không uống cùng nước trà đặc hay sữa, và ngồi thẳng lưng ít nhất 10 phút sau uống ạ.';
        addVoiceDialogue('ai', msg);
        speakVi(msg);
        renderMain();
      };

      container.querySelectorAll('.voice-faq-btn').forEach(btn => {
        btn.onclick = () => handleVoiceDialogueQuestion(btn.dataset.q);
      });

      document.getElementById('voice-ask-form').onsubmit = (e) => {
        e.preventDefault();
        const inp = document.getElementById('voice-ask-input');
        if (inp.value.trim()) handleVoiceDialogueQuestion(inp.value.trim());
      };

      document.getElementById('btn-purifier-auto').onclick = () => sendPurifierCommand('auto', computeAutoPurifierLevel(state.pm25));
      document.getElementById('btn-purifier-m1').onclick = () => sendPurifierCommand('manual', 1);
      document.getElementById('btn-purifier-m2').onclick = () => sendPurifierCommand('manual', 2);
      document.getElementById('btn-purifier-m3').onclick = () => sendPurifierCommand('manual', 3);

      // Family Connection Bindings
      document.getElementById('btn-join-room').onclick = async () => {
        const raw = document.getElementById('family-room-input').value.trim().toUpperCase().replace(/[^A-Z0-9_-]/g, '').slice(0, 32);
        if (!raw) return;
        state.familyRoomCode = raw;
        saveJSON('smart_health_family_room', raw);
        state.familySyncNotice = `Đã kết nối phòng gia đình: ${raw}`;
        await pullFamilyRoomFromServer();
        renderMain();
      };

      document.getElementById('btn-share-room').onclick = () => {
        const shareUrl = `${window.location.origin}${window.location.pathname}?room=${encodeURIComponent(state.familyRoomCode)}`;
        if (navigator.share) {
          navigator.share({
            title: 'Smart Healthcare - Kết Nối Gia Đình',
            text: `Tham gia phòng theo dõi sức khỏe gia đình (${state.familyRoomCode}):`,
            url: shareUrl
          }).catch(() => {});
        }
        if (navigator.clipboard) {
          navigator.clipboard.writeText(shareUrl).catch(() => {});
        }
        state.familyCopiedLink = true;
        state.familySyncNotice = `Link kết nối gia đình: ${shareUrl}`;
        renderMain();
        setTimeout(() => { state.familyCopiedLink = false; if (state.activeTab === 'dashboard') renderMain(); }, 2500);
      };

      const enableGpsBtn = document.getElementById('btn-enable-always-gps');
      if (enableGpsBtn) {
        enableGpsBtn.onclick = () => {
          initAlwaysOnGeolocation(true);
          state.familySyncNotice = 'Đang kích hoạt định vị GPS liên tục để sẵn sàng gửi kèm khi SOS.';
          renderMain();
        };
      }
      const openSetupBtn = document.getElementById('btn-open-sos-setup');
      if (openSetupBtn) {
        openSetupBtn.onclick = () => {
          state.sosSetupError = '';
          state.activeModal = 'sosSetup';
          initAlwaysOnGeolocation(true);
          renderModal();
        };
      }

      document.getElementById('family-contact-form').onsubmit = async (e) => {
        e.preventDefault();
        if (!perms.canEditHealthProfile && !perms.canManagePermissions) {
          state.familySyncNotice = 'Tài khoản hiện tại không có quyền thêm/sửa danh bạ người thân.';
          renderMain();
          return;
        }
        const name = document.getElementById('fc-name').value.trim();
        const relation = document.getElementById('fc-rel').value;
        const rawPhone = document.getElementById('fc-phone').value.trim();
        const digits = rawPhone.replace(/\D/g, '');
        if (!name || digits.length < 9) {
          state.familySyncNotice = 'Vui lòng nhập họ tên và số điện thoại hợp lệ (tối thiểu 9 chữ số) để liên kết cảnh báo.';
          renderMain();
          return;
        }
        const priority = Number(document.getElementById('fc-priority').value) || 1;
        const accessLevel = document.getElementById('fc-access') ? document.getElementById('fc-access').value : 'view_only';
        const email = document.getElementById('fc-email').value.trim();
        const note = document.getElementById('fc-note').value.trim();
        const autoSos = document.getElementById('fc-auto-sos').checked;
        const channels = Array.from(container.querySelectorAll('.fc-chan-chk:checked')).map(c => c.value);

        state.familyContacts.push({
          id: 'fc-' + Date.now(),
          name,
          relation,
          phone: rawPhone,
          email,
          priority,
          accessLevel,
          autoSos,
          channels: channels.length > 0 ? channels : ['Gọi điện', 'SMS'],
          note
        });
        state.familySyncNotice = `Đã liên kết SĐT ${name} (Ưu tiên ${priority} · Quyền: ${accessLabels[accessLevel] || accessLevel}).`;
        logActivity('security', 'info', `Thêm & phân quyền người thân: ${name}`, `Mức ưu tiên ${priority}, quyền ${accessLabels[accessLevel] || accessLevel}.`);
        await pushContactsToFamilyRoom();
        renderMain();
      };

      container.querySelectorAll('.fc-role-update-sel').forEach(sel => {
        sel.onchange = async () => {
          if (!perms.canManagePermissions) return;
          const target = state.familyContacts.find(x => x.id === sel.dataset.id);
          if (target) {
            target.accessLevel = sel.value;
            state.familySyncNotice = `Đã cập nhật quyền truy cập của ${target.name} thành: ${accessLabels[sel.value] || sel.value}.`;
            logActivity('security', 'info', `Cập nhật phân quyền: ${target.name}`, `Chuyển quyền sang ${accessLabels[sel.value] || sel.value}.`);
            await pushContactsToFamilyRoom();
            renderMain();
          }
        };
      });

      container.querySelectorAll('.del-fc-btn').forEach(btn => {
        btn.onclick = async () => {
          if (!perms.canEditHealthProfile && !perms.canManagePermissions) return;
          state.familyContacts = state.familyContacts.filter(x => x.id !== btn.dataset.id);
          await pushContactsToFamilyRoom();
          renderMain();
        };
      });

      container.querySelectorAll('.family-quick-btn').forEach(btn => {
        btn.onclick = async () => {
          await sendFamilyRoomMessage(btn.dataset.msg, 'checkin');
          state.familySyncNotice = 'Đã gửi tin nhắn trực tiếp tới phòng gia đình.';
          renderMain();
        };
      });

      document.getElementById('family-msg-form').onsubmit = async (e) => {
        e.preventDefault();
        const inp = document.getElementById('family-msg-input');
        const txt = inp.value.trim();
        if (!txt) return;
        await sendFamilyRoomMessage(txt, 'checkin');
        inp.value = '';
        renderMain();
      };

      const clrAbn = document.getElementById('btn-clear-abn');
      if (clrAbn) clrAbn.onclick = () => { state.abnormalLogs = []; saveJSON('smart_health_abnormal_logs', []); renderMain(); };
      const clrAir = document.getElementById('btn-clear-air');
      if (clrAir) clrAir.onclick = () => { state.airLogs = []; saveJSON('smart_health_air_logs', []); renderMain(); };

      container.querySelectorAll('.del-abn-btn').forEach(btn => {
        btn.onclick = () => {
          state.abnormalLogs = state.abnormalLogs.filter(x => x.id !== btn.dataset.id);
          saveJSON('smart_health_abnormal_logs', state.abnormalLogs);
          renderMain();
        };
      });
      container.querySelectorAll('.del-air-btn').forEach(btn => {
        btn.onclick = () => {
          state.airLogs = state.airLogs.filter(x => x.id !== btn.dataset.id);
          saveJSON('smart_health_air_logs', state.airLogs);
          renderMain();
        };
      });
    }

    function handleVoiceDialogueQuestion(qText) {
      addVoiceDialogue('user', qText);
      const q = qText.toLowerCase();
      let ans = 'Bố/Mẹ nhớ uống thuốc đúng cữ và uống đủ nước ấm, nếu thấy chóng mặt hãy nhấn nút SOS hoặc báo con ngay ạ.';
      if (q.includes('trước') || q.includes('sau ăn')) {
        ans = 'Thuốc huyết áp thường uống buổi sáng sau ăn nhẹ; thuốc tiểu đường uống ngay trước hoặc trong bữa ăn; thuốc mỡ máu uống buổi tối trước ngủ ạ.';
      } else if (q.includes('quên')) {
        ans = 'Nếu mới quên trong vòng 1–2 giờ thì uống bù ngay. Nếu đã gần tới cữ tiếp theo thì bỏ qua liều quên, tuyệt đối không uống gấp đôi liều ạ.';
      } else if (q.includes('trắng') || q.includes('lúc nào')) {
        ans = 'Viên màu trắng hỗ trợ ổn định huyết áp uống vào buổi sáng lúc 7 giờ 30 phút sau khi ăn sáng nhẹ ạ.';
      }
      addVoiceDialogue('ai', ans);
      speakVi(ans);
      renderMain();
    }

            ${!isReg && savedAccts.length > 0 ? `

                      <input id="auth-password" type="${state.authShowPass ? 'text' : 'password'}" required class="glass-input field-input" placeholder="Nhập mật khẩu..." style="padding-right:92px;" />

                <div class="auth-section-sos">
                  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;">
                    <div style="font-size:15.5px;font-weight:800;color:var(--rose-deep);">

                  <label class="field-label" for="auth-password">Mật khẩu *</label>

                ${isReg
                  ? 'Tạo Tài Khoản &amp; Lưu Số Khẩn Cấp →'
                  : (sosCurrentlyReady ? 'Đăng Nhập &amp; Vào Hệ Thống Ngay →' : 'Đăng Nhập &amp; Sang Bước 2 (SOS) →')}

      const backUserBtn = document.getElementById('btn-auth-back-user');

        backUserBtn.onclick = () => {
          state.currentUser = state.authReturnUser;
          state.authReturnUser = null;
          state.authError = '';
          state.authNotice = '';
          renderAll();
        };
      }

      document.getElementById('auth-tab-login').onclick = () => {
        state.authMode = 'login';
        state.authError = '';
        state.authNotice = '';
        renderMain();
      };
      document.getElementById('auth-tab-reg').onclick = () => {
        state.authMode = 'register';
        state.authError = '';
        state.authNotice = '';
        renderMain();
      };

      const preserveDraftAndToggleEye = () => {
        const snapshotIds = ['auth-fullname', 'auth-role', 'auth-username', 'auth-user-phone', 'auth-password', 'auth-em-name', 'auth-em-rel', 'auth-em-phone', 'auth-reg-addr'];
        const snap = {};
        snapshotIds.forEach(id => {
          const el = document.getElementById(id);
          if (el) snap[id] = el.value;
        });
        state.authShowPass = !state.authShowPass;
        renderMain();
        snapshotIds.forEach(id => {
          const el = document.getElementById(id);
          if (el && snap[id] !== undefined) el.value = snap[id];
        });
        const pEl = document.getElementById('auth-password');
        if (pEl) pEl.focus();
      };
      document.getElementById('auth-eye-btn').onclick = preserveDraftAndToggleEye;

      container.querySelectorAll('.saved-acct-tile').forEach(btn => {
        btn.onclick = () => {
          const picked = btn.dataset.pickUser || '';
          state.authPrefillUsername = picked;
          state.authError = '';
          const uInput = document.getElementById('auth-username');
          const pInput = document.getElementById('auth-password');
          if (uInput) uInput.value = picked;
          container.querySelectorAll('.saved-acct-tile').forEach(t => {
            t.classList.toggle('selected', (t.dataset.pickUser || '').toLowerCase() === picked.toLowerCase());
          });
          if (pInput) pInput.focus();
        };
      });

      container.querySelectorAll('.remove-saved-acct-btn').forEach(btn => {
        btn.onclick = () => {
          removeSavedDeviceAccount(btn.dataset.removeUser || '');
          if (state.authPrefillUsername && state.authPrefillUsername.toLowerCase() === (btn.dataset.removeUser || '').toLowerCase()) {
            state.authPrefillUsername = '';
          }
          renderMain();
        };
      });

      document.getElementById('auth-form').onsubmit = async (e) => {
        e.preventDefault();
        const users = seedDefaultUsers();
        const username = document.getElementById('auth-username').value.trim();
        const password = document.getElementById('auth-password').value;

        if (isReg) {
          const fullName = document.getElementById('auth-fullname').value.trim();
          const role = document.getElementById('auth-role').value;
          const userPhone = document.getElementById('auth-user-phone').value.trim();
          const emName = document.getElementById('auth-em-name').value.trim();
          const emRel = document.getElementById('auth-em-rel').value;
          const emPhone = document.getElementById('auth-em-phone').value.trim();
          const regAddr = document.getElementById('auth-reg-addr').value.trim();

          const draftSnap = { fullName, role, username, userPhone, password, emName, emRel, emPhone, regAddr };
          const check = validateRegistrationInput(users, {
            fullName,
            role,
            username,
            userPhone,
            password,
            emergencyName: emName,
            emergencyRelation: emRel,
            emergencyPhone: emPhone,
            existingEmergencyContacts: state.familyContacts
          });

          if (!check.ok) {
            state.authError = check.error;
            renderMain();
            const restoreMap = {
              'auth-fullname': draftSnap.fullName,
              'auth-role': draftSnap.role,
              'auth-username': draftSnap.username,
              'auth-user-phone': draftSnap.userPhone,
              'auth-password': draftSnap.password,
              'auth-em-name': draftSnap.emName,
              'auth-em-rel': draftSnap.emRel,
              'auth-em-phone': draftSnap.emPhone,
              'auth-reg-addr': draftSnap.regAddr
            };
            Object.entries(restoreMap).forEach(([id, val]) => {
              const el = document.getElementById(id);
              if (el && val !== undefined) el.value = val;
            });
            return;
          }

          users.push(check.newAccount);
          saveJSON('smart_health_auth_users', users);
          rememberDeviceAccount(check.newAccount);

          if (check.newEmergencyContact) {
            state.familyContacts.push(check.newEmergencyContact);
            state.familyContacts = removeStaleTestContact(state.familyContacts);
            await pushContactsToFamilyRoom();
          }

          if (regAddr) {
            state.emergencyLocation = {
              address: regAddr,
              updatedAt: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })
            };
            saveJSON('smart_health_emergency_location', state.emergencyLocation);
            const patient = state.members.find(x => x.id === state.profileMemberId) || state.members[0];
            if (patient) {
              patient.record = patient.record || {};
              patient.record.permanentAddress = regAddr;
              saveJSON('smart_health_members', state.members);
            }
          }

          state.currentUser = {
            username: check.newAccount.username,
            fullName: check.newAccount.fullName,
            role: check.newAccount.role,
            phone: check.newAccount.phone || ''
          };
          state.authReturnUser = null;
          state.authPrefillUsername = check.newAccount.username;
          saveJSON('smart_health_current_user', state.currentUser);
          initAlwaysOnGeolocation(true);

          const postRegReadiness = getSosReadiness();
          if (postRegReadiness.ready) {
            state.sosFlowCompleted = true;
            sessionStorage.setItem('smart_health_sos_step_done', '1');
          } else {
            state.sosFlowCompleted = false;
            sessionStorage.removeItem('smart_health_sos_step_done');
          }
          state.activeTab = 'dashboard';
          state.activeModal = null;
          state.authError = '';
          state.authNotice = '';
          renderAll();
          renderModal();
        } else {
          const found = findMatchingAccount(users, username, password);
          if (!found) {
            state.authError = 'Tên đăng nhập / SĐT hoặc mật khẩu chưa chính xác! Vui lòng kiểm tra lại (bạn có thể bấm nút "Hiện" để xem mật khẩu).';
            state.authPrefillUsername = username;
            renderMain();
            const pEl = document.getElementById('auth-password');
            if (pEl) pEl.focus();
            return;
          }
          rememberDeviceAccount(found);
          state.currentUser = {
            username: found.username,
            fullName: found.fullName,
            role: found.role,
            phone: found.phone || ''
          };
          state.authReturnUser = null;
          state.authPrefillUsername = found.username;
          saveJSON('smart_health_current_user', state.currentUser);
          initAlwaysOnGeolocation(true);

          const readiness = getSosReadiness();
          if (readiness.ready) {
            state.sosFlowCompleted = true;
            sessionStorage.setItem('smart_health_sos_step_done', '1');
          } else {
            state.sosFlowCompleted = false;
            sessionStorage.removeItem('smart_health_sos_step_done');
          }
          state.activeTab = 'dashboard';
          state.activeModal = null;
          state.authError = '';
          state.authNotice = '';
          renderAll();
          renderModal();
        }
      };
    }

    /* ========================================================================
       11. TAB 3: LỊCH THUỐC (TIMELINE VISUAL GRID, XÁC THỰC TÀI KHOẢN & KIỂM TOÁN 7 NGÀY)
       ======================================================================== */
    function renderMedicationTab(container) {
      if (!state.currentUser) {
        renderAuthGate(container, 'Lịch Thuốc Thông Minh');
        return;
      }

      const perms = getRolePermissions(state.currentUser.role);
      const tray = normalizeTraySchedule(state.trays.find(t => t.id === state.medActiveTrayId) || state.trays[0]);
      if (!Array.isArray(tray.daysOfWeek) || tray.daysOfWeek.length === 0) {
        tray.daysOfWeek = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];
      }
      const tKey = todayKey();
      const curMin = nowMinutes();
      const nowMs = Date.now();
      const unlocked = state.sensitiveUnlocked === true;
      const weekDays = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];

      const getSlotState = (dateKey, slot) => {
        const dose = tray.schedule[slot.key] || { time: slot.defaultTime, enabled: true };
        return resolveSlotDoseState({
          trayId: tray.id,
          slotKey: slot.key,
          dateKey,
          slotEnabled: dose.enabled !== false,
          slotTimeMinutes: timeToMinutes(dose.time || slot.defaultTime),
          nowMinutes: dateKey === tKey ? curMin : 0,
          takenOutLogs: state.takenOutLogs,
          takeLogs: state.takeLogs
        }, nowMs);
      };

      const enabledCount = MEDICATION_TIMING_SLOTS.filter(s => tray.schedule[s.key] && tray.schedule[s.key].enabled).length;
      const takenOutTodayCount = MEDICATION_TIMING_SLOTS.filter(s => {
        const st = getSlotState(tKey, s);
        return st.stage === 'taken_out' || st.stage === 'consumed';
      }).length;
      const consumedTodayCount = MEDICATION_TIMING_SLOTS.filter(s => getSlotState(tKey, s).stage === 'consumed').length;

      container.innerHTML = `
        <div class="grid grid-1" style="gap:12px;">
          <!-- Thanh cảnh báo bảo mật bắt buộc -->
          ${!unlocked ? `
            <div class="privacy-lock-bar">
              <div style="display:flex;align-items:center;gap:10px;font-size:13.5px;">
                ${svgIcon('lock', 18)}
                <div>
                  <strong>BẢO MẬT Y KHOA NGHIÊM NGẶT:</strong>
                  Tên thuốc cá nhân và liều dùng luôn được ẩn mặc định. Xác thực <strong>Tên đăng nhập &amp; Mật khẩu</strong> để xem/sửa tên thuốc chi tiết.
                </div>
              </div>
              <button id="btn-verify-med" class="pill-btn gemini-gradient-bg text-white" style="border:none;">
                ${svgIcon('shieldCheck', 14)} Xác Thực Tài Khoản &amp; Mật Khẩu Để Xem
              </button>
            </div>
          ` : `
            <div class="privacy-unlock-bar">
              <div style="display:flex;align-items:center;gap:10px;font-size:13.5px;">
                ${svgIcon('unlock', 18)}
                <div>
                  <strong>ĐÃ XÁC THỰC TÀI KHOẢN:</strong>
                  Bạn đang xem đầy đủ tên thuốc, giờ nhắc và lưu ý uống thuốc. Hãy khóa ẩn ngay sau khi xong.
                </div>
              </div>
              <button id="btn-lock-med" class="pill-btn" style="background:var(--panel-bg);color:var(--emerald-brand);border-color:var(--border-emerald);">
                ${svgIcon('lock', 14)} Khóa Ẩn Thông Tin Ngay
              </button>
            </div>
          `}

          ${!perms.canEditMedication ? `
            <div class="glass-panel" style="border-radius:14px;padding:10px 14px;background:var(--surface-blue);border-color:var(--border-blue);font-size:13.5px;color:var(--text-primary);font-weight:700;">
              🔒 Phân quyền hiện tại (${esc(perms.roleLabel)}):
              ${perms.canConfirmOwnDose
                ? 'Bạn có thể xác nhận <strong>Đã Uống Thuốc</strong> và theo dõi trạng thái từng khay; việc chỉnh sửa giờ nhắc hoặc tên thuốc do Bác sĩ / Người chăm sóc thực hiện.'
                : 'Chế độ <strong>Người thân Chỉ xem</strong> — chỉ theo dõi trạng thái lấy thuốc & uống thuốc, không thể thay đổi lịch hoặc xác nhận uống hộ.'}
            </div>
          ` : ''}

          <!-- Thanh chọn khay thuốc -->
          <div class="glass-panel" style="border-radius:18px;padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;">
            <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;">
              <span class="badge" style="background:var(--surface-emerald);color:var(--emerald-brand);border-color:var(--border-emerald);">
                ${svgIcon('shieldCheck', 13)} Theo Dõi 2 Bước: Lấy Khỏi Khay → Đã Uống
              </span>
              ${state.trays.map(t => `
                <button class="pill-btn tray-sel-btn" data-id="${t.id}" style="${t.id === tray.id ? 'background:linear-gradient(135deg,#1E3A5F,#2B547E);color:#FFFFFF;border-color:var(--gold);' : ''}">
                  ${svgIcon('pill', 13)} Khay #${t.trayNumber}: ${esc(t.assignedMemberName)}
                </button>
              `).join('')}
              <button id="btn-add-tray" class="pill-btn" style="background:var(--surface-emerald);color:var(--emerald-brand);border-color:var(--border-emerald);" ${!perms.canEditMedication ? 'disabled title="Chỉ Bác sĩ hoặc Người chăm sóc mới được thêm khay"' : ''}>
                ${svgIcon('plus', 13)} Thêm Khay Thuốc Mới
              </button>
            </div>
          </div>

          <!-- Bảng lịch uống thuốc chuẩn theo 4 khung giờ trong ngày (CHO PHÉP ĐẶT LỊCH TRỰC TIẾP) -->
          <div class="glass-panel" style="border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;border-top:3px solid var(--gold);">
            <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;">
              <div>

              </div>
              <button type="button" id="btn-sched-all-days" class="pill-btn" style="padding:6px 11px;font-size:12.5px;" ${!perms.canEditMedication ? 'disabled' : ''}>
                Chọn cả tuần (Hằng ngày)
              </button>
            </div>

            <div class="table-wrap responsive-schedule-wrap">
              <table class="data-table responsive-schedule-table">

                    <th>Nhóm thuốc / Toa cá nhân</th>
                    <th>Lưu ý cách uống</th>
                  </tr>
                </thead>
                <tbody>
                  ${MEDICATION_TIMING_SLOTS.map(s => {
                    const dose = tray.schedule[s.key] || { time: s.defaultTime, enabled: true, medicines: s.defaultMeds, note: s.note };
                    return `
                      <tr>
                        <td data-label="Khung giờ trong ngày" style="font-weight:800;color:var(--accent-navy);white-space:nowrap;">
                          <div style="font-size:14.5px;">${s.icon} ${esc(s.dayPart)}</div>
                          <label style="display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;font-weight:700;color:${dose.enabled ? 'var(--emerald-brand)' : 'var(--text-muted)'};cursor:pointer;">
                            <input type="checkbox" class="sched-enable-chk" data-sess="${s.key}" ${dose.enabled ? 'checked' : ''} ${!perms.canEditMedication ? 'disabled' : ''} style="width:17px;height:17px;accent-color:#1E3A5F;" />
                            ${dose.enabled ? 'Đang bật nhắc' : 'Tạm tắt cữ'}

                        <td data-label="Thời điểm & Đặt giờ hẹn">
                          <label style="display:block;font-size:12px;color:var(--text-secondary);font-weight:700;margin-bottom:4px;">Ghi chú thời điểm (VD: Trước ăn / Sau ăn):</label>
                          <input type="text" class="glass-input sched-timing-inp" data-sess="${s.key}" value="${esc(dose.timing || s.timing)}" ${!perms.canEditMedication ? 'readonly' : ''} placeholder="Nhập thời điểm uống..." style="width:100%;padding:6px 9px;border-radius:9px;font-size:13.5px;font-weight:700;margin-bottom:7px;" />
                          <div style="display:flex;align-items:center;gap:6px;">
                            <span style="font-size:12.5px;color:var(--text-secondary);font-weight:700;">Giờ hẹn:</span>
                            <input type="time" class="glass-input sched-time-inp font-mono" data-sess="${s.key}" value="${esc(dose.time)}" ${!perms.canEditMedication ? 'readonly' : ''} style="padding:6px 9px;border-radius:9px;font-size:14.5px;font-weight:800;min-width:124px;" />

                              </button>
                            </div>
                          `}

                        <td data-label="Lưu ý cách uống" style="min-width:220px;">
                          <textarea rows="3" class="glass-input sched-note-inp" data-sess="${s.key}" ${!perms.canEditMedication ? 'readonly' : ''} style="width:100%;min-height:76px;padding:7px 9px;border-radius:9px;font-size:13.5px;font-weight:600;resize:vertical;line-height:1.4;">${esc(dose.note || s.note)}</textarea>
                        </td>
                      </tr>
                    `;

                </tbody>
              </table>
            </div>

            <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;">
              <button type="button" id="btn-test-med-alarm" class="pill-btn" style="background:var(--surface-amber);color:var(--accent-amber);border-color:var(--border-amber);">
                ${svgIcon('bell', 14)} Thử Chuông &amp; Giọng Nhắc Ngay
              </button>
              <button type="button" id="btn-save-schedule-table" class="pill-btn gemini-gradient-bg text-white" style="padding:10px 18px;" ${!perms.canEditMedication ? 'disabled' : ''}>
                ${svgIcon('save', 15)} Lưu Đặt Lịch Thuốc
              </button>
            </div>

            ${state.medScheduleNotice ? `
              <div id="med-sched-toast" style="padding:9px 13px;border-radius:12px;background:var(--surface-emerald);border:1px solid var(--border-emerald);color:var(--emerald-brand);font-size:13.5px;font-weight:700;">
                ✓ ${esc(state.medScheduleNotice)}
              </div>
            ` : ''}
          </div>

          <!-- Cảm Biến Vật Cản Khay Thuốc (Tách biệt 2 bước: Lấy ra khỏi khay vs Đã uống thuốc) -->
          <div class="glass-panel" style="border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:11px;border-color:var(--border-emerald);">
            <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;">
              <div>
                <h2 style="font-size:16px;font-weight:800;color:var(--emerald-brand);display:flex;align-items:center;gap:8px;">
                  ${svgIcon('activity', 18)} Cảm Biến Vật Cản Khay Thuốc (Phân Biệt 2 Trạng Thái Rõ Ràng)
                </h2>
                <p style="font-size:13px;color:var(--text-secondary);">
                  <strong>Bước 1:</strong> Cảm biến IR phát hiện túm thuốc biến mất → ghi nhận <strong>"Đã lấy khỏi khay"</strong> (chưa coi là đã uống).
                  <strong>Bước 2:</strong> Người bệnh / người chăm sóc bấm <strong>"Xác nhận Đã Uống"</strong> sau khi nuốt thuốc.
                </p>
              </div>
              <button type="button" id="btn-refill-all-pouches" class="pill-btn" style="background:var(--surface-blue);color:var(--accent-navy);border-color:var(--border-blue);font-size:12.5px;" ${!perms.canEditMedication ? 'disabled' : ''}>
                ${svgIcon('refresh', 13)} Nạp Lại Túm Thuốc Cả 4 Ngăn
              </button>
            </div>

            <div class="grid sm-grid-2 lg-grid-4" style="gap:9px;">
              ${MEDICATION_TIMING_SLOTS.map(s => {
                const dose = tray.schedule[s.key] || { timing: s.timing, pouchPresent: true };
                const present = dose.pouchPresent !== false;
                const dState = getSlotState(tKey, s);
                const cardBg = dState.stage === 'consumed'
                  ? 'var(--surface-emerald)'
                  : dState.stage === 'taken_out'
                  ? 'var(--surface-cyan)'
                  : 'var(--card-bg)';
                const badgeBg = dState.stage === 'consumed'
                  ? 'background:var(--surface-emerald);color:var(--emerald-brand);border-color:var(--border-emerald);'
                  : dState.stage === 'taken_out'
                  ? 'background:var(--surface-amber);color:var(--accent-amber);border-color:var(--border-amber);'
                  : 'background:var(--surface-blue);color:var(--accent-navy);border-color:var(--border-blue);';
                return `
                  <div class="glass-card" style="padding:11px;border-radius:14px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;background:${cardBg};">
                    <div>
                      <div style="display:flex;justify-content:space-between;align-items:center;gap:4px;flex-wrap:wrap;">
                        <strong style="font-size:13.5px;color:var(--text-primary);">${s.icon} ${esc(s.dayPart)}</strong>
                        <span class="badge" style="${badgeBg}">
                          ${dState.stage === 'consumed' ? '✓ Đã uống' : present ? 'Có túm thuốc' : 'Đã lấy khỏi khay'}
                        </span>
                      </div>
                      <div style="font-size:12.5px;color:var(--accent-navy);font-weight:700;margin-top:3px;">${esc(dose.timing || s.timing)}</div>
                      ${dState.stage === 'taken_out' ? `<div style="font-size:12px;color:var(--accent-amber);font-weight:700;margin-top:3px;">⏳ Đã lấy lúc ${esc(dState.takenOutTime)} — Chờ xác nhận đã uống</div>` : ''}
                      ${dState.stage === 'consumed' ? `<div style="font-size:12px;color:var(--emerald-brand);font-weight:700;margin-top:3px;">✓ Đã uống lúc ${esc(dState.consumedTime)} (${esc(dState.confirmedBy)})</div>` : ''}
                    </div>
                    <div style="display:flex;flex-direction:column;gap:5px;">
                      ${present ? `
                        <button type="button" class="pill-btn btn-obs-disappear" data-sess="${s.key}" style="width:100%;justify-content:center;font-size:12.5px;background:var(--surface-cyan);color:var(--accent-cyan);border-color:var(--border-cyan);">
                          ${svgIcon('activity', 13)} Bước 1: Lấy Thuốc Khỏi Khay
                        </button>
                      ` : `
                        <button type="button" class="pill-btn btn-obs-refill" data-sess="${s.key}" style="width:100%;justify-content:center;font-size:12.5px;" ${!perms.canEditMedication ? 'disabled' : ''}>

                      ${dState.stage !== 'consumed' ? `
                        <button type="button" class="pill-btn btn-take-dose" data-sess="${s.key}" style="width:100%;justify-content:center;font-size:12.5px;background:var(--surface-emerald);color:var(--emerald-brand);border-color:var(--border-emerald);" ${!perms.canConfirmOwnDose ? 'disabled' : ''}>
                          ${svgIcon('check', 13)} Bước 2: Xác Nhận Đã Uống

                      ` : ''}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
