    /* ========================================================================
       12. XUẤT BÁO CÁO SỨC KHỎE PDF (A4 NHIỀU TRANG, HỖ TRỢ TIẾNG VIỆT UNICODE)
       ======================================================================== */
    function buildPdfFromJpegPages(jpegDataUrls, widthPx, heightPx) {
      const enc = new TextEncoder();
      const parts = [];
      let totalLen = 0;

      const pushBytes = (u8) => {
        parts.push(u8);
        totalLen += u8.length;
      };
      const pushStr = (str) => pushBytes(enc.encode(str));

      const decodeDataUrl = (dataUrl) => {
        const b64 = dataUrl.split(',')[1] || '';
        const bin = atob(b64);
        const u8 = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
        return u8;
      };

      // PDF Header + binary marker
      pushStr('%PDF-1.4\n');
      pushBytes(new Uint8Array([0x25, 0xE2, 0xE3, 0xCF, 0xD3, 0x0A]));

      const offsets = [0]; // obj 0 free
      const pageCount = jpegDataUrls.length;
      const kidsRefs = [];
      for (let i = 0; i < pageCount; i++) {
        kidsRefs.push(`${3 + i * 3} 0 R`);
      }

      // Obj 1: Catalog
      offsets.push(totalLen);
      pushStr('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');

      // Obj 2: Pages
      offsets.push(totalLen);
      pushStr(`2 0 obj\n<< /Type /Pages /Kids [${kidsRefs.join(' ')}] /Count ${pageCount} >>\nendobj\n`);

      // Each page = 3 objects: Page, Content stream, Image XObject
      const pageW = 595.28;
      const pageH = 841.89;
      for (let i = 0; i < pageCount; i++) {
        const pageObjId = 3 + i * 3;
        const contentObjId = 4 + i * 3;
        const imgObjId = 5 + i * 3;
        const imgName = `/Im${i}`;
        const jpegBytes = decodeDataUrl(jpegDataUrls[i]);
        const streamCmd = `q\n${pageW.toFixed(2)} 0 0 ${pageH.toFixed(2)} 0 0 cm\n${imgName} Do\nQ\n`;

        offsets.push(totalLen);
        pushStr(
          `${pageObjId} 0 obj\n` +
          `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW} ${pageH}] ` +
          `/Resources << /XObject << ${imgName} ${imgObjId} 0 R >> >> /Contents ${contentObjId} 0 R >>\n` +
          `endobj\n`
        );

        offsets.push(totalLen);
        pushStr(
          `${contentObjId} 0 obj\n<< /Length ${streamCmd.length} >>\nstream\n${streamCmd}endstream\nendobj\n`
        );

        offsets.push(totalLen);
        pushStr(
          `${imgObjId} 0 obj\n` +
          `<< /Type /XObject /Subtype /Image /Width ${widthPx} /Height ${heightPx} ` +
          `/ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>\n` +
          `stream\n`
        );
        pushBytes(jpegBytes);
        pushStr('\nendstream\nendobj\n');
      }

      const xrefOffset = totalLen;
      const objCount = offsets.length;
      pushStr(`xref\n0 ${objCount}\n`);
      pushStr('0000000000 65535 f \n');
      for (let i = 1; i < objCount; i++) {
        pushStr(String(offsets[i]).padStart(10, '0') + ' 00000 n \n');
      }
      pushStr(`trailer\n<< /Size ${objCount} /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF\n`);

      const out = new Uint8Array(totalLen);
      let pos = 0;
      for (const p of parts) {
        out.set(p, pos);
        pos += p.length;
      }
      return out;
    }

    function exportHealthReportPDF(member) {
      const W = 1240;
      const H = 1754;
      const MX = 68;
      const CW = W - MX * 2;
      const MAX_Y = H - 90;

      const pages = [];
      let canvas = null;
      let ctx = null;
      let y = 70;
      let filteredEmptyCount = 0;

      const isMeaningfulValue = (val) => {
        if (val === null || val === undefined) return false;
        const s = String(val).trim();
        if (!s) return false;
        const lower = s.toLowerCase();
        const emptyPatterns = [
          '—', '-', '--', 'n/a', 'none', 'null', 'undefined',
          'chưa cập nhật', 'chưa ghi nhận', 'chưa có', 'chưa đo',
          'không có', 'chưa từng', 'chưa xác định'
        ];
        if (emptyPatterns.includes(lower)) return false;
        if (/^(chưa cập nhật|chưa ghi nhận|chưa đo|không có dữ liệu|không có ghi chú)/i.test(lower)) return false;
        return true;
      };

      const joinNonEmpty = (pairs) => {
        const valid = [];
        for (const [label, raw] of pairs) {
          if (isMeaningfulValue(raw)) {
            valid.push(label ? `${label}: ${String(raw).trim()}` : String(raw).trim());
          } else {
            filteredEmptyCount += 1;
          }
        }
        return valid.join('  |  ');
      };

      const newPage = (isFirst = false, headerTitle = 'SMART HEALTHCARE — BÁO CÁO TÓM TẮT SỨC KHỎE (TIẾP THEO)') => {
        canvas = document.createElement('canvas');
        canvas.width = W;
        canvas.height = H;
        ctx = canvas.getContext('2d');
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, W, H);
        pages.push(canvas);
        y = 66;
        if (!isFirst) {
          ctx.fillStyle = '#64748B';
          ctx.font = 'bold 20px "Times New Roman", Times, serif';
          ctx.fillText(headerTitle, MX, y);
          y += 14;
          ctx.strokeStyle = '#CBD5E1';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(MX, y);
          ctx.lineTo(W - MX, y);
          ctx.stroke();
          y += 34;
        }
      };

      const ensureSpace = (needed) => {
        if (y + needed > MAX_Y) newPage(false);
      };

      const wrapText = (text, maxWidth, font) => {
        ctx.font = font;
        const raw = String(text || '');
        const paragraphs = raw.split(/\r?\n/);
        const lines = [];
        for (const para of paragraphs) {
          const words = para.split(/\s+/).filter(Boolean);
          if (words.length === 0) {
            lines.push('');
            continue;
          }
          let cur = words[0];
          for (let i = 1; i < words.length; i++) {
            const candidate = cur + ' ' + words[i];
            if (ctx.measureText(candidate).width <= maxWidth) {
              cur = candidate;
            } else {
              lines.push(cur);
              cur = words[i];
            }
          }
          lines.push(cur);
        }
        return lines;
      };

      const drawSectionTitle = (title, accent = '#1D4ED8') => {
        ensureSpace(75);
        y += 10;
        ctx.fillStyle = accent;
        ctx.fillRect(MX, y - 22, 8, 30);
        ctx.font = 'bold 25px "Times New Roman", Times, serif';
        ctx.fillStyle = '#0F172A';
        ctx.fillText(title, MX + 20, y);
        y += 12;
        ctx.strokeStyle = '#E2E8F0';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(MX, y);
        ctx.lineTo(W - MX, y);
        ctx.stroke();
        y += 28;
      };

      const drawKeyValueBox = (rows, bgColor = '#F8FAFC', borderColor = '#CBD5E1', skipFilter = false) => {
        const keptRows = [];
        for (const r of rows) {
          if (skipFilter || isMeaningfulValue(r.value)) {
            keptRows.push(r);
          } else {
            filteredEmptyCount += 1;
          }
        }
        if (keptRows.length === 0) return false;

        const fontLabel = 'bold 21px "Times New Roman", Times, serif';
        const fontVal = '21px "Times New Roman", Times, serif';
        const padX = 20;
        const lineH = 30;
        const prepared = keptRows.map(r => {
          const lines = wrapText(`${r.label}: ${String(r.value).trim()}`, CW - padX * 2, fontVal);
          return { label: r.label, value: String(r.value).trim(), lines, highlight: r.highlight };
        });

        let boxH = 22 + prepared.reduce((sum, r) => sum + r.lines.length * lineH + 6, 0);
        if (y + boxH > MAX_Y) newPage(false);

        const startY = y;
        ctx.fillStyle = bgColor;
        ctx.strokeStyle = borderColor;
        ctx.lineWidth = 2;
        ctx.fillRect(MX, startY, CW, boxH);
        ctx.strokeRect(MX, startY, CW, boxH);

        let cy = startY + 34;
        for (const row of prepared) {
          for (let i = 0; i < row.lines.length; i++) {
            const line = row.lines[i];
            if (i === 0) {
              const prefix = row.label + ': ';
              ctx.font = fontLabel;
              ctx.fillStyle = row.highlight || '#334155';
              ctx.fillText(prefix, MX + padX, cy);
              const lw = ctx.measureText(prefix).width;
              ctx.font = fontVal;
              ctx.fillStyle = row.highlight || '#0F172A';
              ctx.fillText(line.slice(prefix.length), MX + padX + lw, cy);
            } else {
              ctx.font = fontVal;
              ctx.fillStyle = row.highlight || '#0F172A';
              ctx.fillText(line, MX + padX, cy);
            }
            cy += lineH;
          }
          cy += 6;
        }
        y = startY + boxH + 18;
        return true;
      };

      const drawTable = (headers, colWidths, bodyRows, emptyFallbackText = '') => {
        if (bodyRows.length === 0 && !emptyFallbackText) return false;

        const headerFont = 'bold 19px "Times New Roman", Times, serif';
        const cellFont = '19px "Times New Roman", Times, serif';
        const lineH = 26;

        const drawHeader = () => {
          ensureSpace(64);
          ctx.fillStyle = '#EFF6FF';
          ctx.strokeStyle = '#BFDBFE';
          ctx.lineWidth = 2;
          ctx.fillRect(MX, y, CW, 44);
          ctx.strokeRect(MX, y, CW, 44);
          ctx.font = headerFont;
          ctx.fillStyle = '#1E3A8A';
          let cx = MX + 12;
          for (let i = 0; i < headers.length; i++) {
            ctx.fillText(headers[i], cx, y + 29);
            cx += colWidths[i];
          }
          y += 44;
        };

        drawHeader();

        if (bodyRows.length === 0) {
          ensureSpace(46);
          ctx.fillStyle = '#FFFFFF';
          ctx.strokeStyle = '#E2E8F0';
          ctx.fillRect(MX, y, CW, 44);
          ctx.strokeRect(MX, y, CW, 44);
          ctx.font = cellFont;
          ctx.fillStyle = '#64748B';
          ctx.fillText(emptyFallbackText, MX + 14, y + 29);
          y += 58;
          return true;
        }

        for (let rIdx = 0; rIdx < bodyRows.length; rIdx++) {
          const row = bodyRows[rIdx];
          const wrappedCells = row.map((cell, ci) => wrapText(cell, colWidths[ci] - 20, cellFont));
          const maxLines = Math.max(1, ...wrappedCells.map(c => c.length));
          const rowH = maxLines * lineH + 16;

          if (y + rowH > MAX_Y) {
            newPage(false);
            drawHeader();
          }

          ctx.fillStyle = rIdx % 2 === 0 ? '#FFFFFF' : '#F8FAFC';
          ctx.strokeStyle = '#E2E8F0';
          ctx.lineWidth = 1.5;
          ctx.fillRect(MX, y, CW, rowH);
          ctx.strokeRect(MX, y, CW, rowH);

          ctx.font = cellFont;
          ctx.fillStyle = '#0F172A';
          let cx = MX + 12;
          for (let ci = 0; ci < wrappedCells.length; ci++) {
            const lines = wrappedCells[ci];
            for (let li = 0; li < lines.length; li++) {
              ctx.fillText(lines[li], cx, y + 27 + li * lineH);
            }
            cx += colWidths[ci];
          }
          y += rowH;
        }
        y += 18;
        return true;
      };

      // ---- BẮT ĐẦU VẼ TRANG 1 ----
      newPage(true);

      // Header Banner
      ctx.fillStyle = '#1D4ED8';
      ctx.fillRect(MX, y, CW, 118);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 31px "Times New Roman", Times, serif';
      ctx.fillText('BÁO CÁO TÓM TẮT SỨC KHỎE KHÁM BỆNH', MX + 26, y + 48);
      ctx.font = '21px "Times New Roman", Times, serif';
      const nowStr = new Date().toLocaleString('vi-VN');
      const reporter = state.currentUser ? `${state.currentUser.fullName} (${state.currentUser.role})` : 'Người dùng hệ thống';
      ctx.fillText(`Hệ thống Smart Healthcare • Ngày xuất: ${nowStr}`, MX + 26, y + 80);
      ctx.fillText(`Người xuất báo cáo: ${reporter} • Mã phòng GĐ: ${state.familyRoomCode}`, MX + 26, y + 106);
      y += 142;

      const unlocked = state.sensitiveUnlocked === true;
      const maskSafe = (val) => isMeaningfulValue(val) ? (unlocked ? String(val).trim() : maskText(val, 3)) : '';

      if (!unlocked) {
        drawKeyValueBox([
          {
            label: 'Lưu ý bảo mật',
            value: 'Các trường định danh nhạy cảm (CCCD, BHYT, SĐT, Địa chỉ, tên thuốc cá nhân) đang được che mờ theo chế độ bảo mật. Vui lòng xác thực tài khoản trước khi xuất nếu cần bản đầy đủ.',
            highlight: '#B45309'
          }
        ], '#FFFBEB', '#F59E0B', true);
      }

      // 1. THÔNG TIN HÀNH CHÍNH & BẢO HIỂM (Tự động lọc bỏ trường trống)
      drawSectionTitle('1. THÔNG TIN HÀNH CHÍNH & BẢO HIỂM NGƯỜI BỆNH', '#1D4ED8');
      if (member) {
        const rec = member.record || {};
        const demoParts = joinNonEmpty([
          ['', member.name],
          ['Tuổi', member.age],
          ['Giới tính', member.gender],
          ['Nhóm máu', member.bloodType]
        ]);
        const idParts = joinNonEmpty([
          ['CCCD', maskSafe(rec.personalId)],
          ['Mã BHYT', maskSafe(rec.insuranceNumber)],
          ['Mã bệnh án', rec.medicalRecordCode]
        ]);
        const bhytExtraParts = joinNonEmpty([
          ['Nơi ĐK KCB BHYT', rec.bhytHospital],
          ['Hạn thẻ BHYT', rec.bhytExpiry]
        ]);
        const contactParts = joinNonEmpty([
          ['Địa chỉ', maskSafe(rec.permanentAddress || (state.emergencyLocation && state.emergencyLocation.address))],
          ['SĐT', maskSafe(rec.phoneNumber)],
          ['Sinh hoạt cùng', rec.livingArrangement]
        ]);
        const doctorParts = joinNonEmpty([
          ['Bác sĩ theo dõi', rec.primaryDoctor],
          ['SĐT phòng khám/BS', maskSafe(rec.doctorPhone)]
        ]);
        const drewAdmin = drawKeyValueBox([
          { label: 'Họ và tên & Nhân khẩu học', value: demoParts },
          { label: 'Ngày sinh', value: rec.dob },
          { label: 'Mã định danh / BHYT / Hồ sơ', value: idParts },
          { label: 'Chi tiết BHYT', value: bhytExtraParts },
          { label: 'Địa chỉ, Điện thoại & Cư trú', value: contactParts },
          { label: 'Bác sĩ điều trị chính', value: doctorParts },
          { label: 'Liên hệ khẩn cấp (SOS)', value: maskSafe(rec.relativeInfo || member.emergencyContact) }
        ]);
        if (!drewAdmin) {
          drawKeyValueBox([{ label: 'Thông tin hành chính', value: 'Chưa có thông tin hành chính chi tiết được cập nhật.' }], '#F8FAFC', '#CBD5E1', true);
        }
      } else {
        const fallbackLoc = getEmergencyAddressPayload();
        drawKeyValueBox([
          { label: 'Người sử dụng', value: state.currentUser ? `${state.currentUser.fullName} (${state.currentUser.role})` : '' },
          { label: 'Địa chỉ khẩn cấp đã thiết lập', value: maskSafe(fallbackLoc.savedAddress) }
        ]);
      }

      // 2. THÔNG SỐ SINH HIỆU, SINH HÓA & CHỈ SỐ CƠ THỂ
      drawSectionTitle('2. THÔNG SỐ SINH HIỆU, SINH HÓA & CHỈ SỐ CƠ THỂ', '#047857');
      if (member) {
        const rec = member.record || {};
        const labs = rec.labs || {};
        const hasHeight = Number(member.height) > 0;
        const hasWeight = Number(member.weight) > 0;
        const bmiText = (hasHeight && hasWeight)
          ? (() => {
              const hM = member.height / 100;
              const bmiNum = member.weight / (hM * hM);
              const bmiCat = bmiNum < 18.5 ? 'Thiếu cân' : bmiNum < 23 ? 'Bình thường (Châu Á)' : bmiNum < 25 ? 'Thừa cân' : 'Béo phì';
              return `${member.height} cm  |  ${member.weight} kg  |  BMI: ${bmiNum.toFixed(1)} (${bmiCat})`;
            })()
          : joinNonEmpty([['Chiều cao', hasHeight ? `${member.height} cm` : ''], ['Cân nặng', hasWeight ? `${member.weight} kg` : '']]);
        const exam = rec.clinicalExam || {};
        const clinicVitals = joinNonEmpty([
          ['Huyết áp', exam.bp],
          ['Nhịp tim phòng khám', exam.clinicHeartRate],
          ['SpO2 phòng khám', exam.clinicSpo2]
        ]);
        const biochemParts = joinNonEmpty([
          ['Đường huyết đói', labs.bloodSugar],
          ['HbA1c', labs.hba1c],
          ['Mỡ máu (Lipid)', labs.lipidPanel],
          ['Chức năng thận', labs.kidneyFunction]
        ]);
        drawKeyValueBox([
          { label: 'Chỉ số thể trạng (BMI)', value: bmiText },
          { label: 'Sinh hiệu tại cơ sở y tế', value: clinicVitals, highlight: '#047857' },
          { label: 'Chỉ số sinh hóa gần nhất', value: biochemParts },
          { label: 'Môi trường phòng theo dõi', value: `Chất lượng không khí ${state.aqi} AQI (PM2.5: ${state.pm25.toFixed(1)} µg/m³) • Nhiệt độ ${state.roomTemp.toFixed(1)}°C • Độ ẩm ${state.roomHumid}%` }
        ], '#ECFDF5', '#6EE7B7');
      } else {
        drawKeyValueBox([
          { label: 'Môi trường phòng theo dõi', value: `Chất lượng không khí ${state.aqi} AQI (PM2.5: ${state.pm25.toFixed(1)} µg/m³) • Nhiệt độ ${state.roomTemp.toFixed(1)}°C • Độ ẩm ${state.roomHumid}%` }
        ], '#ECFDF5', '#6EE7B7');
      }

      // Bảng nhật ký sinh hiệu bất thường (chỉ in khi có dữ liệu)
      if (state.abnormalLogs.length > 0) {
        ensureSpace(90);
        ctx.font = 'bold 21px "Times New Roman", Times, serif';
        ctx.fillStyle = '#74222C';
        ctx.fillText('Nhật ký ghi nhận dấu hiệu bất thường gần đây:', MX, y);
        y += 14;
        drawTable(
          ['Thời điểm', 'Người bệnh', 'Tình trạng bất thường', 'Giá trị ghi nhận'],
          [170, 260, 320, CW - 750],
          state.abnormalLogs.slice(0, 10).map(l => [l.timestamp, l.memberName, l.type, l.value])
        );
      }

      // 3. PHÁC ĐỒ & LỊCH SỬ DÙNG THUỐC (Lọc bỏ cữ tạm tắt hoặc trống)
      drawSectionTitle('3. PHÁC ĐỒ HIỆN TẠI & LỊCH SỬ DÙNG THUỐC', '#6D28D9');
      const activeTray = normalizeTraySchedule(
        (member && state.trays.find(t => t.assignedMemberName === member.name)) ||
        state.trays.find(t => t.id === state.medActiveTrayId) ||
        state.trays[0]
      );
      if (activeTray) {
        const medRows = MEDICATION_TIMING_SLOTS
          .map(s => {
            const dose = activeTray.schedule[s.key] || { time: s.defaultTime, enabled: true, medicines: s.defaultMeds, note: s.note, timing: s.timing };
            if (!dose.enabled) {
              filteredEmptyCount += 1;
              return null;
            }
            const medText = unlocked ? (isMeaningfulValue(dose.medicines) ? dose.medicines : 'Theo toa bác sĩ') : '•••••••• (Đã ẩn bảo mật)';
            return [`${s.dayPart} (${dose.timing || s.timing})`, dose.time || s.defaultTime, medText, dose.note || s.note];
          })
          .filter(Boolean);
        drawTable(
          ['Khung giờ', 'Giờ hẹn', 'Thuốc & Liều dùng', 'Lưu ý cách uống'],
          [230, 110, 420, CW - 760],
          medRows
        );
      }

      const validTakeLogs = state.takeLogs.filter(l => isMeaningfulValue(l.dateKey) && (isMeaningfulValue(l.session) || isMeaningfulValue(l.slotLabel)));
      if (validTakeLogs.length > 0) {
        ensureSpace(90);
        ctx.font = 'bold 21px "Times New Roman", Times, serif';
        ctx.fillStyle = '#0F172A';
        ctx.fillText(`Lịch sử xác nhận đã uống thuốc gần nhất (${Math.min(validTakeLogs.length, 15)} bản ghi):`, MX, y);
        y += 14;
        drawTable(
          ['Ngày', 'Cữ uống', 'Giờ uống', 'Thuốc ghi nhận'],
          [180, 220, 150, CW - 550],
          validTakeLogs.slice(0, 15).map(l => [
            l.dateKey,
            l.slotLabel || l.session,
            l.time || l.takenAt || '—',
            unlocked ? (l.medicines || 'Theo phác đồ') : '•••••••• (Đã ẩn bảo mật)'
          ])
        );
      } else {
        filteredEmptyCount += 1;
      }

      // 4. GHI CHÚ Y TẾ & ĐÁNH GIÁ LÃO KHOA QUAN TRỌNG KHI ĐI KHÁM BỆNH (Tự động lọc bỏ trường trống)
      if (member) {
        const rec = member.record || {};
        const exam = rec.clinicalExam || {};
        const para = rec.paraclinical || {};
        const treat = rec.treatmentProcess || {};
        const geri = rec.geriatric || {};
        const persParts = joinNonEmpty([
          ['Bệnh bản thân', rec.personalHistory || member.conditions],
          ['Phẫu thuật', rec.surgicalHistory],
          ['Nhập viện gần đây', geri.hospitalizationHistory]
        ]);
        const famParts = joinNonEmpty([
          ['Tiền sử gia đình', rec.familyHistory],
          ['Yếu tố lối sống', rec.lifestyleRisks]
        ]);
        const geriParts = joinNonEmpty([
          ['Vận động & Té ngã', geri.mobilityStatus],
          ['Thị lực / Thính lực', geri.visionHearing],
          ['Giấc ngủ / Trí nhớ', geri.cognitionSleep],
          ['Chế độ ăn kiêng', geri.dietaryNotes]
        ]);
        const examParts = joinNonEmpty([
          ['Nội', exam.generalInternal],
          ['Ngoại', exam.surgery],
          ['Mắt', exam.eye],
          ['TMH', exam.ent]
        ]);
        const paraParts = joinNonEmpty([
          ['XN máu', para.bloodTest],
          ['ECG', para.ecg],
          ['X-Quang/Siêu âm', para.xray]
        ]);
        const followUpParts = joinNonEmpty([
          ['Cơ sở điều trị chính', treat.careFacility],
          ['Khám gần nhất', treat.lastVisitDate],
          ['Hẹn tái khám', treat.nextAppointmentDate]
        ]);

        const noteRows1 = [
          { label: 'CẢNH BÁO DỊ ỨNG THUỐC', value: rec.drugAllergies || member.allergies, highlight: '#74222C' },
          { label: 'Dị ứng thực phẩm / Thời tiết', value: rec.weatherFoodAllergies },
          { label: 'Tiền sử bệnh, Phẫu thuật & Nhập viện', value: persParts },
          { label: 'Tiền sử gia đình & Lối sống', value: famParts },
          { label: 'Đánh giá Lão khoa (Vận động, Ngủ, Ăn)', value: geriParts },
          { label: 'Thiết bị y tế hỗ trợ đang dùng', value: rec.medicalDevices }
        ];
        const noteRows2 = [
          { label: 'Khám lâm sàng chuyên khoa', value: examParts },
          { label: 'Kết quả cận lâm sàng', value: paraParts },
          { label: 'Kế hoạch & Lịch tái khám', value: followUpParts },
          { label: 'Đơn thuốc / Hướng điều trị', value: treat.prescription },
          { label: 'Ghi chú / Câu hỏi cho Bác sĩ', value: treat.importantNotes, highlight: '#1D4ED8' }
        ];
        const vacValid = (rec.vaccinationHistory || []).filter(v => isMeaningfulValue(v.vaccineName));

        const hasAnyNotes = noteRows1.some(r => isMeaningfulValue(r.value)) || noteRows2.some(r => isMeaningfulValue(r.value)) || vacValid.length > 0;
        if (hasAnyNotes) {
          drawSectionTitle('4. ĐÁNH GIÁ LÃO KHOA & GHI CHÚ Y TẾ QUAN TRỌNG KHI ĐI KHÁM', '#8C2D38');
          drawKeyValueBox(noteRows1, '#FBF3F2', '#DFBFC2');
          drawKeyValueBox(noteRows2);
          if (vacValid.length > 0) {
            ensureSpace(90);
            ctx.font = 'bold 21px "Times New Roman", Times, serif';
            ctx.fillStyle = '#047857';
            ctx.fillText('Lịch sử tiêm chủng đã ghi nhận:', MX, y);
            y += 14;
            drawTable(
              ['Tên vắc xin', 'Ngày tiêm', 'Mũi / Liều', 'Cơ sở tiêm chủng'],
              [320, 190, 190, CW - 700],
              vacValid.map(v => [
                v.vaccineName,
                isMeaningfulValue(v.date) ? v.date : 'Đã tiêm',
                isMeaningfulValue(v.dose) ? v.dose : 'Theo lịch',
                isMeaningfulValue(v.facility) ? v.facility : 'Cơ sở y tế'
              ])
            );
          }
        }
      }

      // 5. NHẬT KÝ SỨC KHỎE HẰNG NGÀY (TÂM TRẠNG · NĂNG LƯỢNG · MỨC ĐỘ ĐAU)
      if (Array.isArray(state.dailyLogs) && state.dailyLogs.length > 0) {
        const dSum = summarizeDailyLogs(state.dailyLogs);
        const highPainCount = state.dailyLogs.filter(x => Number(x.pain) >= 7).length;
        drawSectionTitle('5. TÓM TẮT NHẬT KÝ SỨC KHỎE HẰNG NGÀY (TÂM TRẠNG · NĂNG LƯỢNG · ĐAU)', '#1E3A5F');
        drawKeyValueBox([
          { label: 'Tổng số ngày & Lượt ghi nhận', value: `${dSum.count} lượt ghi nhận sức khỏe hằng ngày` },
          { label: 'Điểm trung bình theo dõi', value: `Tâm trạng ${dSum.avgMood}/5  |  Năng lượng ${dSum.avgEnergy}/5  |  Mức độ đau ${dSum.avgPain}/10`, highlight: '#1E3A5F' },
          { label: 'Cảnh báo triệu chứng đáng lưu ý', value: highPainCount > 0 ? `${highPainCount} lượt ghi nhận mức đau từ 7/10 trở lên cần báo bác sĩ.` : 'Không ghi nhận cơn đau nặng (>= 7/10).', highlight: highPainCount > 0 ? '#74222C' : '#0F6B52' }
        ], '#F0F5FA', '#BAC7D8');

        const recentDailyRows = [...state.dailyLogs]
          .sort((a, b) => (b.dateKey || '').localeCompare(a.dateKey || ''))
          .slice(0, 10)
          .map(d => [
            `${d.dateKey}${d.timeOfDay ? ' (' + d.timeOfDay + ')' : ''}`,
            `${d.mood}/5`,
            `${d.energy}/5`,
            `${d.pain}/10`,
            [Array.isArray(d.symptoms) && d.symptoms.length > 0 ? d.symptoms.join(', ') : '', d.note || ''].filter(Boolean).join(' — ') || 'Ổn định'
          ]);
        drawTable(
          ['Ngày & Buổi', 'Tâm trạng', 'Năng lượng', 'Mức đau', 'Triệu chứng & Ghi chú'],
          [210, 115, 130, 115, CW - 570],
          recentDailyRows
        );
      } else {
        filteredEmptyCount += 1;
      }

      if (filteredEmptyCount > 0) {
        drawKeyValueBox([
          {
            label: 'Tối ưu dữ liệu báo cáo',
            value: `Hệ thống đã tự động lọc bỏ ${filteredEmptyCount} mục dữ liệu trống hoặc chưa cập nhật để bác sĩ tập trung vào thông số lâm sàng thực tế.`,
            highlight: '#1E3A5F'
          }
        ], '#F0F5FA', '#BAC7D8', true);
      }

      // ---- TRANG PHỤ LỤC RIÊNG: THÔNG TIN LIÊN HỆ GIA ĐÌNH (CHO BÁC SĨ & CẤP CỨU SOS) ----
      newPage(false, 'SMART HEALTHCARE — PHỤ LỤC: THÔNG TIN LIÊN HỆ GIA ĐÌNH & CẤP CỨU SOS');
      drawSectionTitle('PHỤ LỤC: THÔNG TIN LIÊN HỆ GIA ĐÌNH (BÁC SĨ & CẤP CỨU SOS)', '#8C2D38');

      const sosLoc = getEmergencyAddressPayload();
      const sortedFamily = removeStaleTestContact([...state.familyContacts])
        .filter(fc => isMeaningfulValue(fc.name) || isMeaningfulValue(fc.phone))
        .sort((a, b) => (a.priority || 1) - (b.priority || 1));

      const drewSosLocBox = drawKeyValueBox([
        { label: 'Mã Phòng Gia Đình Kết Nối SOS', value: state.familyRoomCode, highlight: '#1E3A5F' },
        { label: 'Địa chỉ khẩn cấp / Nơi cư trú', value: isMeaningfulValue(sosLoc.savedAddress) ? (unlocked ? sosLoc.savedAddress : maskText(sosLoc.savedAddress, 6)) : '' },
        { label: 'Tọa độ & Link bản đồ GPS', value: isMeaningfulValue(sosLoc.gpsUrl) ? `${sosLoc.coords ? sosLoc.coords + ' — ' : ''}${sosLoc.gpsUrl}` : '', highlight: '#0F6B52' },
        {

      }

      ensureSpace(90);
      ctx.font = 'bold 21px "Times New Roman", Times, serif';
      ctx.fillStyle = '#0F172A';
      ctx.fillText(`Danh bạ người thân liên kết ưu tiên để bác sĩ / cấp cứu liên lạc (${sortedFamily.length} người):`, MX, y);
      y += 14;

      if (sortedFamily.length > 0) {
        drawTable(
          ['Ưu tiên', 'Họ tên & Quan hệ', 'Số điện thoại', 'Kênh / Tự động SMS', 'Ghi chú trực'],

          sortedFamily.map(fc => {

              `Ưu tiên #${fc.priority || 1}`,
              `${fc.name}${isMeaningfulValue(fc.relation) ? ' (' + fc.relation + ')' : ''}`,
              shownPhone,

          })

      } else {

          {
            label: 'Danh bạ liên hệ gia đình',
            value: 'Chưa thiết lập SĐT người thân ưu tiên. Vui lòng thiết lập trong phần "Thiết Lập SOS" hoặc Tab "Hệ thống sức khỏe".',
            highlight: '#74222C'
          }
        ], '#FFFBEB', '#F59E0B', true);
      }

      if (state.smsDispatchLogs.length > 0) {
        ensureSpace(90);
        ctx.font = 'bold 21px "Times New Roman", Times, serif';

          ['Thời điểm', 'Người nhận', 'SĐT', 'Trạng thái'],
          [200, 280, 190, CW - 670],

            l.time,
            `#${l.priority || 1} ${l.name}`,

            l.status
          ])
        );
      }

      // Chân trang đánh số trang trên tất cả các trang A4
      const totalPages = pages.length;
      for (let idx = 0; idx < totalPages; idx++) {
        const pCtx = pages[idx].getContext('2d');
        pCtx.strokeStyle = '#E2E8F0';
        pCtx.lineWidth = 1.5;
        pCtx.beginPath();
        pCtx.moveTo(MX, H - 62);
        pCtx.lineTo(W - MX, H - 62);
        pCtx.stroke();
        pCtx.font = '18px "Times New Roman", Times, serif';
        pCtx.fillStyle = '#64748B';
        pCtx.fillText('Tài liệu tóm tắt từ Smart Healthcare — Mang theo khi tái khám để bác sĩ tham chiếu nhanh.', MX, H - 36);
        const pageStr = `Trang ${idx + 1} / ${totalPages}`;
        const pw = pCtx.measureText(pageStr).width;
        pCtx.fillText(pageStr, W - MX - pw, H - 36);
      }

      const jpegUrls = pages.map(c => c.toDataURL('image/jpeg', 0.92));
      const pdfBytes = buildPdfFromJpegPages(jpegUrls, W, H);
      const blob = new Blob([pdfBytes], { type: 'application/pdf' });
      const url = URL.createObjectURL(blob);
      const safeName = (member ? member.name : 'NguoiBenh').replace(/[^\p{L}\p{N}_-]+/gu, '_');
      const fileName = `BaoCaoSucKhoe_${safeName}_${todayKey()}.pdf`;
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      return { fileName, pageCount: totalPages };
    }

                <select id="p-mobility" class="glass-input field-input">
                  <option value="" ${!geri.mobilityStatus ? 'selected' : ''}>-- Đánh giá khả năng đi lại --</option>
                  <option value="Tự đi lại bình thường, vững vàng" ${geri.mobilityStatus === 'Tự đi lại bình thường, vững vàng' ? 'selected' : ''}>Tự đi lại bình thường, vững vàng</option>
                  <option value="Đi lại chậm, cần gậy / khung tập đi" ${geri.mobilityStatus === 'Đi lại chậm, cần gậy / khung tập đi' ? 'selected' : ''}>Đi lại chậm, cần gậy / khung tập đi</option>
                  <option value="Nguy cơ té ngã cao (hay chóng mặt / yếu chân)" ${geri.mobilityStatus === 'Nguy cơ té ngã cao (hay chóng mặt / yếu chân)' ? 'selected' : ''}>Nguy cơ té ngã cao (hay chóng mặt / yếu chân)</option>
                  <option value="Cần xe lăn hoặc người dìu hỗ trợ" ${geri.mobilityStatus === 'Cần xe lăn hoặc người dìu hỗ trợ' ? 'selected' : ''}>Cần xe lăn hoặc người dìu hỗ trợ</option>
                </select>
              </div>
              <div>
                <label class="field-label">Thị lực &amp; Thính lực (Đeo kính / Trợ thính)</label>
                <input id="p-sensory" type="text" class="glass-input field-input" value="${esc(geri.visionHearing || '')}" placeholder="VD: Đeo kính lão, nghe rõ bên phải / nặng tai trái..." />
              </div>
              <div>
                <label class="field-label">Giấc ngủ &amp; Trí nhớ (Nhận thức)</label>
                <input id="p-cognition" type="text" class="glass-input field-input" value="${esc(geri.cognitionSleep || '')}" placeholder="VD: Ngủ 6 tiếng/đêm, hay tỉnh giấc; trí nhớ minh mẫn..." />
              </div>
              <div style="grid-column: 1 / -1;">
                <label class="field-label">Chế độ dinh dưỡng, kiêng khem &amp; Thói quen ăn uống</label>
                <input id="p-diet" type="text" class="glass-input field-input" value="${esc(geri.dietaryNotes || '')}" placeholder="VD: Ăn nhạt giảm muối, hạn chế tinh bột đường, uống đủ 1.5 lít nước/ngày..." />
              </div>
            </div>
          </div>

          <!-- PHẦN 3: TIÊM CHỦNG PHÒNG BỆNH & THIẾT BỊ Y TẾ HỖ TRỢ -->
          <div class="glass-panel" style="border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;">
            <h3 style="font-size:17px;font-weight:800;color:var(--emerald-brand);display:flex;align-items:center;gap:8px;">
              ${svgIcon('syringe', 18)} 3. TIÊM CHỦNG PHÒNG BỆNH &amp; THIẾT BỊ Y TẾ HỖ TRỢ
            </h3>
            <div>
              <label class="field-label">Thiết bị y tế / Dụng cụ hỗ trợ đang sử dụng tại nhà</label>
              <input id="p-devices" type="text" class="glass-input field-input" value="${esc(rec.medicalDevices || '')}" placeholder="VD: Máy đo huyết áp bắp tay Omron, Máy đo đường huyết, Máy trợ thính, Gậy chống..." />
            </div>
            <div class="grid sm-grid-4 no-print" style="gap:8px;">
              <input id="vac-name" type="text" class="glass-input field-input" placeholder="Tên vắc xin (Cúm mùa, Phế cầu, Zona...)" ${!perms.canEditHealthProfile ? 'disabled' : ''} />
              <input id="vac-date" type="date" class="glass-input field-input" ${!perms.canEditHealthProfile ? 'disabled' : ''} />
              <input id="vac-dose" type="text" class="glass-input field-input" placeholder="Mũi số (Mũi 1, Nhắc lại)" ${!perms.canEditHealthProfile ? 'disabled' : ''} />
              <div style="display:flex;gap:6px;">
                <input id="vac-fac" type="text" class="glass-input field-input" placeholder="Cơ sở tiêm" ${!perms.canEditHealthProfile ? 'disabled' : ''} />
                <button id="btn-add-vac" type="button" class="pill-btn gemini-gradient-bg text-white" style="border:none;min-height:44px;" ${!perms.canEditHealthProfile ? 'disabled' : ''}>Thêm</button>
              </div>
            </div>
            <div class="table-wrap">
              <table class="data-table">
                <thead><tr><th>Vắc xin</th><th>Ngày tiêm</th><th>Mũi / Liều</th><th>Cơ sở tiêm</th><th class="no-print">Xóa</th></tr></thead>
                <tbody>
                  ${rec.vaccinationHistory.length === 0
                    ? `<tr><td colspan="5" style="text-align:center;color:var(--text-muted);">Chưa có lịch sử tiêm chủng được ghi nhận.</td></tr>`
                    : rec.vaccinationHistory.map(v => `
                      <tr>
                        <td style="font-weight:700;color:var(--text-primary);">${esc(v.vaccineName)}</td>
                        <td>${esc(v.date)}</td>
                        <td>${esc(v.dose)}</td>
                        <td>${esc(v.facility)}</td>
                        <td class="no-print"><button class="del-vac-btn" data-id="${v.id}" style="background:var(--rose-soft);color:var(--rose-deep);border:1px solid var(--rose-border);padding:6px 10px;border-radius:8px;min-height:38px;" ${!perms.canEditHealthProfile ? 'disabled' : ''}>${svgIcon('trash', 14)}</button></td>
                      </tr>
                    `).join('')}
                </tbody>
              </table>
            </div>
          </div>

          <!-- PHẦN 4: KHÁM LÂM SÀNG, SINH HÓA & KẾ HOẠCH TÁI KHÁM -->
          <div class="glass-panel" style="border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;">
            <h3 style="font-size:17px;font-weight:800;color:var(--accent-purple);">4. KHÁM LÂM SÀNG, CHỈ SỐ SINH HÓA &amp; KẾ HOẠCH TÁI KHÁM</h3>
            <div class="grid sm-grid-2 lg-grid-4" style="gap:10px;">
              <div><label class="field-label">Chiều cao (cm)</label><input id="p-height" type="number" class="glass-input field-input" value="${m.height}" /></div>
              <div><label class="field-label">Cân nặng (kg)</label><input id="p-weight" type="number" class="glass-input field-input" value="${m.weight}" /></div>
              <div><label class="field-label">Chỉ số BMI (Tự tính)</label><input type="text" readonly class="glass-input field-input font-mono" value="${bmi}" /></div>
              <div><label class="field-label">Huyết áp tại phòng khám</label><input id="p-bp" type="text" class="glass-input field-input" value="${esc(rec.clinicalExam.bp || '')}" placeholder="VD: 128/78 mmHg" /></div>
              <div><label class="field-label">Nhịp tim tại phòng khám</label><input id="p-clinic-hr" type="text" class="glass-input field-input" value="${esc(rec.clinicalExam.clinicHeartRate || '')}" placeholder="VD: 74 nhịp/phút" /></div>
              <div><label class="field-label">SpO2 tại phòng khám</label><input id="p-clinic-spo2" type="text" class="glass-input field-input" value="${esc(rec.clinicalExam.clinicSpo2 || '')}" placeholder="VD: 98% (khi đo ở viện)" /></div>
              <div><label class="field-label">Đường huyết đói</label><input id="p-glucose" type="text" class="glass-input field-input" value="${esc(labs.bloodSugar || '')}" placeholder="VD: 5.8 mmol/L" /></div>
              <div><label class="field-label">Chỉ số HbA1c (%)</label><input id="p-hba1c" type="text" class="glass-input field-input" value="${esc(labs.hba1c || '')}" placeholder="VD: 6.3%" /></div>
              <div><label class="field-label">Mỡ máu (Cholesterol/LDL/TG)</label><input id="p-lipids" type="text" class="glass-input field-input" value="${esc(labs.lipidPanel || '')}" placeholder="VD: LDL 2.4 mmol/L" /></div>
              <div><label class="field-label">Chức năng thận (Creatinin/eGFR)</label><input id="p-kidney" type="text" class="glass-input field-input" value="${esc(labs.kidneyFunction || '')}" placeholder="VD: eGFR 72 ml/phút" /></div>
              <div><label class="field-label">Nội tổng quát</label><input id="p-int" type="text" class="glass-input field-input" value="${esc(rec.clinicalExam.generalInternal || '')}" /></div>
              <div><label class="field-label">Ngoại khoa</label><input id="p-surg" type="text" class="glass-input field-input" value="${esc(rec.clinicalExam.surgery || '')}" /></div>
              <div><label class="field-label">Mắt / Thị lực</label><input id="p-eye" type="text" class="glass-input field-input" value="${esc(rec.clinicalExam.eye || '')}" /></div>
              <div><label class="field-label">Tai - Mũi - Họng</label><input id="p-ent" type="text" class="glass-input field-input" value="${esc(rec.clinicalExam.ent || '')}" /></div>
              <div><label class="field-label">Xét nghiệm máu tổng quát</label><input id="p-blood-test" type="text" class="glass-input field-input" value="${esc(rec.paraclinical.bloodTest || '')}" /></div>
              <div><label class="field-label">Điện tâm đồ (ECG)</label><input id="p-ecg" type="text" class="glass-input field-input" value="${esc(rec.paraclinical.ecg || '')}" /></div>
              <div><label class="field-label">Siêu âm / X-Quang</label><input id="p-xray" type="text" class="glass-input field-input" value="${esc(rec.paraclinical.xray || '')}" /></div>
              <div><label class="field-label">Cơ sở điều trị chính</label><input id="p-care-fac" type="text" class="glass-input field-input" value="${esc(rec.treatmentProcess.careFacility || '')}" placeholder="VD: BV Đại học Y Dược" /></div>
              <div><label class="field-label">Ngày khám gần nhất</label><input id="p-last-visit" type="date" class="glass-input field-input" value="${esc(rec.treatmentProcess.lastVisitDate || '')}" /></div>
              <div><label class="field-label">Lịch hẹn tái khám dự kiến</label><input id="p-next-visit" type="date" class="glass-input field-input" value="${esc(rec.treatmentProcess.nextAppointmentDate || '')}" /></div>
            </div>
            <div>
              <label class="field-label">Đơn thuốc / Hướng điều trị hiện hành</label>
              <input id="p-rx" type="text" class="glass-input field-input" value="${esc(rec.treatmentProcess.prescription || '')}" placeholder="Ghi tóm tắt phác đồ bác sĩ đã kê đơn..." />
            </div>
            <div>
              <label class="field-label">Ghi chú y tế quan trọng mang đi khám bệnh (Triệu chứng gần đây, câu hỏi cho bác sĩ, lưu ý tái khám)</label>
              <textarea id="p-important-notes" rows="3" class="glass-input field-input" placeholder="Ví dụ: Gần đây hay chóng mặt nhẹ buổi sáng khi đứng dậy, nhờ bác sĩ kiểm tra lại liều thuốc huyết áp...">${esc(rec.treatmentProcess.importantNotes || '')}</textarea>
            </div>
          </div>

          <!-- PHẦN 5: TÓM TẮT NHẬT KÝ SỨC KHỎE HẰNG NGÀY (ĐỒNG BỘ TỪ DASHBOARD) -->
          <div class="glass-panel" style="border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;">
            <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;">
              <div>
                <h3 style="font-size:17px;font-weight:800;color:var(--accent-navy);">5. TỔNG HỢP NHẬT KÝ SỨC KHỎE HẰNG NGÀY (TÂM TRẠNG · NĂNG LƯỢNG · MỨC ĐỘ ĐAU)</h3>
                <p style="font-size:14.5px;color:var(--text-muted);">Dữ liệu tự động đồng bộ từ Bảng theo dõi hằng ngày và đính kèm vào file PDF khi đi khám bệnh.</p>
              </div>
              <button id="btn-prof-goto-dlog" type="button" class="pill-btn no-print" style="background:var(--surface-blue);color:var(--accent-navy);border-color:var(--border-blue);min-height:44px;">
                Mở Nhật Ký &amp; Biểu Đồ Sức Khỏe →
              </button>
            </div>
            <div class="grid sm-grid-2 lg-grid-4" style="gap:10px;">
              <div class="glass-card" style="padding:12px;border-radius:14px;">
                <div style="font-size:13.5px;color:var(--text-muted);font-weight:700;">Số lượt đã ghi nhật ký</div>
                <div style="font-size:22px;font-weight:800;color:var(--text-primary);margin-top:4px;">${dSummary.count} <span style="font-size:14px;font-weight:600;color:var(--text-muted);">lượt</span></div>
              </div>
              <div class="glass-card" style="padding:12px;border-radius:14px;">
                <div style="font-size:13.5px;color:var(--text-muted);font-weight:700;">Tâm trạng trung bình</div>
                <div style="font-size:22px;font-weight:800;color:var(--emerald-brand);margin-top:4px;">${dSummary.count > 0 ? dSummary.avgMood + ' / 5' : 'Chưa có'}</div>
              </div>
              <div class="glass-card" style="padding:12px;border-radius:14px;">
                <div style="font-size:13.5px;color:var(--text-muted);font-weight:700;">Năng lượng trung bình</div>
                <div style="font-size:22px;font-weight:800;color:var(--accent-navy);margin-top:4px;">${dSummary.count > 0 ? dSummary.avgEnergy + ' / 5' : 'Chưa có'}</div>
              </div>
              <div class="glass-card" style="padding:12px;border-radius:14px;${dSummary.needsAttention ? 'background:var(--rose-soft);border-color:var(--rose-border);' : ''}">
                <div style="font-size:13.5px;color:var(--text-muted);font-weight:700;">Mức độ đau trung bình</div>
                <div style="font-size:22px;font-weight:800;color:${dSummary.needsAttention ? 'var(--rose-deep)' : 'var(--accent-amber)'};margin-top:4px;">${dSummary.count > 0 ? dSummary.avgPain + ' / 10' : 'Chưa có'}</div>
              </div>
            </div>
          </div>
        </div>
      `;

      if (!perms.canEditHealthProfile) {
        container.querySelectorAll('input[id^="p-"], select[id^="p-"], textarea[id^="p-"]').forEach(el => {
          el.setAttribute('disabled', 'disabled');
        });
      }

      document.getElementById('prof-member-select').onchange = (e) => { state.profileMemberId = e.target.value; renderMain(); };
      document.getElementById('btn-prof-add').onclick = () => {
        if (!perms.canEditHealthProfile) return;
        state.activeModal = 'addProfile';
        renderModal();
      };
      document.getElementById('btn-prof-print').onclick = () => window.print();
      const gotoDlogBtn = document.getElementById('btn-prof-goto-dlog');
      if (gotoDlogBtn) {
        gotoDlogBtn.onclick = () => {
          state.activeTab = 'dashboard';
          renderAll();
        };
      }

      const verifyProfBtn = document.getElementById('btn-verify-prof');
      if (verifyProfBtn) {
        verifyProfBtn.onclick = () => {
          if (!perms.canViewSensitive) {
            state.verifyError = 'Tài khoản Người thân (Chỉ xem) không có quyền mở khóa CCCD/BHYT nhạy cảm.';
            renderMain();
            return;
          }
          state.verifyError = '';
          state.verifyShowPass = false;
          state.activeModal = 'verifyAccount';
          renderModal();
        };
      }
      const lockProfBtn = document.getElementById('btn-lock-prof');
      if (lockProfBtn) {
        lockProfBtn.onclick = () => {
          state.sensitiveUnlocked = false;
          state.sensitiveUnlockedAt = 0;
          renderMain();
        };
      }

      const collectProfileInputs = () => {
        if (!perms.canEditHealthProfile) return;
        if (state.sensitiveUnlocked) {
          rec.personalId = document.getElementById('p-personalId').value.trim();
          rec.insuranceNumber = document.getElementById('p-bhyt').value.trim();
          rec.permanentAddress = document.getElementById('p-addr').value.trim();
          rec.phoneNumber = document.getElementById('p-phone').value.trim();
          rec.relativeInfo = document.getElementById('p-rel').value.trim();
          rec.doctorPhone = document.getElementById('p-doc-phone').value.trim();
          m.emergencyContact = rec.relativeInfo || m.emergencyContact;
        }
        m.name = document.getElementById('p-name').value.trim() || m.name;
        rec.dob = document.getElementById('p-dob').value;
        m.gender = document.getElementById('p-gender').value;
        m.bloodType = document.getElementById('p-blood').value;
        rec.medicalRecordCode = document.getElementById('p-med-code').value.trim();
        rec.bhytHospital = document.getElementById('p-bhyt-hosp').value.trim();
        rec.bhytExpiry = document.getElementById('p-bhyt-exp').value;
        rec.livingArrangement = document.getElementById('p-living').value;
        rec.primaryDoctor = document.getElementById('p-doc-name').value.trim();

        rec.personalHistory = document.getElementById('p-hist-pers').value.trim();
        m.conditions = rec.personalHistory;
        rec.surgicalHistory = document.getElementById('p-hist-surg').value.trim();
        rec.drugAllergies = document.getElementById('p-all-drug').value.trim();
        m.allergies = rec.drugAllergies;
        rec.weatherFoodAllergies = document.getElementById('p-all-food').value.trim();
        rec.familyHistory = document.getElementById('p-hist-fam').value.trim();
        rec.lifestyleRisks = document.getElementById('p-risks').value.trim();

        geri.hospitalizationHistory = document.getElementById('p-hist-hosp').value.trim();
        geri.mobilityStatus = document.getElementById('p-mobility').value;
        geri.visionHearing = document.getElementById('p-sensory').value.trim();
        geri.cognitionSleep = document.getElementById('p-cognition').value.trim();
        geri.dietaryNotes = document.getElementById('p-diet').value.trim();
        rec.medicalDevices = document.getElementById('p-devices').value.trim();

        m.height = Number(document.getElementById('p-height').value) || m.height;
        m.weight = Number(document.getElementById('p-weight').value) || m.weight;
        rec.clinicalExam.bp = document.getElementById('p-bp').value.trim();
        rec.clinicalExam.clinicHeartRate = document.getElementById('p-clinic-hr').value.trim();
        rec.clinicalExam.clinicSpo2 = document.getElementById('p-clinic-spo2').value.trim();
        labs.bloodSugar = document.getElementById('p-glucose').value.trim();
        labs.hba1c = document.getElementById('p-hba1c').value.trim();
        labs.lipidPanel = document.getElementById('p-lipids').value.trim();
        labs.kidneyFunction = document.getElementById('p-kidney').value.trim();

        rec.clinicalExam.generalInternal = document.getElementById('p-int').value.trim();
        rec.clinicalExam.surgery = document.getElementById('p-surg').value.trim();
        rec.clinicalExam.eye = document.getElementById('p-eye').value.trim();
        rec.clinicalExam.ent = document.getElementById('p-ent').value.trim();
        rec.paraclinical.bloodTest = document.getElementById('p-blood-test').value.trim();
        rec.paraclinical.ecg = document.getElementById('p-ecg').value.trim();
        rec.paraclinical.xray = document.getElementById('p-xray').value.trim();
        rec.treatmentProcess.careFacility = document.getElementById('p-care-fac').value.trim();
        rec.treatmentProcess.lastVisitDate = document.getElementById('p-last-visit').value;
        rec.treatmentProcess.nextAppointmentDate = document.getElementById('p-next-visit').value;
        rec.treatmentProcess.prescription = document.getElementById('p-rx').value.trim();
        rec.treatmentProcess.importantNotes = document.getElementById('p-important-notes').value.trim();
        saveJSON('smart_health_members', state.members);
      };

      document.getElementById('btn-prof-pdf').onclick = () => {
        collectProfileInputs();
        const res = exportHealthReportPDF(m);
        const toast = document.getElementById('prof-export-toast');
        if (toast) {
          toast.textContent = `✓ Đã xuất & tải về file PDF: ${res.fileName} (${res.pageCount} trang A4)!`;
          toast.style.display = 'block';
          setTimeout(() => { if (toast) toast.style.display = 'none'; }, 4000);
        }
      };

      document.getElementById('btn-prof-save').onclick = () => {
        collectProfileInputs();
        const toast = document.getElementById('prof-save-toast');
        if (toast) {
          toast.style.display = 'block';
          setTimeout(() => { if (toast) toast.style.display = 'none'; }, 2600);
        }
      };

      document.getElementById('btn-prof-xml').onclick = () => {
        if (!state.sensitiveUnlocked) {
          state.verifyError = 'Cần xác thực tài khoản và mật khẩu trước khi xuất hồ sơ XML chứa thông tin định danh.';
          state.verifyShowPass = false;
          state.activeModal = 'verifyAccount';
          renderModal();
          return;
        }
        collectProfileInputs();
        const xml = `<?xml version="1.0" encoding="UTF-8"?>
<HoSoSucKhoeDienTu>
  <HanhChinh>
    <HoTen>${esc(m.name)}</HoTen>
    <MaBenhAn>${esc(rec.medicalRecordCode || '')}</MaBenhAn>
    <CCCD>${esc(rec.personalId || '')}</CCCD>
    <NgaySinh>${esc(rec.dob || '')}</NgaySinh>
    <GioiTinh>${esc(m.gender)}</GioiTinh>
    <NhomMau>${esc(m.bloodType)}</NhomMau>
    <BHYT>${esc(rec.insuranceNumber || '')}</BHYT>
    <NoiDangKyKCB>${esc(rec.bhytHospital || '')}</NoiDangKyKCB>
    <HanBHYT>${esc(rec.bhytExpiry || '')}</HanBHYT>
    <DiaChi>${esc(rec.permanentAddress || '')}</DiaChi>
    <DienThoai>${esc(rec.phoneNumber || '')}</DienThoai>
    <LienHeKhanCap>${esc(rec.relativeInfo || m.emergencyContact || '')}</LienHeKhanCap>
    <BacSiTheoDoi>${esc(rec.primaryDoctor || '')}</BacSiTheoDoi>
    <SDTBacSi>${esc(rec.doctorPhone || '')}</SDTBacSi>
  </HanhChinh>
  <TienSuVaLaoKhoa>
    <BenhBanThan>${esc(rec.personalHistory || '')}</BenhBanThan>
    <PhauThuat>${esc(rec.surgicalHistory || '')}</PhauThuat>
    <NhapVienGanDay>${esc(geri.hospitalizationHistory || '')}</NhapVienGanDay>
    <DiUngThuoc>${esc(rec.drugAllergies || '')}</DiUngThuoc>
    <VanDongTeNga>${esc(geri.mobilityStatus || '')}</VanDongTeNga>
    <ThiLucThinhLuc>${esc(geri.visionHearing || '')}</ThiLucThinhLuc>
    <GiacNguTriNho>${esc(geri.cognitionSleep || '')}</GiacNguTriNho>
    <CheDoAn>${esc(geri.dietaryNotes || '')}</CheDoAn>
    <ThietBiHoTro>${esc(rec.medicalDevices || '')}</ThietBiHoTro>
  </TienSuVaLaoKhoa>
  <KhamLamSangVaSinhHoa>
    <ChieuCao>${m.height}</ChieuCao>
    <CanNang>${m.weight}</CanNang>
    <HuyetAp>${esc(rec.clinicalExam.bp || '')}</HuyetAp>
    <NhipTimPhongKham>${esc(rec.clinicalExam.clinicHeartRate || '')}</NhipTimPhongKham>
    <SpO2PhongKham>${esc(rec.clinicalExam.clinicSpo2 || '')}</SpO2PhongKham>
    <DuongHuyet>${esc(labs.bloodSugar || '')}</DuongHuyet>
    <HbA1c>${esc(labs.hba1c || '')}</HbA1c>
    <MoMau>${esc(labs.lipidPanel || '')}</MoMau>
    <ChucNangThan>${esc(labs.kidneyFunction || '')}</ChucNangThan>
    <NoiTongQuat>${esc(rec.clinicalExam.generalInternal || '')}</NoiTongQuat>
    <CoSoDieuTri>${esc(rec.treatmentProcess.careFacility || '')}</CoSoDieuTri>
    <NgayTaiKham>${esc(rec.treatmentProcess.nextAppointmentDate || '')}</NgayTaiKham>
    <GhiChuYTe>${esc(rec.treatmentProcess.importantNotes || '')}</GhiChuYTe>
  </KhamLamSangVaSinhHoa>
</HoSoSucKhoeDienTu>`;
        const blob = new Blob([xml], { type: 'application/xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `HoSoSucKhoe_${m.name.replace(/\s+/g, '_')}.xml`;
        a.click();
        URL.revokeObjectURL(url);
      };

      document.getElementById('btn-add-vac').onclick = () => {
        if (!perms.canEditHealthProfile) return;
        const vaccineName = document.getElementById('vac-name').value.trim();
        const date = document.getElementById('vac-date').value;
        const dose = document.getElementById('vac-dose').value.trim() || 'Mũi 1';
        const facility = document.getElementById('vac-fac').value.trim() || 'Trung tâm Y tế';
        if (!vaccineName) return;
        rec.vaccinationHistory.push({ id: 'vac-' + Date.now(), vaccineName, date, dose, facility });
        saveJSON('smart_health_members', state.members);
        logActivity('health', 'info', 'Thêm lịch tiêm chủng mới', `${vaccineName} (${dose})`, state.currentUser.fullName);
        renderMain();
      };

      container.querySelectorAll('.del-vac-btn').forEach(btn => {
        btn.onclick = () => {
          if (!perms.canEditHealthProfile) return;
          rec.vaccinationHistory = rec.vaccinationHistory.filter(v => v.id !== btn.dataset.id);
          saveJSON('smart_health_members', state.members);
          renderMain();
        };
      });
    }

    /* ========================================================================
       14. CÁC MODAL & NÚT CẤP CỨU KHẨN CẤP (SOS TRỰC TIẾP TRÊN WEB)
       ======================================================================== */
    function closeModal() {
      state.activeModal = null;
      stopSiren();
      renderModal();
    }

    function renderModal() {
      const root = document.getElementById('modal-root');
      if (!state.activeModal) {
        root.innerHTML = '';
        return;
      }

      // MODAL 1: DANH SÁCH BÀI BÁO Y HỌC (CHỈ GHI TÊN BÀI BÁO & ĐƯỜNG LINK DẪN TỚI BÀI BÁO)
      if (state.activeModal === 'journals') {
        const filtered = state.papers.filter(p => {
          const q = state.journalSearch.toLowerCase();
          return !q || p.titleVi.toLowerCase().includes(q) || (p.url && p.url.toLowerCase().includes(q));
        });

        root.innerHTML = `
          <div class="modal-backdrop">
            <div class="glass-panel modal-box" style="max-width:760px;display:flex;flex-direction:column;gap:14px;border-color:var(--border-blue);">
              <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--border-subtle);">
                <div>
                  <h3 style="font-size:17px;font-weight:800;color:var(--accent-navy);display:flex;align-items:center;gap:8px;">
                    ${svgIcon('newspaper', 18)} BÀI BÁO Y HỌC
                  </h3>
                  <p style="font-size:13px;color:var(--text-muted);">Danh sách tên bài báo và đường link dẫn trực tiếp tới bài báo</p>

                <div style="display:flex;gap:8px;">
                  <button id="modal-sync-btn" class="pill-btn" style="background:var(--surface-blue);color:var(--accent-navy);border-color:var(--border-blue);">
                    ${svgIcon('refresh', 13, '', state.isSyncingFeed ? 'spin-fast' : '')} ${state.isSyncingFeed ? 'Đang cập nhật...' : 'Đồng bộ bài báo mới'}
                  </button>
                  <button id="modal-close-btn" class="pill-btn">${svgIcon('x', 15)}</button>
                </div>
              </div>

              <input id="journal-search-inp" type="text" class="glass-input field-input" value="${esc(state.journalSearch)}" placeholder="Tìm theo tên bài báo..." />

              <div style="max-height:54vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px;">
                ${filtered.map((p, idx) => {
                  const link = p.url || (p.doi ? `https://doi.org/${p.doi}` : 'https://pubmed.ncbi.nlm.nih.gov/');
                  return `
                    <div class="glass-card" style="border-radius:14px;padding:13px 15px;display:flex;flex-direction:column;gap:6px;">
                      <h4 style="font-size:15px;font-weight:800;color:var(--text-primary);line-height:1.4;">${idx + 1}. ${esc(p.titleVi)}</h4>
                      <div style="font-size:13.5px;word-break:break-all;">
                        <strong style="color:var(--accent-navy);">Đường link bài báo:</strong>
                        <a href="${esc(link)}" target="_blank" rel="noopener noreferrer" style="color:var(--emerald-brand);font-weight:700;text-decoration:underline;">${esc(link)}</a>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>

              <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding-top:8px;border-top:1px solid var(--border-subtle);">
                <span style="font-size:12px;color:var(--text-muted);font-style:italic;">Nhấn vào đường link để mở trực tiếp bài báo gốc.</span>
                <button id="modal-close-btn-2" class="pill-btn">Đóng</button>
              </div>
            </div>
          </div>
        `;

        document.getElementById('modal-close-btn').onclick = closeModal;
        document.getElementById('modal-close-btn-2').onclick = closeModal;
        document.getElementById('modal-sync-btn').onclick = syncScientificPapers;
        document.getElementById('journal-search-inp').oninput = (e) => {
          state.journalSearch = e.target.value;
          renderModal();
          const inp = document.getElementById('journal-search-inp');
          if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
        };
        return;
      }

      // MODAL 3: CƠ SỞ Y TẾ GẦN NHẤT
      if (state.activeModal === 'facilities') {
        root.innerHTML = `
          <div class="modal-backdrop">
            <div class="glass-panel modal-box" style="max-width:540px;display:flex;flex-direction:column;gap:14px;">
              <div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--border-subtle);">
                <h3 style="font-size:16px;font-weight:800;color:var(--rose-deep);display:flex;align-items:center;gap:8px;">
                  ${svgIcon('hospital', 18)} CƠ SỞ Y TẾ &amp; DỊCH VỤ CẤP CỨU GẦN NHẤT
                </h3>
                <button id="modal-close-btn" class="pill-btn">${svgIcon('x', 15)}</button>
              </div>
              <div style="display:flex;flex-direction:column;gap:10px;">
                ${FACILITIES_DATABASE.map(f => `
                  <div class="glass-card" style="padding:12px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-color:var(--rose-border);">
                    <div>
                      <strong style="font-size:14.5px;color:var(--text-primary);">${esc(f.name)}</strong>
                      <div style="font-size:13px;color:var(--text-secondary);">${esc(f.address)}</div>
                    </div>
                    <a href="tel:${esc(f.phone)}" class="pill-btn" style="background:#8C2D38;color:#FFFFFF;text-decoration:none;border:none;">
                      ${svgIcon('phone', 13)} ${esc(f.phoneLabel || f.phone)}
                    </a>
                  </div>
                `).join('')}
              </div>
              <button id="modal-close-btn-2" class="pill-btn" style="justify-content:center;">Đóng Danh Sách Cơ Sở Y Tế</button>
            </div>
          </div>
        `;
        document.getElementById('modal-close-btn').onclick = closeModal;
        document.getElementById('modal-close-btn-2').onclick = closeModal;
        return;
      }

      // MODAL 4: THÊM NGƯỜI THEO DÕI / TẠO HỒ SƠ SỨC KHỎE
      if (state.activeModal === 'addWearer' || state.activeModal === 'addProfile') {
        const titleMap = {
          addWearer: 'Thêm Người Theo Dõi Sức Khỏe Mới',
          addProfile: 'Tạo Hồ Sơ Sức Khỏe Người Bệnh Mới'
        };
        root.innerHTML = `
          <div class="modal-backdrop">
            <div class="glass-panel modal-box" style="max-width:480px;display:flex;flex-direction:column;gap:14px;">
              <div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--border-subtle);">
                <h3 style="font-size:15px;font-weight:800;color:var(--text-primary);">${titleMap[state.activeModal]}</h3>
                <button id="modal-close-btn" class="pill-btn">${svgIcon('x', 15)}</button>
              </div>

                <div class="grid sm-grid-3" style="gap:8px;">
                  <div><label class="field-label">Tuổi *</label><input id="am-age" type="number" required class="glass-input field-input" value="70" /></div>
                  <div><label class="field-label">Giới tính</label><select id="am-gender" class="glass-input field-input"><option value="Nam">Nam</option><option value="Nữ">Nữ</option></select></div>
                  <div><label class="field-label">Nhóm máu</label><select id="am-blood" class="glass-input field-input"><option value="O">O</option><option value="A">A</option><option value="B">B</option><option value="AB">AB</option></select></div>
                </div>
                <div class="grid sm-grid-2" style="gap:8px;">
                  <div><label class="field-label">Chiều cao (cm)</label><input id="am-height" type="number" class="glass-input field-input" value="164" /></div>
                  <div><label class="field-label">Cân nặng (kg)</label><input id="am-weight" type="number" class="glass-input field-input" value="60" /></div>
                </div>
                <div><label class="field-label">Bệnh nền</label><input id="am-cond" type="text" class="glass-input field-input" placeholder="Tăng huyết áp, Tiểu đường..." /></div>
                <div><label class="field-label">Dị ứng</label><input id="am-all" type="text" class="glass-input field-input" placeholder="Không hoặc ghi rõ..." /></div>
                <div><label class="field-label">SĐT người thân SOS</label><input id="am-sos" type="text" class="glass-input field-input" placeholder="09xx xxx xxx" /></div>
                <button type="submit" class="gemini-gradient-bg text-white" style="padding:12px;border-radius:12px;font-weight:800;font-size:13px;" ${state.pairingBusy ? 'disabled' : ''}>
                  ${state.pairingBusy ? 'Đang lưu dữ liệu hồ sơ...' : 'Xác Nhận & Lưu Hồ Sơ'}
                </button>
              </form>
            </div>
          </div>
        `;
        document.getElementById('modal-close-btn').onclick = closeModal;
        document.getElementById('add-member-form').onsubmit = (e) => {
          e.preventDefault();
          const newMember = {
            id: 'mem-' + Date.now(),
            name: document.getElementById('am-name').value.trim(),
            age: Number(document.getElementById('am-age').value) || 68,
            gender: document.getElementById('am-gender').value,
            bloodType: document.getElementById('am-blood').value,
            height: Number(document.getElementById('am-height').value) || 164,
            weight: Number(document.getElementById('am-weight').value) || 60,
            conditions: document.getElementById('am-cond').value.trim(),
            allergies: document.getElementById('am-all').value.trim() || 'Không',
            emergencyContact: document.getElementById('am-sos').value.trim(),
            logs: [],
            record: {
              personalHistory: document.getElementById('am-cond').value.trim(),
              drugAllergies: document.getElementById('am-all').value.trim(),
              relativeInfo: document.getElementById('am-sos').value.trim(),
              vaccinationHistory: []
            }
          };
          state.members.push(newMember);
          state.selectedMemberId = newMember.id;
          state.profileMemberId = newMember.id;
          saveJSON('smart_health_members', state.members);
          state.pairingBusy = false;
          closeModal();
          renderAll();
        };
        return;
      }

      // MODAL 5: XÁC THỰC TÊN ĐĂNG NHẬP & MẬT KHẨU ĐỂ MỞ KHÓA THÔNG TIN NHẠY CẢM
      if (state.activeModal === 'verifyAccount') {
        const nowTs = Date.now();
        const lockedRemaining = state.verifyLockedUntil > nowTs ? Math.ceil((state.verifyLockedUntil - nowTs) / 1000) : 0;
        const currentUsername = state.currentUser ? state.currentUser.username : '';
        const perms = getRolePermissions(state.currentUser ? state.currentUser.role : '');

        root.innerHTML = `
          <div class="modal-backdrop">
            <div class="glass-panel modal-box" style="max-width:430px;display:flex;flex-direction:column;gap:14px;border-color:var(--border-amber);">
              <div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--border-subtle);">
                <h3 style="font-size:16px;font-weight:800;color:var(--rose-deep);display:flex;align-items:center;gap:8px;">
                  ${svgIcon('shieldCheck', 18)} XÁC THỰC BẢO MẬT TÀI KHOẢN
                </h3>
                <button id="modal-close-btn" class="pill-btn">${svgIcon('x', 15)}</button>
              </div>

              <div style="background:var(--surface-amber);border:1px solid var(--border-amber);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--text-primary);line-height:1.5;">
                Thông tin cá nhân (CCCD, BHYT, địa chỉ, SĐT) và danh mục thuốc luôn được <strong>ẩn tuyệt đối</strong>. Vui lòng nhập đúng <strong>Tên đăng nhập</strong> và <strong>Mật khẩu</strong> tài khoản đang sử dụng để mở khóa xem tạm thời (tự khóa sau 5 phút).
              </div>

              ${!perms.canViewSensitive ? `
                <div style="padding:10px 12px;border-radius:10px;background:var(--rose-soft);border:1px solid var(--rose-border);color:var(--rose-deep);font-size:13.5px;font-weight:700;">
                  Tài khoản hiện tại (${esc(perms.roleLabel)}) chỉ có quyền theo dõi tổng quan, không được phép mở khóa CCCD/BHYT.
                </div>
              ` : ''}

              <form id="verify-account-form" style="display:flex;flex-direction:column;gap:10px;">
                <div>
                  <label class="field-label">Tên đăng nhập hoặc Số điện thoại *</label>
                  <input id="verify-username" type="text" required autocomplete="off" class="glass-input field-input" value="${esc(currentUsername)}" placeholder="Nhập tên đăng nhập hoặc SĐT..." ${!perms.canViewSensitive ? 'disabled' : ''} />
                </div>

                <div>
                  <label class="field-label">Mật khẩu *</label>
                  <div style="position:relative;">
                    <input id="verify-password" type="${state.verifyShowPass ? 'text' : 'password'}" required autocomplete="off" class="glass-input field-input" style="padding-right:86px;" placeholder="Nhập mật khẩu tài khoản..." autofocus ${!perms.canViewSensitive ? 'disabled' : ''} />
                    <button type="button" id="verify-eye-btn" class="eye-toggle-btn" title="Hiện/Ẩn mật khẩu">
                      ${svgIcon(state.verifyShowPass ? 'eyeOff' : 'eye', 14)} ${state.verifyShowPass ? 'Ẩn' : 'Hiện'}
                    </button>
                  </div>
                </div>

                ${lockedRemaining > 0 ? `
                  <div style="padding:9px 11px;border-radius:10px;background:var(--rose-soft);border:1px solid var(--rose-border);color:var(--rose-deep);font-size:13px;font-weight:700;">
                    Bạn đã nhập sai quá nhiều lần. Vui lòng thử lại sau ${lockedRemaining} giây.
                  </div>
                ` : state.verifyError ? `
                  <div id="verify-err" style="padding:9px 11px;border-radius:10px;background:var(--rose-soft);border:1px solid var(--rose-border);color:var(--rose-deep);font-size:13px;font-weight:700;">
                    ${esc(state.verifyError)}
                  </div>
                ` : ''}

                <div style="display:flex;gap:8px;margin-top:4px;">
                  <button type="submit" class="gemini-gradient-bg text-white" style="flex:1;padding:11px;border-radius:12px;font-weight:800;font-size:14.5px;" ${lockedRemaining > 0 || !perms.canViewSensitive ? 'disabled' : ''}>
                    ${svgIcon('unlock', 14)} Xác Thực &amp; Mở Khóa Xem
                  </button>
                  <button type="button" id="verify-cancel-btn" class="pill-btn">Hủy</button>
                </div>
              </form>
            </div>
          </div>
        `;

        document.getElementById('modal-close-btn').onclick = closeModal;
        document.getElementById('verify-cancel-btn').onclick = closeModal;
        document.getElementById('verify-eye-btn').onclick = () => {
          const u = document.getElementById('verify-username').value;
          const p = document.getElementById('verify-password').value;
          state.verifyShowPass = !state.verifyShowPass;
          renderModal();
          const uEl = document.getElementById('verify-username');
          const pEl = document.getElementById('verify-password');
          if (uEl) uEl.value = u;
          if (pEl) { pEl.value = p; pEl.focus(); }
        };

        document.getElementById('verify-account-form').onsubmit = (e) => {
          e.preventDefault();
          if (!perms.canViewSensitive) return;
          const nowCheck = Date.now();
          if (state.verifyLockedUntil > nowCheck) {
            renderModal();
            return;
          }
          const uname = document.getElementById('verify-username').value.trim();
          const upass = document.getElementById('verify-password').value;
          const users = seedDefaultUsers();
          const matchedUser = findMatchingAccount(users, uname, upass);
          const sameSessionUser = !state.currentUser || (matchedUser && matchedUser.username === state.currentUser.username);

          if (matchedUser && sameSessionUser) {
            state.sensitiveUnlocked = true;
            state.sensitiveUnlockedAt = Date.now();
            state.verifyAttempts = 0;
            state.verifyLockedUntil = 0;
            state.verifyError = '';
            state.verifyShowPass = false;
            logActivity('security', 'info', 'Mở khóa thông tin y khoa nhạy cảm', 'Xác thực tài khoản thành công để xem CCCD/BHYT và đơn thuốc.', matchedUser.fullName);
            closeModal();
            renderMain();
          } else {
            state.verifyAttempts += 1;
            if (state.verifyAttempts >= 5) {
              state.verifyLockedUntil = Date.now() + 30000;
              state.verifyAttempts = 0;
              state.verifyError = 'Nhập sai liên tiếp 5 lần. Tài khoản tạm khóa xác thực trong 30 giây để bảo vệ dữ liệu y khoa.';
              logActivity('security', 'danger', 'Khóa xác thực bảo mật 30 giây', 'Nhập sai mật khẩu mở khóa dữ liệu y khoa 5 lần liên tiếp.');
            } else if (matchedUser && !sameSessionUser) {
              state.verifyError = `Vui lòng xác thực đúng tài khoản đang đăng nhập (${state.currentUser.username}).`;
            } else {
              state.verifyError = `Tên đăng nhập hoặc mật khẩu không chính xác (Còn ${5 - state.verifyAttempts} lần thử).`;
            }
            renderModal();
          }
        };
        return;
      }

      // MODAL 6: THÊM KHAY THUỐC MỚI (4 KHUNG GIỜ CHUẨN)
      if (state.activeModal === 'addTray') {
        root.innerHTML = `
          <div class="modal-backdrop">
            <div class="glass-panel modal-box" style="max-width:480px;display:flex;flex-direction:column;gap:12px;">
              <div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--border-subtle);">
                <h3 style="font-size:15px;font-weight:800;color:var(--text-primary);">Thêm Khay Thuốc Thông Minh Mới</h3>
                <button id="modal-close-btn" class="pill-btn">${svgIcon('x', 15)}</button>
              </div>
              <form id="add-tray-form" style="display:flex;flex-direction:column;gap:9px;">
                <div><label class="field-label">Tên người sử dụng khay *</label><input id="at-name" type="text" required class="glass-input field-input" placeholder="Ví dụ: Bà Nguyễn Thị Hoa" /></div>
                <div><label class="field-label">Buổi Sáng — Trước ăn 30 phút (06:30)</label><input id="at-mb" type="text" class="glass-input field-input" value="${esc(MEDICATION_TIMING_SLOTS[0].defaultMeds)}" /></div>
                <div><label class="field-label">Buổi Sáng — Ngay sau ăn sáng (07:30)</label><input id="at-ma" type="text" class="glass-input field-input" value="${esc(MEDICATION_TIMING_SLOTS[1].defaultMeds)}" /></div>
                <div><label class="field-label">Buổi Trưa / Chiều — Sau ăn trưa (12:30)</label><input id="at-na" type="text" class="glass-input field-input" value="${esc(MEDICATION_TIMING_SLOTS[2].defaultMeds)}" /></div>
                <div><label class="field-label">Buổi Tối — Sau ăn tối / trước ngủ (20:30)</label><input id="at-ev" type="text" class="glass-input field-input" value="${esc(MEDICATION_TIMING_SLOTS[3].defaultMeds)}" /></div>
                <button type="submit" class="gemini-gradient-bg text-white" style="padding:10px;border-radius:12px;font-weight:800;font-size:13px;">Tạo Khay Thuốc</button>
              </form>
            </div>
          </div>
        `;
        document.getElementById('modal-close-btn').onclick = closeModal;
        document.getElementById('add-tray-form').onsubmit = (e) => {
          e.preventDefault();
          const sched = buildDefaultSchedule();
          sched.morningBefore.medicines = document.getElementById('at-mb').value.trim() || sched.morningBefore.medicines;
          sched.morningAfter.medicines = document.getElementById('at-ma').value.trim() || sched.morningAfter.medicines;
          sched.noonAfternoon.medicines = document.getElementById('at-na').value.trim() || sched.noonAfternoon.medicines;
          sched.evening.medicines = document.getElementById('at-ev').value.trim() || sched.evening.medicines;

          const newTray = {
            id: 'tray-' + Date.now(),
            trayNumber: state.trays.length + 1,
