<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Healthcare</title>
  <meta name="description" content="Thiết bị chăm sóc sức khỏe thông minh cho người cao tuổi theo thời gian thực" />
  <meta property="og:title" content="Smart Healthcare" />
  <meta property="og:description" content="Thiết bị chăm sóc sức khỏe thông minh cho người cao tuổi theo thời gian thực" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <style>
    /* ==========================================================================
       SMART HEALTHCARE - STANDALONE STYLESHEET (GIAO DIỆN SÁNG & TỐI)
       Bạn có thể chỉnh sửa màu sắc, font chữ và bố cục trực tiếp tại đây.
       ========================================================================== */
    :root {
      color-scheme: light;
      --bg-page: #FAF7F0;
      --bg-accent-1: rgba(30, 58, 95, 0.04);
      --bg-accent-2: rgba(201, 164, 97, 0.06);
      --panel-bg: #FFFFFF;
      --card-bg: #F6F8FB;
      --card-hover-bg: #EFF4FA;
      --input-bg: #FFFFFF;
      --input-readonly-bg: #F1F4F8;
      --border-subtle: #D5DEE9;
      --border-strong: #92A6BE;
      --text-primary: #111827;
      --text-secondary: #374151;
      --text-muted: #4B5563;
      --text-inverse: #FFFFFF;
      --blue: #1B435D;
      --purple: #433878;
      --emerald: #0E6B53;
      --rose: #8C2D38;
      --rose-ink: #74222C;
      --rose-soft: #FBF3F2;
      --rose-border: #DFBFC2;
      --amber: #8A510F;
      --cyan: #0F5E73;
      --gold: #C49B57;
      --accent-navy: var(--blue);
      --accent-purple: var(--purple);
      --emerald-brand: var(--emerald);
      --accent-rose: var(--rose);
      --rose-deep: var(--rose-ink);
      --accent-amber: var(--amber);
      --accent-cyan: var(--cyan);

      --surface-blue: #F0F5FA;
      --border-blue: #C6D5E6;
      --surface-emerald: #EEF7F4;
      --border-emerald: #8FCBB7;
      --surface-amber: #FCF6EA;
      --border-amber: #E3C285;
      --surface-cyan: #ECFEFF;
      --border-cyan: #A5F3FC;
      --surface-purple: #F5F3FF;
      --border-purple: #DDD6FE;
      --table-head-bg: #F1F5F9;
      --table-row-border: #E5EBF3;
      --pill-bg: #F8FAFC;
      --pill-border: #BAC7D8;
      --pill-hover: #E9EFF6;
      --nav-hover-bg: #F1F5F9;
      --chart-grid: #E5EBF3;
      --scroll-track: #F1EFEA;
      --scroll-thumb: #C4CEDB;
      --shadow-panel: 0 8px 24px -6px rgba(17, 34, 64, 0.07);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bg-page: #0B1220;
      --bg-accent-1: rgba(56, 189, 248, 0.08);
      --bg-accent-2: rgba(16, 185, 129, 0.06);
      --panel-bg: #121B2E;
      --card-bg: #182338;
      --card-hover-bg: #1F2D47;
      --input-bg: #0F172A;
      --input-readonly-bg: #1A2438;
      --border-subtle: #2A3955;
      --border-strong: #465B80;
      --text-primary: #F1F5F9;
      --text-secondary: #CBD5E1;
      --text-muted: #94A3B8;
      --text-inverse: #FFFFFF;
      --blue: #7DD3FC;
      --purple: #C4B5FD;
      --emerald: #34D399;
      --rose: #FDA4AF;
      --rose-ink: #FECDD3;
      --rose-soft: #2D161D;
      --rose-border: #7F2D3A;
      --amber: #FCD34D;
      --cyan: #67E8F9;
      --gold: #D4AF6A;

      --surface-blue: #16263E;
      --border-blue: #2F4D75;
      --surface-emerald: #102B25;
      --border-emerald: #1E5A4C;
      --surface-amber: #2B2212;
      --border-amber: #6B5021;
      --surface-cyan: #0E2936;
      --border-cyan: #1B5A70;
      --surface-purple: #221B3A;
      --border-purple: #4B3C7A;
      --table-head-bg: #18243A;
      --table-row-border: #25344E;
      --pill-bg: #1A263D;
      --pill-border: #3B4F73;
      --pill-hover: #243452;
      --nav-hover-bg: #1E2C46;
      --chart-grid: #293852;
      --scroll-track: #0F172A;
      --scroll-thumb: #334155;
      --shadow-panel: 0 10px 28px -6px rgba(0, 0, 0, 0.55);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-family: 'Times New Roman', Times, serif;
      background-color: var(--bg-page);
      color: var(--text-primary);
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      font-family: 'Times New Roman', Times, serif;
      font-size: 16px;
      background-color: var(--bg-page);
      color: var(--text-primary);
      background-image:
        radial-gradient(circle at 10% 8%, var(--bg-accent-1) 0%, transparent 42%),
        radial-gradient(circle at 90% 12%, var(--bg-accent-2) 0%, transparent 40%);
      overflow-x: hidden;
      line-height: 1.65;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .font-mono {
      font-family: 'Times New Roman', Times, serif;
      font-variant-numeric: tabular-nums;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--scroll-track); }
    ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }

    /* Refined Senior-Friendly Luxury Surfaces */
    .glass-panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-panel);
      color: var(--text-primary);
    }

    .glass-card {
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glass-card:hover {
      border-color: var(--border-strong);
      box-shadow: 0 4px 14px rgba(17, 34, 64, 0.1);
    }

    .glass-input {
      background: var(--input-bg);
      border: 1px solid var(--border-strong);
      color: var(--text-primary);
      font-family: 'Times New Roman', Times, serif;
      transition: all 0.2s ease;
    }

    .glass-input::placeholder {
      color: var(--text-muted);
    }

    .glass-input:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.22);
    }

    .glass-input[readonly] {
      background: var(--input-readonly-bg);
      color: var(--text-muted);
      cursor: not-allowed;
    }

    select.glass-input option {
      background: var(--panel-bg);
      color: var(--text-primary);
    }

    .gemini-gradient-text {
      background: linear-gradient(135deg, #1B435D 0%, #0E6B53 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .gemini-gradient-bg {
      background: linear-gradient(135deg, #1B435D 0%, #165B63 100%);
    }
    html[data-theme="dark"] .gemini-gradient-bg {
      background: linear-gradient(135deg, #1E4D78 0%, #0E6B53 100%);
    }

    /* Calm, Senior-Friendly SOS Elevation (No Harsh Flashing Glow) */
    @keyframes pulse-glow-red {
      0%, 100% { box-shadow: 0 6px 18px rgba(140, 45, 56, 0.24); }
      50% { box-shadow: 0 8px 24px rgba(140, 45, 56, 0.36); }
    }
    .animate-glow-red {
      animation: pulse-glow-red 2.8s infinite ease-in-out;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .spin-slow { animation: spin 3.2s linear infinite; }
    .spin-med  { animation: spin 1.4s linear infinite; }
    .spin-fast { animation: spin 0.45s linear infinite; }

    @keyframes ping {
      75%, 100% { transform: scale(1.9); opacity: 0; }
    }
    .ping-dot { animation: ping 1.4s cubic-bezier(0, 0, 0.2, 1) infinite; }

    /* Layout Containers (Tương thích Điện thoại, Máy tính bảng & Máy tính) */
    .app-shell {
      max-width: 1280px;
      margin: 0 auto;
      padding: 10px 10px 98px 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    @media (min-width: 640px) {
      .app-shell { padding: 14px 16px 96px 16px; }
    }
    @media (min-width: 1024px) {
      .app-shell { padding: 16px 22px 92px 22px; }
    }

    /* Header */
    .app-header {
      border-radius: 18px;
      padding: 12px 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-top: 3px solid #1E3A5F;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(30, 58, 95, 0.22);
      border: 1px solid rgba(201, 164, 97, 0.5);
      flex-shrink: 0;
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    @media (max-width: 639px) {
      .app-header { padding: 10px 12px; gap: 8px; }
      .brand-icon { width: 38px; height: 38px; border-radius: 11px; }
      .header-actions { width: 100%; justify-content: space-between; }
    }

    /* Navigation Tabs */
    .nav-tabs {
      border-radius: 18px;
      padding: 6px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    @media (min-width: 640px) {
      .nav-tabs {
        display: flex;
        flex-wrap: wrap;
      }
    }

    .nav-btn {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 10px;
      border-radius: 13px;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--text-primary);
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      white-space: normal;
      overflow-wrap: break-word;
    }
    @media (min-width: 768px) {
      .nav-btn {
        font-size: 15.5px;
        padding: 10px 14px;
        white-space: nowrap;
      }
    }

    .nav-btn:hover {
      color: var(--blue);
      background: var(--nav-hover-bg);
    }

    .nav-btn.active {
      background: linear-gradient(135deg, #1B435D 0%, #165B63 100%);
      color: #FFFFFF;
      border-color: var(--gold);
      box-shadow: 0 4px 14px rgba(27, 67, 93, 0.28);
    }

    /* Buttons & Badges */
    button, .btn, input, select, textarea {
      font-family: 'Times New Roman', Times, serif;
    }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid var(--blue);
      outline-offset: 2px;
    }
    button, .btn {
      cursor: pointer;
      border: none;
      transition: all 0.18s ease;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid transparent;
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 44px;
      padding: 9px 15px;
      border-radius: 12px;
      font-size: 14.5px;
      font-weight: 700;
      border: 1.5px solid var(--pill-border);
      background: var(--pill-bg);
      color: var(--text-primary);
    }
    .pill-btn:hover { background: var(--pill-hover); border-color: var(--border-strong); }
    .pill-btn.gemini-gradient-bg {
      background: linear-gradient(135deg, #1E3A5F 0%, #2B547E 100%);
      border-color: #1E3A5F;
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(30, 58, 95, 0.2);
    }
    .pill-btn.gemini-gradient-bg:hover { opacity: 0.94; background: linear-gradient(135deg, #1E3A5F 0%, #2B547E 100%); }

    /* Theme Surface Utilities */
    .surface-blue { background: var(--surface-blue) !important; border-color: var(--border-blue) !important; color: var(--text-primary); }
    .surface-emerald { background: var(--surface-emerald) !important; border-color: var(--border-emerald) !important; color: var(--text-primary); }
    .surface-amber { background: var(--surface-amber) !important; border-color: var(--border-amber) !important; color: var(--text-primary); }
    .surface-rose { background: var(--rose-soft) !important; border-color: var(--rose-border) !important; color: var(--text-primary); }
    .surface-cyan { background: var(--surface-cyan) !important; border-color: var(--border-cyan) !important; color: var(--text-primary); }
    .surface-purple { background: var(--surface-purple) !important; border-color: var(--border-purple) !important; color: var(--text-primary); }

    /* Dark-mode compatibility for legacy inline-styled cards */
    html[data-theme="dark"] .glass-panel h1,
    html[data-theme="dark"] .glass-panel h2,
    html[data-theme="dark"] .glass-panel h3,
    html[data-theme="dark"] .glass-panel h4 {
      color: var(--text-primary);
    }
    html[data-theme="dark"] .modal-box {
      background: var(--panel-bg);
      color: var(--text-primary);
      border-color: var(--border-subtle);
    }

    /* Day Picker Pills */
    .day-pill {
      min-width: 38px;
      min-height: 36px;
      padding: 5px 9px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      border: 1px solid var(--border-strong);
      background: var(--panel-bg);
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .day-pill.active {
      background: #1E3A5F;
      color: #FFFFFF;
      border-color: var(--gold);
    }

    /* Grid Helpers */
    .grid { display: grid; gap: 12px; }
    .grid-1 { grid-template-columns: 1fr; }
    .grid-2 { grid-template-columns: 1fr; }
    .grid-3 { grid-template-columns: 1fr; }
    .grid-4 { grid-template-columns: 1fr; }
    .grid-12 { grid-template-columns: 1fr; }

    @media (min-width: 640px) {
      .sm-grid-2 { grid-template-columns: repeat(2, 1fr); }
      .sm-grid-3 { grid-template-columns: repeat(3, 1fr); }
      .sm-grid-4 { grid-template-columns: repeat(4, 1fr); }
    }
    @media (min-width: 1024px) {
      .lg-grid-2 { grid-template-columns: repeat(2, 1fr); }
      .lg-grid-3 { grid-template-columns: repeat(3, 1fr); }
      .lg-grid-4 { grid-template-columns: repeat(4, 1fr); }
      .lg-grid-12 { grid-template-columns: repeat(12, 1fr); }
      .lg-span-3 { grid-column: span 3 / span 3; }
      .lg-span-4 { grid-column: span 4 / span 4; }
      .lg-span-5 { grid-column: span 5 / span 5; }
      .lg-span-6 { grid-column: span 6 / span 6; }
      .lg-span-7 { grid-column: span 7 / span 7; }
      .lg-span-8 { grid-column: span 8 / span 8; }
      .lg-span-9 { grid-column: span 9 / span 9; }
      .lg-span-12 { grid-column: span 12 / span 12; }
    }

    /* Color Utilities (Theme-Adaptive High-Contrast Ink for Seniors) */
    .text-white { color: #FFFFFF; }
    .text-ink { color: var(--text-primary); }
    .text-slate-100 { color: var(--text-primary); }
    .text-slate-200 { color: var(--text-secondary); }
    .text-slate-300 { color: var(--text-muted); }
    .text-slate-400 { color: var(--text-muted); }
    .text-slate-500 { color: var(--text-muted); }
    .text-emerald { color: var(--emerald); }
    .text-rose { color: var(--rose); }
    .text-amber { color: var(--amber); }
    .text-cyan { color: var(--cyan); }
    .text-blue { color: var(--blue); }
    .text-purple { color: var(--purple); }
    .text-indigo { color: var(--blue); }

    /* Modal Backdrop */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .modal-box {
      width: 100%;
      max-height: 92vh;
      overflow-y: auto;
      border-radius: 20px;
      padding: 18px;
      background: var(--panel-bg);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 24px 48px -12px rgba(17, 24, 39, 0.38);
    }

    /* Floating Emergency SOS (Warm Burgundy — Senior-Friendly) */
    .sos-fab-wrap {
      position: fixed;
      bottom: 14px;
      right: 14px;
      z-index: 45;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }
    @media (min-width: 768px) {
      .sos-fab-wrap { bottom: 22px; right: 22px; }
    }

    .sos-fab-btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 13px 20px;
      border-radius: 999px;
      background: linear-gradient(135deg, #8C2D38, #6E212B);
      color: #FFFFFF;
      font-weight: 800;
      font-size: 15.5px;
      border: 2px solid #F3D9DB;
      box-shadow: 0 8px 22px rgba(140, 45, 56, 0.28);
    }
    .sos-fab-btn:hover { transform: scale(1.02); background: linear-gradient(135deg, #7C242E, #5E1B23); }

    /* Specific Components */
    .chat-compact-frame {
      width: 100%;
    }

    .chat-scroll {
      height: 230px;
      overflow-y: auto;
      padding-right: 6px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .sos-live-banner {
      border-radius: 16px;
      padding: 13px 16px;
      background: var(--rose-soft);
      border: 2px solid var(--rose);
      color: var(--rose-ink);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 6px 16px rgba(140, 45, 56, 0.14);
    }

    .med-reminder-banner {
      border-radius: 16px;
      padding: 13px 16px;
      background: var(--surface-amber);
      border: 2px solid var(--gold);
      color: var(--text-primary);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 6px 16px rgba(146, 87, 17, 0.11);
    }

    .watchdog-alert-banner {
      border-radius: 16px;
      padding: 13px 16px;
      background: var(--rose-soft);
      border: 2px solid var(--rose);
      color: var(--rose-ink);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 6px 16px rgba(140, 45, 56, 0.14);
    }

    /* Senior-Friendly Daily Log Selectors & Onboarding Steps */
    .step-wizard-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 8px;
      border-radius: 16px;
    }
    @media (max-width: 639px) {
      .step-wizard-bar { grid-template-columns: 1fr; }
    }
    .step-item {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border-subtle);
      background: var(--card-bg);
      color: var(--text-muted);
    }
    .step-item.current {
      background: #1E3A5F;
      color: #FFFFFF;
      border-color: var(--gold);
    }
    .step-item.done {
      background: var(--surface-emerald);
      color: var(--emerald);
      border-color: var(--border-emerald);
    }
    .score-btn-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }
    @media (max-width: 520px) {
      .score-btn-grid { grid-template-columns: repeat(3, 1fr); }
    }
    .score-btn {
      min-height: 54px;
      padding: 7px 6px;
      border-radius: 11px;
      border: 1.5px solid var(--border-strong);
      background: var(--panel-bg);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }
    .score-btn:hover { border-color: var(--blue); background: var(--surface-blue); }
    .score-btn.active-mood { background: #1E3A5F; color: #FFFFFF; border-color: #1E3A5F; }
    .score-btn.active-energy { background: #0F6B52; color: #FFFFFF; border-color: #0F6B52; }
    .pain-btn-grid {
      display: grid;
      grid-template-columns: repeat(11, 1fr);
      gap: 4px;
    }
    @media (max-width: 639px) {
      .pain-btn-grid { grid-template-columns: repeat(6, 1fr); }
    }
    .pain-btn {

    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function maskText(val, showChars = 3) {
      if (!val) return 'Chưa cập nhật';
      const s = String(val);
      if (s.length <= showChars) return '••••';
      return '••••••••' + s.slice(-showChars);
    }

    function todayKey() {
      const d = new Date();
      return d.toISOString().split('T')[0];

    function getPast7Days() {
      const days = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        days.push({
          key: d.toISOString().split('T')[0],
          label: d.toLocaleDateString('vi-VN', { weekday: 'short', day: '2-digit', month: '2-digit' })
        });
      }
      return days;

    function clampScore(val, min, max) {
      if (!Number.isFinite(Number(val))) return min;
      return Math.max(min, Math.min(max, Math.round(Number(val))));
    }

    function validateDailyLogInput(input) {
      const dateKey = (input.dateKey || '').trim() || todayKey();
      if (!/^\d{4}-\d{2}-\d{2}$/.test(dateKey)) {
        return { valid: false, error: 'Ngày ghi nhận không hợp lệ (YYYY-MM-DD).' };
      }
      if (!Number.isFinite(Number(input.mood)) || input.mood < 1 || input.mood > 5) {
        return { valid: false, error: 'Điểm tâm trạng phải từ 1 đến 5.' };
      }
      if (!Number.isFinite(Number(input.energy)) || input.energy < 1 || input.energy > 5) {
        return { valid: false, error: 'Mức năng lượng phải từ 1 đến 5.' };
      }
      if (!Number.isFinite(Number(input.pain)) || input.pain < 0 || input.pain > 10) {
        return { valid: false, error: 'Mức độ đau phải từ 0 đến 10.' };
      }
      return {
        valid: true,
        entry: {
          id: `dlog-${Date.now()}-${Math.floor(Math.random() * 1000)}`,
          dateKey,
          timeOfDay: (input.timeOfDay || 'Sáng').trim(),
          mood: Math.round(Number(input.mood)),
          energy: Math.round(Number(input.energy)),
          pain: Math.round(Number(input.pain)),
          symptoms: Array.isArray(input.symptoms) ? input.symptoms.filter(Boolean).slice(0, 10) : [],
          note: (input.note || '').trim().slice(0, 400),
          createdAt: Date.now()
        }
      };
    }

    function summarizeDailyLogs(logs) {
      if (!Array.isArray(logs) || logs.length === 0) {
        return {
          count: 0,
          avgMood: 0,
          avgEnergy: 0,
          avgPain: 0,
          latestEntry: null,
          needsAttention: false,
          attentionReason: ''
        };
      }
      const sorted = [...logs].sort((a, b) => {
        if (b.dateKey !== a.dateKey) return String(b.dateKey).localeCompare(String(a.dateKey));
        return (b.createdAt || 0) - (a.createdAt || 0);
      });
      const sumMood = sorted.reduce((acc, x) => acc + clampScore(x.mood, 1, 5), 0);
      const sumEnergy = sorted.reduce((acc, x) => acc + clampScore(x.energy, 1, 5), 0);
      const sumPain = sorted.reduce((acc, x) => acc + clampScore(x.pain, 0, 10), 0);
      const latest = sorted[0];
      let needsAttention = false;
      let attentionReason = '';
      if (latest.pain >= 7) {
        needsAttention = true;
        attentionReason = `Mức độ đau gần nhất cao (${latest.pain}/10). Gia đình nên hỏi thăm và cân nhắc liên hệ bác sĩ.`;
      } else if (latest.mood <= 1 && latest.energy <= 2) {
        needsAttention = true;
        attentionReason = 'Tâm trạng và năng lượng xuống thấp. Người thân nên gọi điện trò chuyện và theo dõi thêm.';
      }
      return {
        count: sorted.length,
        avgMood: Number((sumMood / sorted.length).toFixed(1)),
        avgEnergy: Number((sumEnergy / sorted.length).toFixed(1)),
        avgPain: Number((sumPain / sorted.length).toFixed(1)),
        latestEntry: latest,
        needsAttention,
        attentionReason
      };
    }

    function buildDailyChartSeries(logs, daysCount = 7) {
      const days = clampScore(daysCount, 3, 30);
      const byDate = new Map();
      for (const item of logs || []) {
        if (!item || !item.dateKey) continue;
        const arr = byDate.get(item.dateKey) || [];
        arr.push(item);
        byDate.set(item.dateKey, arr);
      }
      const series = [];
      const anchor = new Date();
      for (let i = days - 1; i >= 0; i--) {
        const d = new Date(anchor);
        d.setDate(d.getDate() - i);
        const key = d.toISOString().split('T')[0];
        const shortLabel = `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`;
        const list = byDate.get(key) || [];
        if (list.length === 0) {
          series.push({ dateKey: key, shortLabel, mood: null, energy: null, pain: null, entryCount: 0 });
        } else {
          const m = list.reduce((s, e) => s + clampScore(e.mood, 1, 5), 0) / list.length;
          const en = list.reduce((s, e) => s + clampScore(e.energy, 1, 5), 0) / list.length;
          const p = list.reduce((s, e) => s + clampScore(e.pain, 0, 10), 0) / list.length;
          series.push({
            dateKey: key,
            shortLabel,
            mood: Number(m.toFixed(1)),
            energy: Number(en.toFixed(1)),
            pain: Number(p.toFixed(1)),
            entryCount: list.length
          });
        }
      }
      return series;
    }

    function buildDailyLogSvgChart(series, selectedDate) {
      const W = 720;
      const H = 250;
      const padL = 44;
      const padR = 44;
      const padT = 22;
      const padB = 36;
      const innerW = W - padL - padR;
      const innerH = H - padT - padB;
      const count = series.length;
      const isDark = typeof state !== 'undefined' && state.theme === 'dark';
      const gridColor = isDark ? '#2A394D' : '#E5EBF3';
      const textColor = isDark ? '#CBD5E1' : '#4B5563';
      const moodColor = isDark ? '#60A5FA' : '#1E3A5F';
      const energyColor = isDark ? '#34D399' : '#0F6B52';
      const painColor = isDark ? '#FB7185' : '#8C2D38';
      const strokePt = isDark ? '#141E2B' : '#FFFFFF';
      const xFor = (i) => count <= 1 ? padL + innerW / 2 : padL + (i / (count - 1)) * innerW;
      const yFor5 = (v) => padT + innerH - ((clampScore(v * 10, 0, 50) / 10) / 5) * innerH;
      const yFor10 = (v) => padT + innerH - ((clampScore(v * 10, 0, 100) / 10) / 10) * innerH;

      let gridLines = '';
      for (let step = 0; step <= 5; step++) {
        const y = padT + innerH - (step / 5) * innerH;
        const painTick = step * 2;
        gridLines += `
          <line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}" stroke="${gridColor}" stroke-width="1" />
          <text x="${padL - 8}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="11.5" font-weight="700" fill="${textColor}">${step}</text>
          <text x="${W - padR + 8}" y="${(y + 4).toFixed(1)}" text-anchor="start" font-size="11.5" font-weight="700" fill="${painColor}">${painTick}</text>
        `;
      }

      const makePath = (key, yFn) => {
        let d = '';
        let open = false;
        series.forEach((pt, idx) => {
          if (pt[key] === null || pt[key] === undefined) {
            open = false;
            return;
          }
          const x = xFor(idx).toFixed(1);
          const y = yFn(pt[key]).toFixed(1);
          d += open ? ` L ${x} ${y}` : ` M ${x} ${y}`;
          open = true;
        });
        return d.trim();
      };

      const moodPath = makePath('mood', yFor5);
      const energyPath = makePath('energy', yFor5);
      const painPath = makePath('pain', yFor10);

      const xLabels = series.map((pt, idx) => {
        const showLabel = count <= 8 || idx % 2 === 0 || idx === count - 1;
        const x = xFor(idx).toFixed(1);
        const isSel = selectedDate && selectedDate === pt.dateKey;
        return showLabel
          ? `<text x="${x}" y="${H - 10}" text-anchor="middle" font-size="11.5" font-weight="${isSel ? '800' : '700'}" fill="${isSel ? painColor : textColor}">${esc(pt.shortLabel)}</text>`
          : '';
      }).join('');

      const markers = series.map((pt, idx) => {
        const x = xFor(idx);
        const isSel = selectedDate === pt.dateKey;
        let out = '';
        if (pt.entryCount > 0) {
          const ym = yFor5(pt.mood);
          const ye = yFor5(pt.energy);
          const yp = yFor10(pt.pain);
          if (isSel) {
            out += `<line x1="${x.toFixed(1)}" y1="${padT}" x2="${x.toFixed(1)}" y2="${padT + innerH}" stroke="#C9A461" stroke-width="2" stroke-dasharray="3,3" />`;
          }
          out += `<circle cx="${x.toFixed(1)}" cy="${ym.toFixed(1)}" r="${isSel ? 6 : 4.5}" fill="${moodColor}" stroke="${strokePt}" stroke-width="1.5" />`;
          out += `<rect x="${(x - (isSel ? 5 : 4)).toFixed(1)}" y="${(ye - (isSel ? 5 : 4)).toFixed(1)}" width="${isSel ? 10 : 8}" height="${isSel ? 10 : 8}" rx="2" fill="${energyColor}" stroke="${strokePt}" stroke-width="1.5" />`;
          out += `<polygon points="${x.toFixed(1)},${(yp - 6).toFixed(1)} ${(x + 6).toFixed(1)},${yp.toFixed(1)} ${x.toFixed(1)},${(yp + 6).toFixed(1)} ${(x - 6).toFixed(1)},${yp.toFixed(1)}" fill="${painColor}" stroke="${strokePt}" stroke-width="1.5" />`;
        }
        return out;
      }).join('');

      return `
        <svg viewBox="0 0 ${W} ${H}" width="100%" height="235" role="img" aria-label="Biểu đồ nhật ký sức khỏe hằng ngày gồm tâm trạng, năng lượng và mức độ đau" style="display:block;background:var(--card-bg);border-radius:12px;border:1px solid var(--border-subtle);">
          <text x="8" y="14" font-size="11" font-weight="800" fill="${moodColor}">Tâm trạng / NL (1–5)</text>
          <text x="${W - 8}" y="14" text-anchor="end" font-size="11" font-weight="800" fill="${painColor}">Mức đau (0–10)</text>
          ${gridLines}
          ${moodPath ? `<path d="${moodPath}" fill="none" stroke="${moodColor}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />` : ''}
          ${energyPath ? `<path d="${energyPath}" fill="none" stroke="${energyColor}" stroke-width="3" stroke-dasharray="6,4" stroke-linecap="round" stroke-linejoin="round" />` : ''}
          ${painPath ? `<path d="${painPath}" fill="none" stroke="${painColor}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />` : ''}
          ${markers}
          ${xLabels}
        </svg>
      `;
    }

    function timeToMinutes(hhmm) {
      if (!hhmm || !hhmm.includes(':')) return 0;
      const [h, m] = hhmm.split(':').map(Number);
      return (h || 0) * 60 + (m || 0);
    }

    function nowMinutes() {
      const n = new Date();
      return n.getHours() * 60 + n.getMinutes();

    /* ========================================================================
       3. ÂM THANH WEB AUDIO & GIỌNG NÓI TIẾNG VIỆT (KHÔNG CHỒNG CHÉO)
       ======================================================================== */
    let audioCtx = null;
    let sirenInterval = null;

    function getAudioCtx() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playChime() {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.14);
          gain.gain.setValueAtTime(0.001, ctx.currentTime + i * 0.14);
          gain.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + i * 0.14 + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.14 + 0.45);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + i * 0.14);
          osc.stop(ctx.currentTime + i * 0.14 + 0.5);
        });
      } catch {}
    }

    function startSiren() {
      stopSiren();
      const triggerUrgentDangerCycle = () => {
        try {
          const ctx = getAudioCtx();
          if (!ctx) return;
          const now = ctx.currentTime;

          const compressor = ctx.createDynamicsCompressor();
          compressor.threshold.setValueAtTime(-16, now);
          compressor.knee.setValueAtTime(8, now);
          compressor.ratio.setValueAtTime(16, now);
          compressor.attack.setValueAtTime(0.001, now);
          compressor.release.setValueAtTime(0.12, now);
          compressor.connect(ctx.destination);

          // 3 nhịp còi rít cấp bách liên hồi (Klaxon nguy hiểm)
          [0, 0.14, 0.28].forEach((offset) => {
            const t0 = now + offset;
            const burstGain = ctx.createGain();
            burstGain.gain.setValueAtTime(0.02, t0);
            burstGain.gain.linearRampToValueAtTime(0.96, t0 + 0.015);
            burstGain.gain.setValueAtTime(0.96, t0 + 0.085);
            burstGain.gain.linearRampToValueAtTime(0.02, t0 + 0.12);
            burstGain.connect(compressor);

            const oSaw = ctx.createOscillator();
            oSaw.type = 'sawtooth';
            oSaw.frequency.setValueAtTime(1920, t0);
            oSaw.frequency.exponentialRampToValueAtTime(1380, t0 + 0.11);

            const oSqr = ctx.createOscillator();
            oSqr.type = 'square';
            oSqr.frequency.setValueAtTime(2880, t0);
            oSqr.frequency.exponentialRampToValueAtTime(2070, t0 + 0.11);

            const oSub = ctx.createOscillator();
            oSub.type = 'triangle';
            oSub.frequency.setValueAtTime(145, t0);

            const gSqr = ctx.createGain();
            gSqr.gain.setValueAtTime(0.38, t0);
            const gSub = ctx.createGain();
            gSub.gain.setValueAtTime(0.55, t0);

            oSaw.connect(burstGain);
            oSqr.connect(gSqr);
            gSqr.connect(burstGain);
            oSub.connect(gSub);
            gSub.connect(burstGain);

            oSaw.start(t0); oSqr.start(t0); oSub.start(t0);
            oSaw.stop(t0 + 0.125); oSqr.stop(t0 + 0.125); oSub.stop(t0 + 0.125);
          });

          // Hồi còi hú Hi-Lo chói gắt báo động nguy cấp
          const wStart = now + 0.44;
          const wGain = ctx.createGain();
          wGain.gain.setValueAtTime(0.05, wStart);
          wGain.gain.linearRampToValueAtTime(0.95, wStart + 0.03);
          wGain.gain.setValueAtTime(0.95, wStart + 0.36);
          wGain.gain.linearRampToValueAtTime(0.03, wStart + 0.42);
          wGain.connect(compressor);

          const wOsc1 = ctx.createOscillator();
          wOsc1.type = 'sawtooth';
          wOsc1.frequency.setValueAtTime(920, wStart);
          wOsc1.frequency.exponentialRampToValueAtTime(1880, wStart + 0.19);
          wOsc1.frequency.exponentialRampToValueAtTime(960, wStart + 0.40);

          const wOsc2 = ctx.createOscillator();
          wOsc2.type = 'square';
          wOsc2.frequency.setValueAtTime(932, wStart);
          wOsc2.frequency.exponentialRampToValueAtTime(1905, wStart + 0.19);
          wOsc2.frequency.exponentialRampToValueAtTime(972, wStart + 0.40);

          const gW2 = ctx.createGain();
          gW2.gain.setValueAtTime(0.45, wStart);

          wOsc1.connect(wGain);
          wOsc2.connect(gW2);
          gW2.connect(wGain);

          wOsc1.start(wStart);
          wOsc2.start(wStart);
          wOsc1.stop(wStart + 0.43);
          wOsc2.stop(wStart + 0.43);
        } catch {}
      };
      triggerUrgentDangerCycle();
      sirenInterval = setInterval(triggerUrgentDangerCycle, 880);
    }

    function stopSiren() {
      if (sirenInterval) {
        clearInterval(sirenInterval);
        sirenInterval = null;
      }
    }

    function stopSpeak() {
      try {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      } catch {}
      state.isSpeaking = false;
    }

    function speakVi(text, rate = null, pitch = 1.02) {
      if (!text) return;
      const effectiveRate = rate !== null ? rate : (state && state.voiceSlowMode ? 0.80 : 0.94);
      stopSpeak();
      try {
        if ('speechSynthesis' in window) {
          const utter = new SpeechSynthesisUtterance(text);
          utter.lang = 'vi-VN';
          utter.rate = effectiveRate;
          utter.pitch = pitch;
          const voices = window.speechSynthesis.getVoices();
          const viVoice = voices.find(v => v.lang && v.lang.toLowerCase().includes('vi'));
          if (viVoice) utter.voice = viVoice;
          utter.onstart = () => {
            state.isSpeaking = true;
            updateVoiceUIOnly();
          };
          utter.onend = () => {
            state.isSpeaking = false;
            updateVoiceUIOnly();
          };
          utter.onerror = () => {
            state.isSpeaking = false;
            updateVoiceUIOnly();
          };
          window.speechSynthesis.speak(utter);
          state.isSpeaking = true;
        }
      } catch {
        state.isSpeaking = false;
      }
    }

    function normalizePhoneDigits(phone) {
      return String(phone || '').replace(/\D/g, '');
    }

    function isValidEmergencyPhone(phone) {
      const digits = normalizePhoneDigits(phone);
      return digits.length >= 9 && digits.length <= 15;
    }

    function findMatchingAccount(users, identifier, password) {
      const cleanId = String(identifier || '').trim();
      const idDigits = normalizePhoneDigits(cleanId);
      if (!cleanId || !password) return null;
      for (const u of (users || [])) {
        if (!u || u.password !== password) continue;
        const uname = String(u.username || '').trim();
        const uPhoneDigits = normalizePhoneDigits(u.phone || '');
        if (uname.toLowerCase() === cleanId.toLowerCase()) return u;
        if (idDigits.length >= 9 && uPhoneDigits && uPhoneDigits === idDigits) return u;
      }
      return null;
    }

    function hasMandatoryEmergencyPhone(contacts) {
      return Array.isArray(contacts) && contacts.some(c => c && isValidEmergencyPhone(c.phone));
    }

    function validateRegistrationInput(users, payload) {
      const fullName = String(payload.fullName || '').trim();
      const role = String(payload.role || '').trim() || 'Thành Viên Gia Đình';
      const username = String(payload.username || '').trim();
      const userPhone = String(payload.userPhone || '').trim();
      const password = String(payload.password || '');

      if (!fullName) {
        return { ok: false, error: 'Vui lòng nhập Họ và tên để dễ nhận biết tài khoản.' };
      }
      if (!username) {
        return { ok: false, error: 'Vui lòng nhập Tên đăng nhập (hoặc số điện thoại dùng để đăng nhập).' };
      }
      if (!password || password.length < 3) {
        return { ok: false, error: 'Vui lòng nhập Mật khẩu (tối thiểu 3 ký tự để bảo vệ tài khoản).' };
      }
      if ((users || []).some(u => String(u.username || '').trim().toLowerCase() === username.toLowerCase())) {
        return { ok: false, error: 'Tên đăng nhập này đã có người sử dụng. Vui lòng chọn tên khác.' };
      }
      if (userPhone) {
        const uDigits = normalizePhoneDigits(userPhone);
        if (uDigits.length < 9) {
          return { ok: false, error: 'Số điện thoại cá nhân chưa đủ chữ số hợp lệ (tối thiểu 9 số).' };
        }
        if ((users || []).some(u => u.phone && normalizePhoneDigits(u.phone) === uDigits)) {
          return { ok: false, error: 'Số điện thoại này đã gắn với một tài khoản khác.' };
        }
      }

      const existingValid = (payload.existingEmergencyContacts || []).filter(c => c && isValidEmergencyPhone(c.phone));
      const emName = String(payload.emergencyName || '').trim();
      const emPhone = String(payload.emergencyPhone || '').trim();
      const emRel = String(payload.emergencyRelation || '').trim() || 'Người thân';

      let newEmergencyContact = null;
      if (emName || emPhone) {
        if (!emName) {
          return { ok: false, error: 'Vui lòng nhập Tên người thân nhận cuộc gọi/SMS khẩn cấp.' };
        }
        if (!isValidEmergencyPhone(emPhone)) {
          return { ok: false, error: 'Số điện thoại khẩn cấp bắt buộc phải hợp lệ (tối thiểu 9 chữ số, ví dụ: 0912345678).' };
        }
        newEmergencyContact = {
          id: 'fc-reg-' + Date.now(),
          name: emName,
          relation: emRel,
          phone: emPhone,
          email: '',
          priority: existingValid.length === 0 ? 1 : existingValid.length + 1,
          autoSos: true,
          channels: ['Gọi điện', 'SMS', 'Zalo'],
          note: 'Số khẩn cấp bắt buộc khi đăng ký tài khoản'
        };
      } else if (existingValid.length === 0) {
        return { ok: false, error: 'Bắt buộc phải thiết lập ít nhất 1 Số điện thoại khẩn cấp khi tạo tài khoản để bảo vệ SOS.' };
      }

      return {
        ok: true,
        newAccount: {
          username,
          password,
          fullName,
          role,
          phone: userPhone || undefined
        },
        newEmergencyContact
      };
    }

    function loadSavedDeviceAccounts() {
      const list = loadJSON('smart_health_saved_accounts', []);

    function rememberDeviceAccount(user) {
      if (!user || !user.username) return;
      try {
        localStorage.setItem('smart_health_last_username', user.username);
      } catch {}
      const list = loadSavedDeviceAccounts().filter(
        a => a.username.toLowerCase() !== String(user.username).toLowerCase()
      );
      list.unshift({
        username: user.username,
        fullName: user.fullName || user.username,
        role: user.role || 'Thành Viên Gia Đình',
        phone: user.phone || ''
      });
      if (list.length > 6) list.length = 6;
      saveJSON('smart_health_saved_accounts', list);
    }

      const list = loadSavedDeviceAccounts().filter(

    /* ========================================================================
       2B. LOGIC CHUẨN KỸ THUẬT: ESP32 THỰC TẾ, THUỐC 2 BƯỚC, LỌC KHÍ, RBAC, AI SCOPE, THEME
       ======================================================================== */
    function normalizeTheme(theme) {
      return theme === 'dark' ? 'dark' : 'light';
    }

    function computeAqiFromPm25(pm25) {
      const p = Number(pm25);
      if (!Number.isFinite(p) || p <= 0) return 15;
      if (p <= 12) return Math.round((50 / 12) * p);
      if (p <= 35.4) return Math.round(50 + ((100 - 50) / (35.4 - 12)) * (p - 12));
      if (p <= 55.4) return Math.round(100 + ((150 - 100) / (55.4 - 35.4)) * (p - 35.4));
      if (p <= 150.4) return Math.round(150 + ((200 - 150) / (150.4 - 55.4)) * (p - 55.4));
      return Math.min(500, Math.round(200 + (p - 150.4)));
    }

    function parseEsp32Telemetry(raw) {
      let data = raw;
      if (typeof raw === 'string') {
        const trimmed = raw.trim();
        if (!trimmed) return { valid: false, error: 'Gói dữ liệu ESP32 trống.' };
        try {
          data = JSON.parse(trimmed);
        } catch {
          return { valid: false, error: 'Không thể giải mã JSON từ ESP32.' };
        }
      }
      if (!data || typeof data !== 'object' || Array.isArray(data)) {
        return { valid: false, error: 'Định dạng gói dữ liệu ESP32 không hợp lệ.' };
      }

      const toRange = (val, min, max) => {
        if (val === undefined || val === null || val === '') return undefined;
        const n = Number(val);
        if (!Number.isFinite(n) || n < min || n > max) return undefined;
        return n;
      };

      const bpm = toRange(data.bpm ?? data.heartRate, 30, 220);
      const spo2 = toRange(data.spo2, 50, 100);
      const bodyTemp = toRange(data.bodyTemp ?? data.tempBody, 32, 43);
      const pm25 = toRange(data.pm25, 0, 1000);
      const aqi = toRange(data.aqi, 0, 500) ?? (pm25 !== undefined ? computeAqiFromPm25(pm25) : undefined);
      const roomTemp = toRange(data.roomTemp ?? data.temp, -10, 65);
      const roomHumid = toRange(data.roomHumid ?? data.humidity, 0, 100);
      const purifierLevel = (data.purifierLevel === 1 || data.purifierLevel === 2 || data.purifierLevel === 3) ? data.purifierLevel : undefined;
      const purifierMode = (data.purifierMode === 'auto' || data.purifierMode === 'manual') ? data.purifierMode : undefined;
      const rssi = toRange(data.rssi, -120, 0);

      let traySensors;
      if (data.traySensors && typeof data.traySensors === 'object' && !Array.isArray(data.traySensors)) {
        traySensors = {};
        Object.entries(data.traySensors).forEach(([k, v]) => {
          if (typeof v === 'boolean') traySensors[k] = v;
        });
      }

      const hasAnyTelemetry = bpm !== undefined || spo2 !== undefined || bodyTemp !== undefined ||
        pm25 !== undefined || roomTemp !== undefined || roomHumid !== undefined ||
        (traySensors && Object.keys(traySensors).length > 0) || Boolean(data.faultCode) || Boolean(data.sosTriggered);

      if (!hasAnyTelemetry) {
        return { valid: false, error: 'Gói ESP32 không chứa thông số cảm biến hợp lệ nào.' };
      }

      return {
        valid: true,
        payload: {
          deviceId: String(data.deviceId || 'ESP32-NODE-01').slice(0, 48),
          roomCode: String(data.roomCode || 'GIA-DINH-01').slice(0, 32),
          source: data.source === 'esp32_serial' || data.source === 'esp32_ble' || data.source === 'esp32_wifi' || data.source === 'simulation'
            ? data.source : 'esp32_wifi',
          firmware: data.firmware ? String(data.firmware).slice(0, 32) : undefined,
          rssi,
          bpm,
          spo2,
          bodyTemp,
          pm25,
          aqi,
          roomTemp,
          roomHumid,
          purifierMode,
          purifierLevel,
          traySensors,
          sosTriggered: Boolean(data.sosTriggered),
          faultCode: data.faultCode ? String(data.faultCode).slice(0, 64) : undefined,
          faultDetail: data.faultDetail ? String(data.faultDetail).slice(0, 200) : undefined,
          receivedAt: Number.isFinite(Number(data.receivedAt)) ? Number(data.receivedAt) : Date.now()
        }
      };
    }

    function evaluateDeviceHealth(esp32, nowMs = Date.now()) {
      const timeoutMs = esp32.heartbeatTimeoutMs || 15000;
      const src = esp32.connectionMode || 'none';
      const sourceLabels = {
        none: 'Chưa kết nối ESP32',
        esp32_wifi: 'ESP32 Wi-Fi HTTP Thực tế',
        esp32_serial: 'ESP32 USB Serial Thực tế',
        esp32_ble: 'ESP32 Bluetooth BLE Thực tế',
        simulation: 'Chế độ Mô phỏng Kiểm thử'
      };
      const sourceLabel = sourceLabels[src] || sourceLabels.none;

      if (src === 'none' || !esp32.lastHeartbeatAt) {
        return {
          status: 'idle',
          isOnline: false,
          isHardwareReal: false,
          secondsSinceLastBeat: null,
          sourceLabel,
          headline: 'Chưa nhận tín hiệu từ phần cứng ESP32',
          detail: 'Kết nối qua Wi-Fi HTTP, USB Serial hoặc Bluetooth BLE để nhận dữ liệu cảm biến trực tiếp.'
        };
      }

      const elapsedSec = Math.max(0, Math.floor((nowMs - esp32.lastHeartbeatAt) / 1000));
      const isReal = src === 'esp32_wifi' || src === 'esp32_serial' || src === 'esp32_ble';

      if (esp32.lastFaultCode) {
        return {
          status: 'fault',
          isOnline: elapsedSec <= timeoutMs / 1000,
          isHardwareReal: isReal,
          secondsSinceLastBeat: elapsedSec,
          sourceLabel,
          headline: `Cảnh báo lỗi cảm biến: ${esp32.lastFaultCode}`,
          detail: esp32.lastFaultDetail || 'Cảm biến phần cứng gửi mã lỗi. Cần kiểm tra dây nối I2C / nguồn ESP32.'
        };
      }

      if (nowMs - esp32.lastHeartbeatAt > timeoutMs && src !== 'simulation') {
        return {
          status: 'disconnected',
          isOnline: false,
          isHardwareReal: isReal,
          secondsSinceLastBeat: elapsedSec,
          sourceLabel,
          headline: `Mất kết nối thiết bị ESP32 (${elapsedSec} giây trước)`,
          detail: 'Hệ thống không nhận được gói heartbeat mới. Kiểm tra nguồn ESP32, Wi-Fi hoặc dây USB.'
        };
      }

      return {
        status: 'connected',
        isOnline: true,
        isHardwareReal: isReal,
        secondsSinceLastBeat: elapsedSec,
        sourceLabel,
        headline: isReal ? 'ESP32 đang truyền dữ liệu trực tiếp' : 'Đang chạy chế độ mô phỏng kiểm thử (không phải phần cứng thật)',
        detail: `Cập nhật cách đây ${elapsedSec} giây${esp32.rssi ? ` • Tín hiệu Wi-Fi: ${esp32.rssi} dBm` : ''}`
      };
    }

    function evaluateAirQuality(input) {
      const pm25 = Number(input.pm25) || 0;
      const aqi = Number.isFinite(Number(input.aqi)) ? Number(input.aqi) : computeAqiFromPm25(pm25);
      const roomTemp = Number(input.roomTemp) || 0;
      const roomHumid = Number(input.roomHumid) || 0;

      let recommendedLevel = 1;
      let label = 'Trong lành (Tốt)';
      let colorHex = '#0F6B52';
      let recommendation = 'Không khí an toàn cho người cao tuổi. Duy trì Mức 1 (Êm dịu ban đêm).';

      if (pm25 >= 50 || aqi >= 150) {
        recommendedLevel = 3;
        label = 'Ô nhiễm cao — Cần lọc tối đa';
        colorHex = '#8C2D38';
        recommendation = 'Bụi mịn PM2.5 tăng cao gây kích ứng hô hấp. Hệ thống khuyến nghị chạy Mức 3 (Turbo) và đóng kín cửa.';
      } else if (pm25 >= 25 || aqi >= 75) {
        recommendedLevel = 2;
        label = 'Trung bình — Bụi mịn tăng nhẹ';
        colorHex = '#9E5808';
        recommendation = 'Nên chạy máy lọc không khí ở Mức 2 (Trung bình) để đưa PM2.5 về ngưỡng an toàn.';
      }

      const comfortWarnings = [];
      if (roomTemp >= 32) comfortWarnings.push('Nhiệt độ phòng cao (>32°C), cần bật quạt/điều hòa tránh sốc nhiệt.');
      else if (roomTemp > 0 && roomTemp <= 18) comfortWarnings.push('Phòng hơi lạnh (≤18°C), cần giữ ấm cổ ngực cho người cao tuổi.');
      if (roomHumid >= 75) comfortWarnings.push('Độ ẩm cao (≥75%), dễ sinh nấm mốc hô hấp.');
      else if (roomHumid > 0 && roomHumid <= 35) comfortWarnings.push('Không khí khô (≤35%), nên uống thêm nước ấm.');

      const levelLabels = {
        1: 'Mức 1 — Thấp / Ngủ êm (< 25 dB)',
        2: 'Mức 2 — Trung bình (Cân bằng)',
        3: 'Mức 3 — Cao / Turbo (Lọc nhanh HEPA)'
      };

      const activeLevel = input.mode === 'auto' ? recommendedLevel : (input.manualLevel || 1);

      return {
        aqi, pm25, label, colorHex, recommendedLevel, activeLevel,
        activeLevelLabel: levelLabels[activeLevel],
        recommendation, comfortWarnings
      };
    }

    function resolveSlotDoseState(input, nowMs = Date.now()) {
      const takenOut = Array.isArray(input.takenOutLogs)
        ? input.takenOutLogs.find(l => l.trayId === input.trayId && l.slotKey === input.slotKey && l.dateKey === input.dateKey)
        : undefined;
      const consumed = Array.isArray(input.takeLogs)
        ? input.takeLogs.find(l => l.trayId === input.trayId && l.slotKey === input.slotKey && l.dateKey === input.dateKey)
        : undefined;

      if (consumed) {
        return {
          stage: 'consumed',
          badgeText: 'ĐÃ UỐNG THUỐC',
          badgeTone: 'emerald',
          takenOutTime: takenOut ? takenOut.time : null,
          consumedTime: consumed.time,
          confirmedBy: consumed.confirmedBy || 'Người dùng',
          isUnconfirmedWarning: false,
          minutesSinceTakenOut: 0
        };
      }

      if (takenOut) {
        const elapsedMin = takenOut.timestamp ? Math.max(0, Math.floor((nowMs - takenOut.timestamp) / 60000)) : 0;
        const warn = elapsedMin >= 15;
        return {
          stage: 'taken_out',
          badgeText: warn ? 'ĐÃ LẤY KHỎI KHAY · QUÁ 15 PHÚT CHƯA UỐNG' : 'ĐÃ LẤY KHỎI KHAY · CHỜ XÁC NHẬN UỐNG',
          badgeTone: warn ? 'rose' : 'amber',
          takenOutTime: takenOut.time,
          consumedTime: null,
          confirmedBy: null,
          isUnconfirmedWarning: warn,
          minutesSinceTakenOut: elapsedMin
        };
      }

      if (input.slotEnabled && input.nowMinutes > input.slotTimeMinutes + 15) {
        return {
          stage: 'overdue',
          badgeText: 'QUÁ GIỜ CHƯA LẤY THUỐC',
          badgeTone: 'rose',
          takenOutTime: null,
          consumedTime: null,
          confirmedBy: null,
          isUnconfirmedWarning: false,
          minutesSinceTakenOut: 0
        };
      }

      return {
        stage: 'scheduled',
        badgeText: input.slotEnabled ? 'CHỜ ĐẾN GIỜ' : 'ĐANG TẮT CỮ NÀY',
        badgeTone: 'slate',
        takenOutTime: null,
        consumedTime: null,
        confirmedBy: null,
        isUnconfirmedWarning: false,
        minutesSinceTakenOut: 0
      };
    }

    function buildDefaultSchedule() {
      const sched = {};
      MEDICATION_TIMING_SLOTS.forEach(s => {
        sched[s.key] = {
          time: s.defaultTime,
          enabled: true,
          timing: s.timing,
          medicines: s.defaultMeds,
          note: s.note,
          pouchPresent: true
        };
      });
      return sched;
    }

    function normalizeTraySchedule(tray) {
      const sch = (tray && tray.schedule) ? tray.schedule : {};
      if (sch.morningBefore && sch.morningAfter && sch.noonAfternoon && sch.evening) {
        MEDICATION_TIMING_SLOTS.forEach(s => {
          const d = sch[s.key];
          if (!d.timing) d.timing = s.timing;
          if (!d.note) d.note = s.note;
          if (d.pouchPresent === undefined) d.pouchPresent = true;
        });
        return tray;
      }
      const migrated = buildDefaultSchedule();
      if (sch.morning) {
        migrated.morningAfter.time = sch.morning.time || migrated.morningAfter.time;
        migrated.morningAfter.enabled = sch.morning.enabled !== false;
        if (sch.morning.medicines) migrated.morningAfter.medicines = sch.morning.medicines;
      }
      if (sch.noon) {
        migrated.noonAfternoon.time = sch.noon.time || migrated.noonAfternoon.time;
        migrated.noonAfternoon.enabled = sch.noon.enabled !== false;
        if (sch.noon.medicines) migrated.noonAfternoon.medicines = sch.noon.medicines;
      }
      if (sch.evening) {
        migrated.evening.time = sch.evening.time || migrated.evening.time;
        migrated.evening.enabled = sch.evening.enabled !== false;
        if (sch.evening.medicines) migrated.evening.medicines = sch.evening.medicines;
      }
      tray.schedule = migrated;
      return tray;
    }

      renderSosFlowStep();
      renderModal();
    }

    function logActivity(category, level, title, detail, actor = '') {
      const entry = {
        id: 'act-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
        category: category || 'device',
        level: level || 'info',
        title: title || '',
        detail: detail || '',
        actor: actor || (state.currentUser ? state.currentUser.fullName : 'Hệ thống'),
        time: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
        dateKey: todayKey(),
        timestamp: Date.now()
      };
      state.activityLogs.unshift(entry);
      if (state.activityLogs.length > 80) state.activityLogs.length = 80;
      saveJSON('smart_health_activity_logs', state.activityLogs);

      if (window.location.protocol.startsWith('http')) {
        fetch('/api/family-sync/' + encodeURIComponent(state.familyRoomCode) + '/activity', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(entry)
        }).catch(() => {});
      }
      return entry;
    }

    function applyIncomingEsp32Telemetry(raw, sourceOverride) {
      const parsed = parseEsp32Telemetry(raw);
      if (!parsed.valid) return parsed;
      const p = parsed.payload;
      if (sourceOverride) p.source = sourceOverride;

      const wasDisconnected = state.esp32.disconnectAlerted;
      state.esp32.connectionMode = p.source;
      state.esp32.deviceId = p.deviceId;
      if (p.firmware) state.esp32.firmware = p.firmware;
      if (p.rssi !== undefined) state.esp32.rssi = p.rssi;
      state.esp32.lastHeartbeatAt = p.receivedAt || Date.now();
      state.esp32.disconnectAlerted = false;
      state.esp32.lastPayloadJson = JSON.stringify(p);

      const healthLabelMap = {
        esp32_wifi: `ESP32 Wi-Fi (${p.deviceId})`,
        esp32_serial: `ESP32 USB Serial (${p.deviceId})`,
        esp32_ble: `ESP32 Bluetooth BLE (${p.deviceId})`,
        simulation: 'Mô phỏng kiểm thử'
      };
      state.airSensorSourceLabel = healthLabelMap[p.source] || p.source;
      state.airSensorUpdatedAt = new Date(state.esp32.lastHeartbeatAt).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      if (wasDisconnected) {
        logActivity('device', 'info', `ESP32 ${p.deviceId} đã kết nối lại`, `Nguồn: ${state.airSensorSourceLabel}`, 'ESP32 Hardware');
      }

      if (p.faultCode) {
        if (state.esp32.lastFaultCode !== p.faultCode) {
          logActivity('device', 'danger', `Lỗi phần cứng: ${p.faultCode}`, p.faultDetail || 'Kiểm tra cảm biến ESP32.', p.deviceId);
        }
        state.esp32.lastFaultCode = p.faultCode;
        state.esp32.lastFaultDetail = p.faultDetail || 'Cảm biến báo lỗi đọc dữ liệu.';
      } else {
        state.esp32.lastFaultCode = null;
        state.esp32.lastFaultDetail = null;
      }

      if (p.pm25 !== undefined) state.pm25 = Number(p.pm25.toFixed(1));
      if (p.aqi !== undefined) state.aqi = Math.round(p.aqi);
      if (p.roomTemp !== undefined) state.roomTemp = Number(p.roomTemp.toFixed(1));
      if (p.roomHumid !== undefined) state.roomHumid = Math.round(p.roomHumid);
      if (p.purifierMode) state.purifierMode = p.purifierMode;
      if (p.purifierLevel) state.purifierLevel = p.purifierLevel;
      else if (state.purifierMode === 'auto' && p.pm25 !== undefined) {
        state.purifierLevel = computeAutoPurifierLevel(state.pm25);
      }
      state.purifierScenario = p.source === 'simulation' ? 'Kiểm thử mô phỏng' : `Cảm biến thực tế (${state.airSensorUpdatedAt})`;

      let m = state.members.find(x => x.id === state.selectedMemberId) || state.members[0] || null;
      if (!m && (p.bpm !== undefined || p.spo2 !== undefined || p.bodyTemp !== undefined)) {
        m = {
          id: 'wearer-esp32-' + Date.now(),
          name: 'Người đeo ESP32 (' + p.deviceId + ')',
          age: 68,
          restBPM: p.bpm !== undefined ? Math.round(p.bpm) : 74,
          avgSpO2: p.spo2 !== undefined ? Math.round(p.spo2) : 98,
          bodyTemp: p.bodyTemp !== undefined ? Number(p.bodyTemp.toFixed(1)) : 36.6,
          wristbandId: p.deviceId,
          record: { permanentAddress: state.emergencyLocation.address || '' }
        };
        state.members.push(m);
        state.selectedMemberId = m.id;
        state.profileMemberId = m.id;
      }
      if (m) {
        if (p.bpm !== undefined) m.restBPM = Math.round(p.bpm);
        if (p.spo2 !== undefined) m.avgSpO2 = Math.round(p.spo2);
        if (p.bodyTemp !== undefined) m.bodyTemp = Number(p.bodyTemp.toFixed(1));
        saveJSON('smart_health_members', state.members);
      }

      if (p.traySensors && typeof p.traySensors === 'object') {
        const dKey = todayKey();
        Object.entries(p.traySensors).forEach(([slotKey, present]) => {
          const tray = state.trays[0];
          if (!tray || !tray.schedule || !tray.schedule[slotKey]) return;
          const prev = tray.schedule[slotKey].pouchPresent !== false;
          if (prev !== present) {
            tray.schedule[slotKey].pouchPresent = present;
            const slotMeta = MEDICATION_TIMING_SLOTS.find(s => s.key === slotKey);
            const nowTime = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
            if (!present) {
              // Bước 1: Đã lấy thuốc khỏi khay — CHƯA đánh dấu ĐÃ UỐNG
              if (!state.takenOutLogs.some(l => l.trayId === tray.id && l.slotKey === slotKey && l.dateKey === dKey)) {
                state.takenOutLogs.unshift({
                  id: 'tout-' + Date.now(),
                  trayId: tray.id,
                  trayNumber: tray.trayNumber,
                  slotKey,
                  slotLabel: slotMeta ? slotMeta.shortLabel : slotKey,
                  dateKey: dKey,
                  time: nowTime,
                  source: p.source,
                  timestamp: Date.now()
                });
                saveJSON('smart_health_taken_out_logs', state.takenOutLogs);
              }
              const evt = {
                id: 'obs-' + Date.now(),
                trayId: tray.id,
                trayNumber: tray.trayNumber,
                slotKey,
                slotLabel: slotMeta ? slotMeta.shortLabel : slotKey,
                memberName: tray.assignedMemberName,
                pouchPresent: false,
                time: nowTime,
                timestamp: Date.now(),
                note: `Cảm biến ESP32 phát hiện túm thuốc cữ ${slotMeta ? slotMeta.shortLabel : slotKey} ĐÃ ĐƯỢC LẤY RA KHỎI KHAY lúc ${nowTime}. Chờ người bệnh xác nhận đã uống thuốc.`
              };
              state.obstacleAlerts.unshift(evt);
              if (state.obstacleAlerts.length > 30) state.obstacleAlerts.length = 30;
              saveJSON('smart_health_obstacle_alerts', state.obstacleAlerts);
              state.activeObstacleBanner = evt;
              logActivity('medication', 'warn', `Lấy thuốc khỏi khay (${slotMeta ? slotMeta.shortLabel : slotKey})`, evt.note, p.deviceId);
              renderObstacleAlertBanner();
            } else {
              logActivity('medication', 'info', `Đặt lại túm thuốc vào khay (${slotMeta ? slotMeta.shortLabel : slotKey})`, 'Cảm biến vật cản ghi nhận khay đã có túm thuốc mới.', p.deviceId);
            }
          }
        });
        saveJSON('smart_health_trays', state.trays);
      }

      if (p.sosTriggered) {
        logActivity('sos', 'danger', 'Nút SOS phần cứng ESP32 được nhấn!', `Thiết bị ${p.deviceId} gửi tín hiệu cầu cứu vật lý.`, p.deviceId);
      }

      renderWatchdogBanner();
      updateDashboardTelemetryDOM();
      return { valid: true, payload: p };
    }

    async function connectEsp32Serial() {
      if (!('serial' in navigator)) {
        logActivity('device', 'warn', 'Trình duyệt không hỗ trợ Web Serial', 'Vui lòng dùng Chrome/Edge Desktop hoặc kết nối ESP32 qua Wi-Fi HTTP POST /api/esp32/telemetry.');
        renderMain();
        return;
      }
      try {
        const port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });
        state.esp32.serialConnected = true;
        state.esp32.serialPortRef = port;
        state.esp32.connectionMode = 'esp32_serial';
        state.esp32.simulationEnabled = false;
        logActivity('device', 'info', 'Đã mở cổng USB Serial ESP32 (115200 baud)', 'Đang lắng nghe dòng JSON từ vi điều khiển ESP32.');
        renderMain();

        const decoder = new TextDecoderStream();
        port.readable.pipeTo(decoder.writable).catch(() => {});
        const reader = decoder.readable.getReader();
        let buffer = '';
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += value;
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';
          for (const line of lines) {
            if (line.trim().startsWith('{')) {
              applyIncomingEsp32Telemetry(line.trim(), 'esp32_serial');
            }
          }
        }
      } catch (err) {
        state.esp32.serialConnected = false;
        logActivity('device', 'warn', 'Ngắt kết nối USB Serial ESP32', err && err.message ? err.message : 'Người dùng hủy hoặc rút cáp USB.');
        renderWatchdogBanner();
        renderMain();
      }
    }

    async function connectEsp32Ble() {
      if (!('bluetooth' in navigator)) {
        logActivity('device', 'warn', 'Trình duyệt không hỗ trợ Web Bluetooth', 'Hãy dùng Chrome/Edge hoặc kết nối ESP32 qua Wi-Fi HTTP POST.');
        renderMain();
        return;
      }
      try {
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'ESP32' }, { namePrefix: 'SMART' }],
          optionalServices: ['0000ffe0-0000-1000-8000-00805f9b34fb', '6e400001-b5a3-f393-e0a9-e50e24dcca9e']
        });
        const server = await device.gatt.connect();
        state.esp32.bleConnected = true;
        state.esp32.bleDeviceRef = device;
        state.esp32.connectionMode = 'esp32_ble';
        state.esp32.simulationEnabled = false;
        state.esp32.deviceId = device.name || 'ESP32-BLE';
        state.esp32.lastHeartbeatAt = Date.now();
        logActivity('device', 'info', `Đã ghép đôi BLE với ${state.esp32.deviceId}`, 'Sẵn sàng nhận GATT Notify từ ESP32.');
        device.addEventListener('gattserverdisconnected', () => {
          state.esp32.bleConnected = false;
          state.esp32.disconnectAlerted = true;
          logActivity('device', 'danger', `Mất kết nối Bluetooth BLE (${state.esp32.deviceId})`, 'Thiết bị BLE ngoài tầm phủ sóng hoặc tắt nguồn.');
          renderWatchdogBanner();
          renderMain();
        });
        const services = await server.getPrimaryServices();
        for (const svc of services) {
          const chars = await svc.getCharacteristics();
          for (const ch of chars) {
            if (ch.properties.notify) {
              await ch.startNotifications();
              ch.addEventListener('characteristicvaluechanged', (ev) => {
                const txt = new TextDecoder().decode(ev.target.value);
                applyIncomingEsp32Telemetry(txt, 'esp32_ble');
              });
            }
          }
        }
        renderMain();
      } catch (err) {
        logActivity('device', 'warn', 'Kết nối BLE chưa hoàn tất', err && err.message ? err.message : 'Người dùng đã đóng hộp thoại chọn thiết bị.');
        renderMain();
      }
    }

    function toggleEsp32Simulation() {
      const perms = getRolePermissions(state.currentUser ? state.currentUser.role : '');
      if (!perms.canControlPurifier && !perms.canEditMedication) return;
      state.esp32.simulationEnabled = !state.esp32.simulationEnabled;
      if (state.esp32.simulationEnabled) {
        state.esp32.connectionMode = 'simulation';
        state.esp32.lastHeartbeatAt = Date.now();
        state.esp32.disconnectAlerted = false;
        state.airSensorSourceLabel = 'Mô phỏng kiểm thử (Demo)';
        state.airSensorUpdatedAt = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        logActivity('device', 'warn', 'Bật Chế độ Mô phỏng Kiểm thử', 'Dữ liệu hiện tại đang dao động kiểm thử, KHÔNG phải tín hiệu phần cứng ESP32 thật.');
      } else {
        state.esp32.connectionMode = 'none';
        state.esp32.lastHeartbeatAt = null;
        state.airSensorSourceLabel = 'Chưa nhận dữ liệu ESP32';
        state.purifierScenario = 'Chờ cảm biến ESP32';
        logActivity('device', 'info', 'Đã tắt Chế độ Mô phỏng Kiểm thử', 'Hệ thống quay về trạng thái chờ kết nối phần cứng ESP32 thực tế.');
      }
      renderWatchdogBanner();
      renderMain();
    }

    async function sendPurifierCommand(mode, level) {
      const perms = getRolePermissions(state.currentUser ? state.currentUser.role : '');
      if (!perms.canControlPurifier) {
        state.familySyncNotice = 'Tài khoản Chỉ xem không có quyền điều khiển máy lọc không khí.';
        renderMain();
        return;
      }
      state.purifierMode = mode;
      state.purifierLevel = mode === 'auto' ? computeAutoPurifierLevel(state.pm25) : level;
      logActivity('air', 'info', `Điều khiển máy lọc không khí: ${mode === 'auto' ? 'Tự động AI' : 'Thủ công Mức ' + state.purifierLevel}`, `PM2.5 hiện tại: ${state.pm25} µg/m³.`);
      if (window.location.protocol.startsWith('http')) {
        try {
          await fetch('/api/esp32/command/' + encodeURIComponent(state.familyRoomCode), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ purifierMode: state.purifierMode, purifierLevel: state.purifierLevel, actor: state.currentUser ? state.currentUser.fullName : 'Web UI' })
          });
        } catch {}
      }
      renderMain();
    }

    function confirmSlotConsumed(trayId, slotKey) {
      const perms = getRolePermissions(state.currentUser ? state.currentUser.role : '');
      if (!perms.canConfirmOwnDose) {
        state.medScheduleNotice = 'Tài khoản Người thân Chỉ xem không thể xác nhận thay việc đã uống thuốc.';
        renderMain();
        return;
      }
      const tray = state.trays.find(t => t.id === trayId);
      const slotMeta = MEDICATION_TIMING_SLOTS.find(s => s.key === slotKey);
      const dKey = todayKey();
      const nowTime = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
      if (!state.takeLogs.some(l => l.trayId === trayId && l.slotKey === slotKey && l.dateKey === dKey)) {
        state.takeLogs.unshift({
          id: 'tlog-' + Date.now(),
          trayId,
          trayNumber: tray ? tray.trayNumber : 1,
          slotKey,
          slotLabel: slotMeta ? slotMeta.shortLabel : slotKey,
          dateKey: dKey,
          time: nowTime,
          confirmedBy: state.currentUser ? state.currentUser.fullName : 'Người bệnh',
          timestamp: Date.now()
        });
        saveJSON('smart_health_take_logs', state.takeLogs);
      }
      if (state.activeObstacleBanner && state.activeObstacleBanner.trayId === trayId && state.activeObstacleBanner.slotKey === slotKey) {
        state.activeObstacleBanner = null;
        renderObstacleAlertBanner();
      }
      state.activeMedReminder = null;
      renderMedReminderBanner();
      state.medScheduleNotice = `Đã xác nhận ĐÃ UỐNG THUỐC cữ ${slotMeta ? slotMeta.shortLabel : slotKey} lúc ${nowTime}.`;
      logActivity('medication', 'info', `Xác nhận ĐÃ UỐNG THUỐC (${slotMeta ? slotMeta.shortLabel : slotKey})`, `Khay #${tray ? tray.trayNumber : 1} hoàn tất đủ 2 bước: Lấy khỏi khay -> Đã uống lúc ${nowTime}.`);
      renderMain();
    }

    function applySyncedRoomPayload(payload, triggerChime = false) {
      if (!payload || typeof payload !== 'object') return;
      const prevSosId = state.activeFamilySos ? state.activeFamilySos.id : null;
      if (Array.isArray(payload.contacts)) {
        state.familyContacts = removeStaleTestContact(payload.contacts);
        saveJSON('smart_health_family_contacts', state.familyContacts);
      }
      if (Array.isArray(payload.messages)) {
        state.familyMessages = payload.messages;
        saveJSON('smart_health_family_messages', state.familyMessages);
      }
      if (Array.isArray(payload.dailyLogs) && payload.dailyLogs.length > 0) {
        const merged = [...payload.dailyLogs];
        state.dailyLogs.forEach(localItem => {
          if (!merged.some(x => x.id === localItem.id)) merged.push(localItem);
        });
        merged.sort((a, b) => (b.dateKey !== a.dateKey ? String(b.dateKey).localeCompare(String(a.dateKey)) : (b.createdAt || 0) - (a.createdAt || 0)));
        state.dailyLogs = merged.slice(0, 90);
        saveJSON('smart_health_daily_logs', state.dailyLogs);
      }
      if (Array.isArray(payload.activityLogs) && payload.activityLogs.length > 0) {
        const mergedAct = [...payload.activityLogs];
        state.activityLogs.forEach(localAct => {
          if (!mergedAct.some(x => x.id === localAct.id)) mergedAct.push(localAct);
        });
        mergedAct.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
        state.activityLogs = mergedAct.slice(0, 80);
        saveJSON('smart_health_activity_logs', state.activityLogs);
      }
      if ('activeSos' in payload) {
        state.activeFamilySos = payload.activeSos;
        saveJSON('smart_health_active_sos', state.activeFamilySos);
      }
      const nextSosId = state.activeFamilySos ? state.activeFamilySos.id : null;
      if (triggerChime && nextSosId && nextSosId !== prevSosId) {
        playChime();
      }
    }

    function broadcastLocalSync(type, payload) {
      if (familyChannel) {
        try { familyChannel.postMessage({ room: state.familyRoomCode, type, payload }); } catch {}
      }
    }

    if (familyChannel) {
      familyChannel.onmessage = (ev) => {
        const d = ev.data;
        if (!d || d.room !== state.familyRoomCode) return;
        applySyncedRoomPayload(d.payload, true);
        renderLiveSosBanner();
        if (state.sosFlowCompleted && state.activeTab === 'dashboard' && !document.activeElement?.matches('input, select, textarea')) {
          renderMain();
        }
      };
    }

    window.addEventListener('storage', (e) => {
      if (e.key === 'smart_health_active_sos' || e.key === 'smart_health_family_messages' || e.key === 'smart_health_family_contacts' || e.key === 'smart_health_daily_logs' || e.key === 'smart_health_activity_logs') {
        state.activeFamilySos = loadJSON('smart_health_active_sos', null);
        state.familyMessages = loadJSON('smart_health_family_messages', []);
        state.familyContacts = removeStaleTestContact(loadJSON('smart_health_family_contacts', []));
        state.dailyLogs = loadJSON('smart_health_daily_logs', []);
        state.activityLogs = loadJSON('smart_health_activity_logs', []);
        renderLiveSosBanner();
        if (state.sosFlowCompleted && state.activeTab === 'dashboard' && !document.activeElement?.matches('input, select, textarea')) {
          renderMain();
        }
      }
    });

    async function pullFamilyRoomFromServer() {
      if (!window.location.protocol.startsWith('http')) return;
      try {
        const res = await fetch('/api/family-sync/' + encodeURIComponent(state.familyRoomCode));
        if (!res.ok) return;
        const data = await res.json();

        let esp32Updated = false;
        // Nhận telemetry ESP32 thực tế từ backend (nếu có phần cứng Wi-Fi HTTP POST)
        const dev = data.esp32Device;
        const devBeatAt = dev ? (dev.lastTelemetryAt || dev.lastHeartbeatAt) : null;
        if (dev && devBeatAt && devBeatAt !== state.esp32.lastHeartbeatAt) {
          esp32Updated = true;
          const srcMap = { http: 'esp32_wifi', serial: 'esp32_serial', ble: 'esp32_ble', sim: 'simulation', none: 'none' };
          const lt = dev.latestTelemetry || dev;
          const mappedSrc = srcMap[dev.source] || dev.source || 'esp32_wifi';
          applyIncomingEsp32Telemetry({
            deviceId: dev.deviceId,
            roomCode: state.familyRoomCode,
            source: mappedSrc,
            firmware: dev.firmware,
            rssi: dev.rssi,
            bpm: lt.bpm,
            spo2: lt.spo2,
            bodyTemp: lt.bodyTemp,
            pm25: lt.pm25,
            aqi: lt.aqi,
            roomTemp: lt.roomTemp,
            roomHumid: lt.roomHumid,
            purifierMode: dev.purifierMode || lt.purifierMode,
            purifierLevel: dev.purifierLevel || lt.purifierLevel,
            traySensors: lt.traySensors,
            faultCode: dev.faultCode || lt.faultCode || dev.lastFaultCode,
            faultDetail: dev.faultDetail || lt.faultDetail || dev.lastFaultDetail,
            receivedAt: devBeatAt
          }, mappedSrc);
        }

        const beforeStr = JSON.stringify({ c: state.familyContacts, m: state.familyMessages, s: state.activeFamilySos, d: state.dailyLogs.length, a: state.activityLogs.length });
        const nextContacts = (data.contacts && data.contacts.length > 0) ? removeStaleTestContact(data.contacts) : state.familyContacts;
        const nextMessages = (data.messages && data.messages.length > 0) ? data.messages : state.familyMessages;
        const nextLogsCount = Array.isArray(data.dailyLogs) && data.dailyLogs.length > state.dailyLogs.length ? data.dailyLogs.length : state.dailyLogs.length;
        const nextActCount = Array.isArray(data.activityLogs) && data.activityLogs.length > state.activityLogs.length ? data.activityLogs.length : state.activityLogs.length;
        const afterStr = JSON.stringify({
          c: nextContacts,
          m: nextMessages,
          s: data.activeSos !== undefined ? data.activeSos : state.activeFamilySos,
          d: nextLogsCount,
          a: nextActCount
        });
        let shouldRefreshUi = esp32Updated;
        if (beforeStr !== afterStr) {
          applySyncedRoomPayload({
            contacts: nextContacts,
            messages: nextMessages,
            dailyLogs: Array.isArray(data.dailyLogs) ? data.dailyLogs : [],
            activityLogs: Array.isArray(data.activityLogs) ? data.activityLogs : [],
            activeSos: data.activeSos
          }, true);
          renderLiveSosBanner();
          shouldRefreshUi = true;
        }
        if (Array.isArray(data.obstacleEvents) && data.obstacleEvents.length > 0) {
          const newest = data.obstacleEvents[0];
          const targetTrayId = newest.trayId || (state.trays[0] ? state.trays[0].id : 'tray-1');
          if (!newest.pouchPresent && !state.obstacleAlerts.some(a => a.id === newest.id)) {
            state.obstacleAlerts.unshift({ ...newest, trayId: targetTrayId, note: newest.note || newest.message });
            if (state.obstacleAlerts.length > 30) state.obstacleAlerts.length = 30;
            saveJSON('smart_health_obstacle_alerts', state.obstacleAlerts);
            const dKey = todayKey();
            if (!state.takenOutLogs.some(l => l.trayId === targetTrayId && l.slotKey === newest.slotKey && l.dateKey === dKey)) {
              state.takenOutLogs.unshift({
                id: 'tout-' + Date.now(),
                trayId: targetTrayId,
                trayNumber: newest.trayNumber || 1,
                slotKey: newest.slotKey,
                slotLabel: newest.slotLabel || newest.slotKey,
                dateKey: dKey,
                time: newest.time,
                source: 'esp32_wifi',
                timestamp: newest.timestamp || Date.now()
              });
              saveJSON('smart_health_taken_out_logs', state.takenOutLogs);
            }
            state.activeObstacleBanner = { ...newest, trayId: targetTrayId, note: newest.note || newest.message };

    async function sendFamilyRoomMessage(text, type = 'checkin') {
