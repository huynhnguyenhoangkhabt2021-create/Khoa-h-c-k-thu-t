                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;">
                  <div style="font-size:12.5px;font-weight:800;color:var(--rose-deep);">LIÊN KẾT SĐT NGƯỜI NHÀ THEO THỨ TỰ ƯU TIÊN (${sortedContacts.length}):</div>
                  <button type="button" id="btn-copy-sos-msg" class="pill-btn" style="padding:4px 9px;font-size:12.5px;background:var(--panel-bg);color:var(--accent-navy);">
                    ${svgIcon('copy', 12)} Sao Chép Tin Nhắn Kèm Địa Chỉ
                  </button>
                </div>
                ${sortedContacts.length === 0 ? `
                  <div style="font-size:13.5px;color:var(--text-secondary);">
                    Chưa liên kết SĐT người nhà.
                    ${sosPhone ? ` Số khẩn cấp trong hồ sơ: <a href="tel:${esc(sosPhone.replace(/\D/g, ''))}" style="color:var(--accent-navy);font-weight:800;">Gọi ngay</a>` : ''}
                  </div>
                ` : `
                  <div style="display:flex;flex-direction:column;gap:6px;max-height:125px;overflow-y:auto;">
                    ${sortedContacts.map(fc => {
                      const cleanTel = (fc.phone || '').replace(/\D/g, '');
                      const shownPhone = state.sensitiveUnlocked ? fc.phone : maskText(fc.phone, 3);
                      return `
                        <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px;padding:8px 10px;border-radius:9px;background:var(--panel-bg);border:1px solid var(--rose-border);">
                          <div style="font-size:13.5px;">
                            <strong style="color:var(--rose-deep);">Ưu tiên ${fc.priority || 1}</strong> · <strong style="color:var(--text-primary);">${esc(fc.name)}</strong> (${esc(fc.relation)}) • <span class="font-mono" style="color:var(--text-secondary);">${esc(shownPhone)}</span>
                            ${fc.note ? `<div style="font-size:12px;color:var(--text-muted);">${esc(fc.note)}</div>` : ''}
                          </div>
                          <div style="display:flex;flex-wrap:wrap;gap:5px;">
                            <a href="tel:${esc(cleanTel)}" class="pill-btn" style="padding:5px 10px;font-size:12.5px;background:var(--surface-emerald);color:var(--emerald-brand);border-color:var(--border-emerald);text-decoration:none;">
                              ${svgIcon('phone', 12)} Gọi Ngay
                            </a>
                            <a href="sms:${esc(cleanTel)}?body=${sosSmsBody}" class="pill-btn" style="padding:5px 10px;font-size:12.5px;background:var(--surface-blue);color:var(--accent-navy);border-color:var(--border-blue);text-decoration:none;">
                              Gửi SMS Ngay
                            </a>
                            <a href="https://zalo.me/${esc(cleanTel)}" target="_blank" rel="noopener noreferrer" class="pill-btn" style="padding:5px 10px;font-size:12.5px;background:var(--surface-cyan);color:var(--accent-cyan);border-color:var(--border-cyan);text-decoration:none;">
                              Zalo
                            </a>
                          </div>
                        </div>
                      `;
                    }).join('')}
                  </div>
                `}
              </div>

              <div style="display:flex;flex-wrap:wrap;gap:8px;">
                <a href="tel:115" class="pill-btn" style="flex:1;min-height:46px;justify-content:center;background:#8C2D38;color:#FFFFFF;text-decoration:none;border:none;font-size:15px;">
                  ${svgIcon('phone', 15)} GỌI 115 NGAY
                </a>
                <button id="btn-sos-safe" class="pill-btn" style="flex:1;min-height:46px;justify-content:center;background:var(--surface-emerald);color:var(--emerald-brand);border-color:var(--border-emerald);font-size:15px;">
                  ${svgIcon('check', 15)} Đã Kết Nối &amp; An Toàn
                </button>
              </div>
            </div>
          </div>
        `;

        document.getElementById('btn-sos-export-pdf').onclick = () => {
          const res = exportHealthReportPDF(patient);
          state.sosSentMessage = `Đã xuất báo cáo PDF (${res.fileName}, ${res.pageCount} trang A4) gồm Phụ lục Thông Tin Liên Hệ Gia Đình cho bác sĩ!`;
          renderModal();
        };
        document.getElementById('btn-sos-mute').onclick = () => {
          state.sosMuted = !state.sosMuted;
          if (state.sosMuted) stopSiren();
          else startSiren();
          renderModal();
        };
        document.getElementById('btn-sos-gps').onclick = () => {
          initAlwaysOnGeolocation(true);
          renderModal();
        };
        const copySosBtn = document.getElementById('btn-copy-sos-msg');
        if (copySosBtn) {
          copySosBtn.onclick = () => {
            if (navigator.clipboard) {
              navigator.clipboard.writeText(plainAlertText).catch(() => {});
            }
            state.sosSentMessage = 'Đã sao chép nội dung SMS SOS kèm địa chỉ & tọa độ GPS để gửi nhanh cho người nhà.';
            renderModal();
          };
        }
        root.querySelectorAll('.sos-cond-btn').forEach(b => {
          b.onclick = () => { state.sosCondition = b.dataset.cond; renderModal(); };
        });
        document.getElementById('btn-send-web-sos').onclick = async () => {
          await autoDispatchEmergencySos(state.sosCondition, true);
          renderModal();
        };
        document.getElementById('btn-sos-safe').onclick = async () => {
          stopSiren();
          await resolveRealSosAlert();
          state.sosSentMessage = '';
          closeModal();
        };
      }
    }

    function renderSOSFab() {
      const el = document.getElementById('sos-root');
      el.innerHTML = `
        <button id="btn-floating-sos" class="sos-fab-btn animate-glow-red" title="Kích hoạt cảnh báo khẩn cấp SOS">
          ${svgIcon('alert', 20)}
          <span>CẤP CỨU SOS</span>
        </button>
      `;
      document.getElementById('btn-floating-sos').onclick = async () => {
        if (!state.currentUser) {
          state.activeModal = 'sosAuth';
          renderModal();
          return;
        }
        if (!getSosReadiness().ready) {
          state.sosSetupError = 'Vui lòng hoàn tất Vị trí và SĐT ưu tiên để kích hoạt tự động gửi SMS khi gặp nguy hiểm.';
          state.activeModal = 'sosSetup';
          initAlwaysOnGeolocation(true);
          renderModal();
          return;
        }
        state.sosMuted = false;
        state.sosSentMessage = '';
        state.activeModal = 'sosActive';
        initAlwaysOnGeolocation(true);
        startSiren();
        if ('Notification' in window && Notification.permission === 'default') {
          Notification.requestPermission().catch(() => {});
        }
        renderModal();
        await autoDispatchEmergencySos(state.sosCondition, true);
        if (state.activeModal === 'sosActive') renderModal();
      };
    }

    /* ========================================================================
       15. ĐIỀU PHỐI RENDER & VÒNG LẶP THỜI GIAN THỰC
       ======================================================================== */
    function renderMain() {
      const main = document.getElementById('app-main');
      stopPPGAnimation();
      if (!state.currentUser) {
        renderAuthGate(main, 'Hệ Thống Smart Healthcare');
        return;
      }
      if (!state.sosFlowCompleted) {
        renderSosFlowStep(main);
        return;
      }
      if (state.activeTab === 'ai') renderAITab(main);
      else if (state.activeTab === 'dashboard') renderDashboardTab(main);
      else if (state.activeTab === 'medication') renderMedicationTab(main);
      else if (state.activeTab === 'profile') renderHealthProfileTab(main);
    }

    function renderAll() {
      renderHeader();
      renderPrivacyBanner();
      renderWatchdogBanner();
      renderLiveSosBanner();
      renderMedReminderBanner();
      renderObstacleAlertBanner();
      renderNav();
      renderMain();
      renderSOSFab();
    }

    function checkMedicationReminders() {
      if (!state.currentUser) return;
      const now = new Date();
      const hhmm = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
      const dayCode = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'][now.getDay()];
      const tKey = todayKey();

      for (const rawTray of state.trays) {
        const tray = normalizeTraySchedule(rawTray);
        const days = Array.isArray(tray.daysOfWeek) && tray.daysOfWeek.length > 0 ? tray.daysOfWeek : ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];
        if (!days.includes(dayCode)) continue;
        for (const slot of MEDICATION_TIMING_SLOTS) {
          const dose = tray.schedule[slot.key];
          if (!dose || !dose.enabled || dose.time !== hhmm) continue;
          const alreadyTaken = state.takeLogs.some(l =>
            l.dateKey === tKey &&
            (l.trayId === tray.id || l.trayNumber === tray.trayNumber) &&
            (l.slotKey === slot.key || l.session === slot.shortLabel || l.session === slot.dayPart)
          );
          if (alreadyTaken) continue;
          const remKey = `${tKey}_${hhmm}_${tray.id}_${slot.key}`;
          if (state.remindedSlots[remKey]) continue;
          state.remindedSlots[remKey] = true;
          const timingText = dose.timing || slot.timing;
          const noteText = dose.note || slot.note;
          state.activeMedReminder = {
            trayId: tray.id,
            trayNumber: tray.trayNumber,
            memberName: tray.assignedMemberName,
            slotKey: slot.key,
            dayPart: slot.dayPart,
            shortLabel: slot.shortLabel,
            timing: timingText,
            time: dose.time,
            note: noteText,
            medicines: dose.medicines || slot.defaultMeds
          };
          renderMedReminderBanner();
          playChime();
          speakVi(`Đến giờ uống thuốc ${slot.dayPart}, ${timingText} cho ${tray.assignedMemberName}. Lưu ý: ${noteText}`);
          if ('Notification' in window && Notification.permission === 'granted') {
            new Notification('Nhắc Giờ Uống Thuốc - Smart Healthcare', {
              body: `${tray.assignedMemberName}: ${slot.dayPart} (${timingText}) — Lưu ý: ${noteText}`
            });
          }
          break;
        }
      }
    }

    // Đồng hồ số & cảm biến môi trường cập nhật mỗi giây/2 giây
    setInterval(() => {
      const now = new Date();
      const tEl = document.getElementById('live-clock-time');
      const dEl = document.getElementById('live-clock-date');
      if (tEl) tEl.textContent = now.toLocaleTimeString('vi-VN', { hour12: false });
      if (dEl) dEl.textContent = now.toLocaleDateString('vi-VN', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' });
    }, 1000);

    function updateDashboardTelemetryDOM() {
      const aqiStatus = state.aqi <= 50
        ? { label: 'Trong lành (Tốt)', color: 'var(--emerald)', bg: 'var(--surface-emerald)' }
        : state.aqi <= 100
        ? { label: 'Trung bình', color: 'var(--amber)', bg: 'var(--surface-amber)' }
        : { label: 'Ô nhiễm — Cần lọc mạnh', color: 'var(--rose-ink)', bg: 'var(--rose-soft)' };

      const b = document.getElementById('dash-aqi-badge');
      const a = document.getElementById('dash-aqi-val');
      const p = document.getElementById('dash-pm25-val');
      const t = document.getElementById('dash-temp-val');
      const h = document.getElementById('dash-humid-val');
      const s = document.getElementById('dash-sensor-updated');
      if (b) { b.textContent = aqiStatus.label; b.style.color = aqiStatus.color; b.style.background = aqiStatus.bg; b.style.borderColor = aqiStatus.color; }
      if (a) { a.innerHTML = `${state.aqi} <span style="font-size:13px;font-weight:600;">AQI</span>`; a.style.color = aqiStatus.color; }
      if (p) p.textContent = `${state.pm25.toFixed(1)} µg/m³`;
      if (t) t.textContent = `${state.roomTemp.toFixed(1)}°C`;
      if (h) h.textContent = `${state.roomHumid}%`;
      if (s) {
        s.innerHTML = `<div><strong>Nguồn đo:</strong> ${esc(state.airSensorSourceLabel)}</div><div><strong>Cập nhật lúc:</strong> ${esc(state.airSensorUpdatedAt || 'Chưa nhận gói cảm biến ESP32')}</div>`;
      }
    }

    setInterval(() => {
      const nowMs = Date.now();

      // 1. Chỉ tạo biến thiên mô phỏng khi người dùng CHỦ ĐỘNG bật Chế độ Mô phỏng Kiểm thử
      if (state.esp32.simulationEnabled === true) {
        state.roomTemp = Number((state.roomTemp + (Math.random() - 0.5) * 0.2).toFixed(1));
        state.roomHumid = Math.max(42, Math.min(75, Math.round(state.roomHumid + (Math.random() - 0.5) * 2)));
        const prevLevel = state.purifierLevel;
        if (state.purifierLevel >= 2 && state.pm25 > 14) {
          state.pm25 = Math.max(12, Number((state.pm25 - (state.purifierLevel === 3 ? 2.8 : 1.1)).toFixed(1)));
          state.aqi = Math.max(30, Math.round(state.pm25 * 2.1));
          if (state.purifierMode === 'auto') {
            state.purifierLevel = computeAutoPurifierLevel(state.pm25);
          }
        }
        state.esp32.connectionMode = 'simulation';
        state.esp32.lastHeartbeatAt = nowMs;
        state.airSensorSourceLabel = 'Mô phỏng kiểm thử (Demo)';
        state.airSensorUpdatedAt = new Date(nowMs).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        if (state.sosFlowCompleted && state.activeTab === 'dashboard') {
          if (prevLevel !== state.purifierLevel && !document.activeElement?.matches('input, select, textarea')) {
            renderMain();
          } else {
            updateDashboardTelemetryDOM();
          }
        }
      }

      // 2. Watchdog kiểm tra mất kết nối phần cứng ESP32 thật (>15s không có heartbeat mới)
      const health = evaluateDeviceHealth(state.esp32, nowMs);
      if (health.status === 'disconnected' && !state.esp32.disconnectAlerted) {
        state.esp32.disconnectAlerted = true;
        logActivity('device', 'danger', 'Watchdog: Mất kết nối phần cứng ESP32', health.detail, state.esp32.deviceId || 'ESP32');
        renderWatchdogBanner();
        if (state.sosFlowCompleted && state.activeTab === 'dashboard' && !document.activeElement?.matches('input, select, textarea')) {
          renderMain();
        }
      } else if (health.status === 'disconnected' || health.status === 'fault') {
        renderWatchdogBanner();
      }

      // 3. Tự động khóa lại thông tin nhạy cảm sau 5 phút
      if (state.sensitiveUnlocked && state.sensitiveUnlockedAt && (nowMs - state.sensitiveUnlockedAt > 5 * 60 * 1000)) {
        state.sensitiveUnlocked = false;
        state.sensitiveUnlockedAt = 0;
        logActivity('security', 'info', 'Tự động khóa thông tin định danh sau 5 phút', 'Hệ thống tự ẩn CCCD, BHYT và SĐT để bảo vệ quyền riêng tư.');
        if (!document.activeElement?.matches('input, select, textarea')) {
          renderMain();
        }
      }
    }, 2500);

    // Đồng bộ phòng gia đình, cảnh báo SOS & nhắc lịch uống thuốc
    setInterval(() => {
      pullFamilyRoomFromServer();
      checkMedicationReminders();
    }, 3000);

    // Khởi chạy ứng dụng theo luồng 3 bước: Đăng nhập -> SOS -> Các phần còn lại
    renderAll();
    initAlwaysOnGeolocation(Boolean(state.currentUser));
    pullFamilyRoomFromServer();
    checkMedicationReminders();
  })();
  </script>
</body>
</html>
